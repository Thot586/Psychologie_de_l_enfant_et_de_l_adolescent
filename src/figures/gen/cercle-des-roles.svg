<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 122" role="img" aria-labelledby="cercle-des-roles-t cercle-des-roles-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="cercle-des-roles-t">Le harcèlement est une scène avec un public</title><desc id="cercle-des-roles-d">Quatre rôles autour de l&#x27;auteur et de la victime, d&#x27;après Salmivalli et al. (1996) : les assistants aident l&#x27;auteur ; les renforçateurs rient et encouragent ; les spectateurs passifs, dont le silence vaut permission ; les défenseurs protègent la victime. Faire basculer les témoins vers la défense est le levier central des programmes efficaces.</desc><rect class="box-b" x="20.0" y="16.0" width="141.0" height="86.0" rx="8"/><text class="t-b" x="30.0" y="36.0">Assistants</text><text class="t-sm" x="30.0" y="54.0">aident l&#x27;auteur</text><text class="t-sm" x="30.0" y="68.0">→ renforcent</text><rect class="box-b" x="173.0" y="16.0" width="141.0" height="86.0" rx="8"/><text class="t-b" x="183.0" y="36.0">Renforçateurs</text><text class="t-sm" x="183.0" y="54.0">rient, encouragent</text><text class="t-sm" x="183.0" y="68.0">→ renforcent</text><rect class="box-a" x="326.0" y="16.0" width="141.0" height="86.0" rx="8"/><text class="t-b" x="336.0" y="36.0">Spectateurs passifs</text><text class="t-sm" x="336.0" y="54.0">regardent sans agir</text><text class="t-sm" x="336.0" y="68.0">silence =</text><text class="t-sm" x="336.0" y="82.0">permission</text><rect class="box-s" x="479.0" y="16.0" width="141.0" height="86.0" rx="8"/><text class="t-b" x="489.0" y="36.0">Défenseurs</text><text class="t-sm" x="489.0" y="54.0">protègent la</text><text class="t-sm" x="489.0" y="68.0">victime</text><text class="t-sm" x="489.0" y="82.0">→ arrêtent</text></svg>