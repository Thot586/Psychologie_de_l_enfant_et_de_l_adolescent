<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" width="640" height="272" role="img" aria-labelledby="comparateur-prevalences-t comparateur-prevalences-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="comparateur-prevalences-t">Des chiffres qui ne se comparent pas terme à terme</title><desc id="comparateur-prevalences-d">Barres horizontales de prévalence déclarée, chaque étiquette portant la population et la période interrogée. Madagascar, enquête scolaire nationale de 2025 : 27,2 % d&#x27;élèves de 13 à 17 ans harcelés à l&#x27;école dans l&#x27;année (OMS, 2025). Monde : 32 % d&#x27;élèves harcelés au cours du mois écoulé, 144 pays et territoires (UNESCO, 2019). Afrique subsaharienne : 38,8 % de victimation chez 25 454 adolescents scolarisés de 11 pays, de 22,2 % à Maurice à 54,6 % en Sierra Leone, Madagascar non inclus (Aboagye et al., 2021a). Afrique, synthèse de 25 études et 41 716 adolescents : 46,35 %, intervalle de 41,45 à 51,24 (Rtbey et al., 2025). Madagascar, estimation associative de 2023-2024 relayée par la presse : 58 % d&#x27;élèves de 10 à 21 ans, sans rapport primaire ni méthode publiée (L&#x27;Express de Madagascar, 2025). Les périodes de rappel diffèrent, mois ou année, les populations aussi : les comparaisons directes ne sont pas justifiées, et la dernière barre est une estimation associative, pas une donnée d&#x27;enquête.</desc><line class="grid" x1="250.0" y1="12" x2="250.0" y2="238"/><text class="t-sm" x="250.0" y="254" text-anchor="middle">0</text><line class="grid" x1="303.3" y1="12" x2="303.3" y2="238"/><text class="t-sm" x="303.3" y="254" text-anchor="middle">10</text><line class="grid" x1="356.7" y1="12" x2="356.7" y2="238"/><text class="t-sm" x="356.7" y="254" text-anchor="middle">20</text><line class="grid" x1="410.0" y1="12" x2="410.0" y2="238"/><text class="t-sm" x="410.0" y="254" text-anchor="middle">30</text><line class="grid" x1="463.3" y1="12" x2="463.3" y2="238"/><text class="t-sm" x="463.3" y="254" text-anchor="middle">40</text><line class="grid" x1="516.7" y1="12" x2="516.7" y2="238"/><text class="t-sm" x="516.7" y="254" text-anchor="middle">50</text><line class="grid" x1="570.0" y1="12" x2="570.0" y2="238"/><text class="t-sm" x="570.0" y="254" text-anchor="middle">60</text><path class="f1" d="M250.0,28 h141.06666666666666 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-141.06666666666666 z"><title>Madagascar · 13-17 ans scolarisés, dans l&#x27;année : 27,2 %</title></path><text x="240" y="32.0" text-anchor="end" dominant-baseline="middle">Madagascar · 13-17 ans</text><text x="240" y="47.0" text-anchor="end" dominant-baseline="middle">scolarisés, dans l&#x27;année</text><text class="t-num" x="403.1" y="39" dominant-baseline="middle">27,2 %</text><path class="f1" d="M250.0,72 h166.66666666666663 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-166.66666666666663 z"><title>Monde · élèves, dans le mois, 144 pays : 32 %</title></path><text x="240" y="76.0" text-anchor="end" dominant-baseline="middle">Monde · élèves, dans le mois,</text><text x="240" y="91.0" text-anchor="end" dominant-baseline="middle">144 pays</text><text class="t-num" x="428.7" y="83" dominant-baseline="middle">32 %</text><path class="f1" d="M250.0,116 h202.93333333333334 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-202.93333333333334 z"><title>Afrique subsaharienne · 25 454 élèves de 11 pays, dans le mois : 38,8 %</title></path><line class="line" x1="368.4" y1="127" x2="541.2" y2="127" stroke-width="1.5"/><line class="line" x1="368.4" y1="121" x2="368.4" y2="133"/><line class="line" x1="541.2" y1="121" x2="541.2" y2="133"/><text x="240" y="120.0" text-anchor="end" dominant-baseline="middle">Afrique subsaharienne · 25 454</text><text x="240" y="135.0" text-anchor="end" dominant-baseline="middle">élèves de 11 pays, dans le mois</text><text class="t-num" x="549.2" y="127" dominant-baseline="middle">38,8 %</text><path class="f1" d="M250.0,160 h243.2 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-243.2 z"><title>Afrique · 41 716 adolescents, 25 études, périodes variables : 46,4 %</title></path><line class="line" x1="471.1" y1="171" x2="523.3" y2="171" stroke-width="1.5"/><line class="line" x1="471.1" y1="165" x2="471.1" y2="177"/><line class="line" x1="523.3" y1="165" x2="523.3" y2="177"/><text x="240" y="164.0" text-anchor="end" dominant-baseline="middle">Afrique · 41 716 adolescents, 25</text><text x="240" y="179.0" text-anchor="end" dominant-baseline="middle">études, périodes variables</text><text class="t-num" x="531.3" y="171" dominant-baseline="middle">46,4 %</text><path class="f1" d="M250.0,204 h305.33333333333326 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-305.33333333333326 z"><title>Madagascar · 10-21 ans, estimation associative, méthode non publiée : 58 %</title></path><text x="240" y="208.0" text-anchor="end" dominant-baseline="middle">Madagascar · 10-21 ans,</text><text x="240" y="223.0" text-anchor="end" dominant-baseline="middle">estimation associative, méthode</text><text class="t-num" x="567.3" y="215" dominant-baseline="middle">58 %</text></svg>