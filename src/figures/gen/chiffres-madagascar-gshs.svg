<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 472" width="640" height="472" role="img" aria-labelledby="chiffres-madagascar-gshs-t chiffres-madagascar-gshs-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="chiffres-madagascar-gshs-t">Ce que déclarent les élèves malagasy de 13 à 17 ans</title><desc id="chiffres-madagascar-gshs-d">Barres horizontales d&#x27;une seule couleur, classées par valeur décroissante, en pourcentage d&#x27;élèves : 62,9 % disent que leurs parents ne comprennent jamais ou rarement leurs soucis ; 54,6 % dorment moins de 8 heures par nuit ; 29,4 % ont été impliqués dans une bagarre ; 27,2 % ont été harcelés à l&#x27;école dans l&#x27;année, 26,3 % des garçons et 28,1 % des filles ; 24,6 % se sont absentés sans permission ; 10,5 % ont été cyberharcelés ; 3,5 % n&#x27;ont aucun ami proche. Enquête nationale en milieu scolaire auprès de 2 440 élèves de 13 à 17 ans dans 38 écoles ; déclarations portant sur les 12 derniers mois (OMS, 2025).</desc><line class="grid" x1="250.0" y1="12" x2="250.0" y2="438"/><text class="t-sm" x="250.0" y="454" text-anchor="middle">0</text><line class="grid" x1="282.0" y1="12" x2="282.0" y2="438"/><text class="t-sm" x="282.0" y="454" text-anchor="middle">10</text><line class="grid" x1="314.0" y1="12" x2="314.0" y2="438"/><text class="t-sm" x="314.0" y="454" text-anchor="middle">20</text><line class="grid" x1="346.0" y1="12" x2="346.0" y2="438"/><text class="t-sm" x="346.0" y="454" text-anchor="middle">30</text><line class="grid" x1="378.0" y1="12" x2="378.0" y2="438"/><text class="t-sm" x="378.0" y="454" text-anchor="middle">40</text><line class="grid" x1="410.0" y1="12" x2="410.0" y2="438"/><text class="t-sm" x="410.0" y="454" text-anchor="middle">50</text><line class="grid" x1="442.0" y1="12" x2="442.0" y2="438"/><text class="t-sm" x="442.0" y="454" text-anchor="middle">60</text><line class="grid" x1="474.0" y1="12" x2="474.0" y2="438"/><text class="t-sm" x="474.0" y="454" text-anchor="middle">70</text><line class="grid" x1="506.0" y1="12" x2="506.0" y2="438"/><text class="t-sm" x="506.0" y="454" text-anchor="middle">80</text><line class="grid" x1="538.0" y1="12" x2="538.0" y2="438"/><text class="t-sm" x="538.0" y="454" text-anchor="middle">90</text><line class="grid" x1="570.0" y1="12" x2="570.0" y2="438"/><text class="t-sm" x="570.0" y="454" text-anchor="middle">100 %</text><path class="f1" d="M250.0,28 h197.27999999999997 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-197.27999999999997 z"><title>Parents qui ne comprennent jamais ou rarement leurs soucis : 62,9 %</title></path><text x="240" y="32.0" text-anchor="end" dominant-baseline="middle">Parents qui ne comprennent</text><text x="240" y="47.0" text-anchor="end" dominant-baseline="middle">jamais ou rarement leurs soucis</text><text class="t-num" x="459.3" y="39" dominant-baseline="middle">62,9 %</text><path class="f1" d="M250.0,88 h170.72000000000003 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-170.72000000000003 z"><title>Dorment moins de 8 heures par nuit : 54,6 %</title></path><text x="240" y="92.0" text-anchor="end" dominant-baseline="middle">Dorment moins de 8 heures par</text><text x="240" y="107.0" text-anchor="end" dominant-baseline="middle">nuit</text><text class="t-num" x="432.7" y="99" dominant-baseline="middle">54,6 %</text><path class="f1" d="M250.0,148 h90.07999999999998 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-90.07999999999998 z"><title>Impliqués dans une bagarre : 29,4 %</title></path><text x="240" y="159.0" text-anchor="end" dominant-baseline="middle">Impliqués dans une bagarre</text><text class="t-num" x="352.1" y="159" dominant-baseline="middle">29,4 %</text><path class="f1" d="M250.0,208 h83.04000000000002 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-83.04000000000002 z"><title>Harcelés à l&#x27;école dans l&#x27;année : 27,2 %</title></path><text x="240" y="219.0" text-anchor="end" dominant-baseline="middle">Harcelés à l&#x27;école dans l&#x27;année</text><text class="t-num" x="345.0" y="219" dominant-baseline="middle">27,2 %</text><path class="f1" d="M250.0,268 h74.72000000000003 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-74.72000000000003 z"><title>Absents sans permission : 24,6 %</title></path><text x="240" y="279.0" text-anchor="end" dominant-baseline="middle">Absents sans permission</text><text class="t-num" x="336.7" y="279" dominant-baseline="middle">24,6 %</text><path class="f1" d="M250.0,328 h29.600000000000023 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-29.600000000000023 z"><title>Cyberharcelés : 10,5 %</title></path><text x="240" y="339.0" text-anchor="end" dominant-baseline="middle">Cyberharcelés</text><text class="t-num" x="291.6" y="339" dominant-baseline="middle">10,5 %</text><path class="f1" d="M250.0,388 h7.199999999999989 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-7.199999999999989 z"><title>Sans ami proche : 3,5 %</title></path><text x="240" y="399.0" text-anchor="end" dominant-baseline="middle">Sans ami proche</text><text class="t-num" x="269.2" y="399" dominant-baseline="middle">3,5 %</text></svg>