<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" role="img" aria-labelledby="sait-ignore-madagascar-t sait-ignore-madagascar-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="sait-ignore-madagascar-t">Ce que l&#x27;on sait, ce que l&#x27;on ignore à Madagascar</title><desc id="sait-ignore-madagascar-d">Quatre thèmes, deux colonnes : ce qui est établi, et la lacune correspondante, en gris. Combien : 27,2 % des élèves de 13 à 17 ans harcelés à l&#x27;école dans l&#x27;année et 10,5 % cyberharcelés (OMS, 2025) ; aucune donnée par région, par âge fin, ni hors du milieu scolaire. Conséquences : association durable avec des troubles anxieux et dépressifs, dans les données internationales (Arseneault, 2018 ; Moore et al., 2017) ; aucune étude de suivi malagasy. Ce qui marche : réduction d&#x27;environ 15 à 16 % de la victimation par des programmes complets, évalués surtout en Europe et en Amérique du Nord (Gaffney et al., 2021a), et 22 programmes de prévention des violences évalués en Afrique subsaharienne (Edwards et al., 2024) ; aucun programme anti-harcèlement évalué à Madagascar. Comment les enfants le disent : les enfants d&#x27;Afrique subsaharienne n&#x27;emploient presque jamais le mot violence et qualifient les actes à partir de leurs émotions (Turner et al., 2024) ; aucun outil de repérage traduit et validé en malagasy (Smith et al., 2016). Une case grise n&#x27;est pas une opinion prudente, c&#x27;est une absence de donnée : la combler par de l&#x27;intuition serait une faute.</desc><text class="t-b" x="252.5" y="30.0" text-anchor="middle">Établi</text><text class="t-b" x="497.5" y="30.0" text-anchor="middle">Lacune</text><text class="t-b" x="120.0" y="70.0" text-anchor="end">Combien</text><rect class="box-s" x="132.0" y="54.0" width="241.0" height="51.0" rx="6"/><text class="t-sm" x="138.0" y="70.0" text-anchor="start">27,2 % harcelés et 10,5 %</text><text class="t-sm" x="138.0" y="83.0" text-anchor="start">cyberharcelés chez les 13-17 ans</text><text class="t-sm" x="138.0" y="96.0" text-anchor="start">(OMS, 2025)</text><rect class="box" x="377.0" y="54.0" width="241.0" height="51.0" rx="6"/><text class="t-sm" x="383.0" y="70.0" text-anchor="start">aucune donnée par région, par âge</text><text class="t-sm" x="383.0" y="83.0" text-anchor="start">fin, ni hors milieu scolaire</text><text class="t-b" x="120.0" y="127.0" text-anchor="end">Conséquences</text><rect class="box-s" x="132.0" y="111.0" width="241.0" height="51.0" rx="6"/><text class="t-sm" x="138.0" y="127.0" text-anchor="start">association durable avec troubles</text><text class="t-sm" x="138.0" y="140.0" text-anchor="start">anxieux et dépressifs, données</text><text class="t-sm" x="138.0" y="153.0" text-anchor="start">internationales</text><rect class="box" x="377.0" y="111.0" width="241.0" height="51.0" rx="6"/><text class="t-sm" x="383.0" y="127.0" text-anchor="start">aucune étude de suivi malagasy</text><text class="t-b" x="120.0" y="184.0" text-anchor="end">Ce qui marche</text><rect class="box-s" x="132.0" y="168.0" width="241.0" height="64.0" rx="6"/><text class="t-sm" x="138.0" y="184.0" text-anchor="start">environ 15-16 % de victimation en</text><text class="t-sm" x="138.0" y="197.0" text-anchor="start">moins avec un programme complet ; 22</text><text class="t-sm" x="138.0" y="210.0" text-anchor="start">programmes évalués en Afrique</text><text class="t-sm" x="138.0" y="223.0" text-anchor="start">subsaharienne</text><rect class="box" x="377.0" y="168.0" width="241.0" height="64.0" rx="6"/><text class="t-sm" x="383.0" y="184.0" text-anchor="start">aucun programme anti-harcèlement</text><text class="t-sm" x="383.0" y="197.0" text-anchor="start">évalué à Madagascar</text><text class="t-b" x="120.0" y="254.0" text-anchor="end">Comment les</text><text class="t-b" x="120.0" y="268.0" text-anchor="end">enfants le</text><text class="t-b" x="120.0" y="282.0" text-anchor="end">disent</text><rect class="box-s" x="132.0" y="238.0" width="241.0" height="64.0" rx="6"/><text class="t-sm" x="138.0" y="254.0" text-anchor="start">les enfants d&#x27;Afrique subsaharienne</text><text class="t-sm" x="138.0" y="267.0" text-anchor="start">n&#x27;emploient presque jamais le mot «</text><text class="t-sm" x="138.0" y="280.0" text-anchor="start">violence » : ils décrivent leurs</text><text class="t-sm" x="138.0" y="293.0" text-anchor="start">émotions</text><rect class="box" x="377.0" y="238.0" width="241.0" height="64.0" rx="6"/><text class="t-sm" x="383.0" y="254.0" text-anchor="start">aucun outil de repérage traduit et</text><text class="t-sm" x="383.0" y="267.0" text-anchor="start">validé en malagasy</text></svg>