<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 242" role="img" aria-labelledby="ligne-24h-cyber-t ligne-24h-cyber-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="ligne-24h-cyber-t">Le harcèlement en ligne ne s&#x27;arrête pas à la sortie de l&#x27;école</title><desc id="ligne-24h-cyber-d">Ligne de 24 heures : le harcèlement en face à face peut se produire à l&#x27;école, de 7 h à 17 h ; en ligne, il couvre toute la journée, avec par exemple un message reçu à 22 h et une capture partagée à 6 h, sans que l&#x27;école ne voie rien. Anonymat, permanence, audience sans limite.</desc><rect class="box-p" x="30" y="26" width="580" height="64" rx="6"/><text class="t-b" x="38" y="42">École : face à face possible de 7 h à 17 h</text><circle class="f1" cx="199.2" cy="84" r="4"/><line class="line-soft" x1="199.2" y1="59" x2="199.2" y2="80"/><text class="t-sm" x="205.2" y="56.0" text-anchor="start">entrée</text><circle class="f1" cx="440.8" cy="84" r="4"/><line class="line-soft" x1="440.8" y1="59" x2="440.8" y2="80"/><text class="t-sm" x="446.8" y="56.0" text-anchor="start">sortie</text><rect class="box-b" x="30" y="96" width="580" height="64" rx="6"/><text class="t-b" x="38" y="112">En ligne : 24 h sur 24</text><circle class="f3" cx="175.0" cy="154" r="4"/><line class="line-soft" x1="175.0" y1="129" x2="175.0" y2="150"/><text class="t-sm" x="181.0" y="126.0" text-anchor="start">capture partagée à 6 h</text><circle class="f3" cx="344.2" cy="154" r="4"/><line class="line-soft" x1="344.2" y1="129" x2="344.2" y2="150"/><text class="t-sm" x="350.2" y="126.0" text-anchor="start">l&#x27;école ne voit rien</text><circle class="f3" cx="561.7" cy="154" r="4"/><line class="line-soft" x1="561.7" y1="142" x2="561.7" y2="150"/><text class="t-sm" x="555.7" y="139.0" text-anchor="end">message reçu à 22 h</text><line class="line" x1="30" y1="170" x2="610" y2="170"/><line class="line" x1="30.0" y1="166" x2="30.0" y2="174"/><text class="t-sm" x="30.0" y="188" text-anchor="middle">0 h</text><line class="line" x1="175.0" y1="166" x2="175.0" y2="174"/><text class="t-sm" x="175.0" y="188" text-anchor="middle">6 h</text><line class="line" x1="320.0" y1="166" x2="320.0" y2="174"/><text class="t-sm" x="320.0" y="188" text-anchor="middle">12 h</text><line class="line" x1="465.0" y1="166" x2="465.0" y2="174"/><text class="t-sm" x="465.0" y="188" text-anchor="middle">18 h</text><line class="line" x1="610.0" y1="166" x2="610.0" y2="174"/><text class="t-sm" x="610.0" y="188" text-anchor="middle">24 h</text><text class="t-sm" x="10.0" y="200.0" text-anchor="start">Anonymat, permanence des contenus, audience sans limite : trois choses que le harcèlement en</text><text class="t-sm" x="10.0" y="215.0" text-anchor="start">ligne ajoute (Modecki et al., 2014).</text></svg>