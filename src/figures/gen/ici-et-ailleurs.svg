<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" width="640" height="228" role="img" aria-labelledby="ici-et-ailleurs-t ici-et-ailleurs-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="ici-et-ailleurs-t">Le harcèlement subi : à Madagascar et ailleurs</title><desc id="ici-et-ailleurs-d">Barres horizontales par ordre décroissant, en pourcentage d&#x27;élèves déclarant avoir été harcelés. Madagascar, donnée associative non revue par les pairs : 58 % d&#x27;élèves de 10 à 21 ans se déclarant victimes, étude associative Imaso-Ivoho 2023-2024 rapportée par la presse, méthode non publiée (L&#x27;Express, 2025). Afrique subsaharienne : 38,8 % en moyenne sur onze pays, de 22,2 % à l&#x27;île Maurice à 54,6 % en Sierra Leone, enquêtes de 2010 à 2017, Madagascar non inclus (Aboagye et al., 2021a). Monde : 32 % d&#x27;élèves harcelés au moins une fois au cours du mois écoulé, 144 pays (UNESCO, 2019). Madagascar : 27,2 % harcelés à l&#x27;école dans l&#x27;année, 2 440 élèves de 13 à 17 ans dans 38 écoles, garçons 26,3 % et filles 28,1 % (OMS, 2025). Les périodes de rappel ne sont pas identiques d&#x27;une source à l&#x27;autre : ces chiffres ne se lisent pas comme un classement.</desc><line class="grid" x1="250.0" y1="12" x2="250.0" y2="194"/><text class="t-sm" x="250.0" y="210" text-anchor="middle">0</text><line class="grid" x1="303.3" y1="12" x2="303.3" y2="194"/><text class="t-sm" x="303.3" y="210" text-anchor="middle">10</text><line class="grid" x1="356.7" y1="12" x2="356.7" y2="194"/><text class="t-sm" x="356.7" y="210" text-anchor="middle">20</text><line class="grid" x1="410.0" y1="12" x2="410.0" y2="194"/><text class="t-sm" x="410.0" y="210" text-anchor="middle">30</text><line class="grid" x1="463.3" y1="12" x2="463.3" y2="194"/><text class="t-sm" x="463.3" y="210" text-anchor="middle">40</text><line class="grid" x1="516.7" y1="12" x2="516.7" y2="194"/><text class="t-sm" x="516.7" y="210" text-anchor="middle">50</text><line class="grid" x1="570.0" y1="12" x2="570.0" y2="194"/><text class="t-sm" x="570.0" y="210" text-anchor="middle">60</text><path class="f1" d="M250.0,28 h305.33333333333326 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-305.33333333333326 z"><title>Madagascar · donnée associative, non revue par les pairs : 58 %</title></path><text x="240" y="32.0" text-anchor="end" dominant-baseline="middle">Madagascar · donnée associative,</text><text x="240" y="47.0" text-anchor="end" dominant-baseline="middle">non revue par les pairs</text><text class="t-num" x="567.3" y="39" dominant-baseline="middle">58 %</text><path class="f1" d="M250.0,72 h202.93333333333334 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-202.93333333333334 z"><title>Afrique subsaharienne · onze pays, 2010-2017 : 38,8 %</title></path><line class="line" x1="368.4" y1="83" x2="541.2" y2="83" stroke-width="1.5"/><line class="line" x1="368.4" y1="77" x2="368.4" y2="89"/><line class="line" x1="541.2" y1="77" x2="541.2" y2="89"/><text x="240" y="76.0" text-anchor="end" dominant-baseline="middle">Afrique subsaharienne · onze</text><text x="240" y="91.0" text-anchor="end" dominant-baseline="middle">pays, 2010-2017</text><text class="t-num" x="549.2" y="83" dominant-baseline="middle">38,8 %</text><path class="f1" d="M250.0,116 h166.66666666666663 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-166.66666666666663 z"><title>Monde · harcelés dans le mois, 144 pays : 32 %</title></path><text x="240" y="120.0" text-anchor="end" dominant-baseline="middle">Monde · harcelés dans le mois,</text><text x="240" y="135.0" text-anchor="end" dominant-baseline="middle">144 pays</text><text class="t-num" x="428.7" y="127" dominant-baseline="middle">32 %</text><path class="f1" d="M250.0,160 h141.06666666666666 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-141.06666666666666 z"><title>Madagascar · harcelés à l&#x27;école dans l&#x27;année : 27,2 %</title></path><text x="240" y="164.0" text-anchor="end" dominant-baseline="middle">Madagascar · harcelés à l&#x27;école</text><text x="240" y="179.0" text-anchor="end" dominant-baseline="middle">dans l&#x27;année</text><text class="t-num" x="403.1" y="171" dominant-baseline="middle">27,2 %</text></svg>