<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 355" role="img" aria-labelledby="comparateur-convocation-t comparateur-convocation-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="comparateur-convocation-t">Une convocation qui protège, une convocation qui abîme</title><desc id="comparateur-convocation-d">Six critères comparant la forme acceptable et la forme à éviter d&#x27;une convocation ou d&#x27;un conseil de discipline. Qui est reçu : chacun individuellement, à des moments différents, plutôt que tout le monde dans la même pièce. Confrontation : aucune entre la victime et l&#x27;auteur, plutôt que faire répéter les faits devant l&#x27;auteur ou devant les familles. Présence d&#x27;un tiers : un deuxième adulte à chaque entretien, plutôt qu&#x27;un tête-à-tête sans témoin. Trace : un écrit daté et factuel avec copie remise à la famille, plutôt qu&#x27;un accord verbal sans date de revoyure. Information de l&#x27;enfant : il sait ce qui va être fait et il est prévenu du résultat, plutôt que des décisions prises entre adultes qu&#x27;il apprend par la rumeur. Sanction : ferme, éducative et réparatrice, sans humiliation, plutôt qu&#x27;une punition physique, une exposition publique ou l&#x27;affichage du nom de l&#x27;enfant auteur. D&#x27;après la méthode de la préoccupation partagée (Bellon et Gardette, 2021), les recommandations du Défenseur des droits (2023) et End Corporal Punishment (2019) pour l&#x27;interdiction du châtiment corporel à l&#x27;école à Madagascar.</desc><text class="t-b" x="252.5" y="30.0" text-anchor="middle">Ce qui protège</text><text class="t-b" x="497.5" y="30.0" text-anchor="middle">Ce qui abîme</text><text class="t-b" x="120.0" y="70.0" text-anchor="end">Qui est reçu</text><rect class="box-s" x="132.0" y="54.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="138.0" y="70.0" text-anchor="start">chacun individuellement, à des</text><text class="t-sm" x="138.0" y="83.0" text-anchor="start">moments différents</text><rect class="box-b" x="377.0" y="54.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="383.0" y="70.0" text-anchor="start">tout le monde réuni dans la même</text><text class="t-sm" x="383.0" y="83.0" text-anchor="start">pièce</text><text class="t-b" x="120.0" y="114.0" text-anchor="end">Confrontation</text><rect class="box-s" x="132.0" y="98.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="138.0" y="114.0" text-anchor="start">aucune entre la victime et l&#x27;auteur</text><rect class="box-b" x="377.0" y="98.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="383.0" y="114.0" text-anchor="start">faire répéter les faits devant</text><text class="t-sm" x="383.0" y="127.0" text-anchor="start">l&#x27;auteur ou les familles</text><text class="t-b" x="120.0" y="158.0" text-anchor="end">Présence d&#x27;un</text><text class="t-b" x="120.0" y="172.0" text-anchor="end">tiers</text><rect class="box-s" x="132.0" y="142.0" width="241.0" height="25.0" rx="6"/><text class="t-sm" x="138.0" y="158.0" text-anchor="start">un deuxième adulte à chaque entretien</text><rect class="box-b" x="377.0" y="142.0" width="241.0" height="25.0" rx="6"/><text class="t-sm" x="383.0" y="158.0" text-anchor="start">un tête-à-tête sans témoin</text><text class="t-b" x="120.0" y="189.0" text-anchor="end">Trace</text><rect class="box-s" x="132.0" y="173.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="138.0" y="189.0" text-anchor="start">un écrit daté et factuel, copie</text><text class="t-sm" x="138.0" y="202.0" text-anchor="start">remise à la famille</text><rect class="box-b" x="377.0" y="173.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="383.0" y="189.0" text-anchor="start">un accord verbal, sans trace ni date</text><text class="t-sm" x="383.0" y="202.0" text-anchor="start">de revoyure</text><text class="t-b" x="120.0" y="233.0" text-anchor="end">Information de</text><text class="t-b" x="120.0" y="247.0" text-anchor="end">l&#x27;enfant</text><rect class="box-s" x="132.0" y="217.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="138.0" y="233.0" text-anchor="start">il sait ce qui va être fait, il est</text><text class="t-sm" x="138.0" y="246.0" text-anchor="start">prévenu du résultat</text><rect class="box-b" x="377.0" y="217.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="383.0" y="233.0" text-anchor="start">des décisions entre adultes, apprises</text><text class="t-sm" x="383.0" y="246.0" text-anchor="start">par la rumeur</text><text class="t-b" x="120.0" y="277.0" text-anchor="end">Sanction</text><rect class="box-s" x="132.0" y="261.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="138.0" y="277.0" text-anchor="start">ferme, éducative, réparatrice, sans</text><text class="t-sm" x="138.0" y="290.0" text-anchor="start">humiliation</text><rect class="box-b" x="377.0" y="261.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="383.0" y="277.0" text-anchor="start">punition physique, exposition</text><text class="t-sm" x="383.0" y="290.0" text-anchor="start">publique, nom affiché</text><text class="t-sm" x="10.0" y="313.0" text-anchor="start">Le châtiment corporel est interdit à l&#x27;école à Madagascar. Aucune de ces règles ne demande de</text><text class="t-sm" x="10.0" y="328.0" text-anchor="start">moyens supplémentaires : elles demandent une méthode.</text></svg>