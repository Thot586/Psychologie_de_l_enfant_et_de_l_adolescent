<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 472" width="640" height="472" role="img" aria-labelledby="numerique-madagascar-2025-t numerique-madagascar-2025-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="numerique-madagascar-2025-t">Le numérique à Madagascar, janvier 2025</title><desc id="numerique-madagascar-2025-d">Barres horizontales en pourcentage. Madagascar, janvier 2025 : 18,2 millions de connexions mobiles, soit 56,2 % de la population, dont 84,6 % compatibles haut débit ; 6,60 millions d&#x27;internautes, soit 20,4 % ; 3,90 millions d&#x27;identités sur les réseaux sociaux, soit 12,1 %. Audiences des plateformes : Facebook 3,90 millions, Messenger 1,20 million, LinkedIn 520 000, Instagram 218 000, X 34 600 (Kemp, 2025). Comparaisons : 50 % des 15-24 ans utilisent internet en Afrique contre 82 % dans le monde (UIT, 2024) ; l&#x27;accès à internet concerne 23 % de la population dans les pays à faible revenu contre 94 % dans les pays à revenu élevé (UIT, 2025). Le cyberharcèlement concerne aujourd&#x27;hui une minorité connectée, plutôt urbaine et scolarisée.</desc><line class="grid" x1="250.0" y1="12" x2="250.0" y2="438"/><text class="t-sm" x="250.0" y="454" text-anchor="middle">0</text><line class="grid" x1="282.0" y1="12" x2="282.0" y2="438"/><text class="t-sm" x="282.0" y="454" text-anchor="middle">10</text><line class="grid" x1="314.0" y1="12" x2="314.0" y2="438"/><text class="t-sm" x="314.0" y="454" text-anchor="middle">20</text><line class="grid" x1="346.0" y1="12" x2="346.0" y2="438"/><text class="t-sm" x="346.0" y="454" text-anchor="middle">30</text><line class="grid" x1="378.0" y1="12" x2="378.0" y2="438"/><text class="t-sm" x="378.0" y="454" text-anchor="middle">40</text><line class="grid" x1="410.0" y1="12" x2="410.0" y2="438"/><text class="t-sm" x="410.0" y="454" text-anchor="middle">50</text><line class="grid" x1="442.0" y1="12" x2="442.0" y2="438"/><text class="t-sm" x="442.0" y="454" text-anchor="middle">60</text><line class="grid" x1="474.0" y1="12" x2="474.0" y2="438"/><text class="t-sm" x="474.0" y="454" text-anchor="middle">70</text><line class="grid" x1="506.0" y1="12" x2="506.0" y2="438"/><text class="t-sm" x="506.0" y="454" text-anchor="middle">80</text><line class="grid" x1="538.0" y1="12" x2="538.0" y2="438"/><text class="t-sm" x="538.0" y="454" text-anchor="middle">90</text><line class="grid" x1="570.0" y1="12" x2="570.0" y2="438"/><text class="t-sm" x="570.0" y="454" text-anchor="middle">100 %</text><path class="f1" d="M250.0,28 h175.84000000000003 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-175.84000000000003 z"><title>Connexions mobiles · 18,2 millions : 56,2 %</title></path><text x="240" y="32.0" text-anchor="end" dominant-baseline="middle">Connexions mobiles · 18,2</text><text x="240" y="47.0" text-anchor="end" dominant-baseline="middle">millions</text><text class="t-num" x="437.8" y="39" dominant-baseline="middle">56,2 %</text><path class="f1" d="M250.0,88 h61.27999999999997 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-61.27999999999997 z"><title>Internautes · 6,60 millions : 20,4 %</title></path><text x="240" y="99.0" text-anchor="end" dominant-baseline="middle">Internautes · 6,60 millions</text><text class="t-num" x="323.3" y="99" dominant-baseline="middle">20,4 %</text><path class="f1" d="M250.0,148 h34.72000000000003 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-34.72000000000003 z"><title>Réseaux sociaux · 3,90 millions d&#x27;identités : 12,1 %</title></path><text x="240" y="152.0" text-anchor="end" dominant-baseline="middle">Réseaux sociaux · 3,90 millions</text><text x="240" y="167.0" text-anchor="end" dominant-baseline="middle">d&#x27;identités</text><text class="t-num" x="296.7" y="159" dominant-baseline="middle">12,1 %</text><path class="f1" d="M250.0,208 h156.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-156.0 z"><title>15-24 ans connectés · Afrique : 50 %</title></path><text x="240" y="219.0" text-anchor="end" dominant-baseline="middle">15-24 ans connectés · Afrique</text><text class="t-num" x="418.0" y="219" dominant-baseline="middle">50 %</text><path class="f1" d="M250.0,268 h258.4 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-258.4 z"><title>15-24 ans connectés · monde : 82 %</title></path><text x="240" y="279.0" text-anchor="end" dominant-baseline="middle">15-24 ans connectés · monde</text><text class="t-num" x="520.4" y="279" dominant-baseline="middle">82 %</text><path class="f1" d="M250.0,328 h69.60000000000002 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-69.60000000000002 z"><title>Accès à internet · pays à faible revenu : 23 %</title></path><text x="240" y="332.0" text-anchor="end" dominant-baseline="middle">Accès à internet · pays à faible</text><text x="240" y="347.0" text-anchor="end" dominant-baseline="middle">revenu</text><text class="t-num" x="331.6" y="339" dominant-baseline="middle">23 %</text><path class="f1" d="M250.0,388 h296.79999999999995 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-296.79999999999995 z"><title>Accès à internet · pays à revenu élevé : 94 %</title></path><text x="240" y="392.0" text-anchor="end" dominant-baseline="middle">Accès à internet · pays à revenu</text><text x="240" y="407.0" text-anchor="end" dominant-baseline="middle">élevé</text><text class="t-num" x="558.8" y="399" dominant-baseline="middle">94 %</text></svg>