<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" role="img" aria-labelledby="cerveau-deux-vitesses-t cerveau-deux-vitesses-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="cerveau-deux-vitesses-t">Les deux vitesses du cerveau adolescent (schéma qualitatif)</title><desc id="cerveau-deux-vitesses-d">Deux courbes sans unité sur un axe des âges de 10 à 25 ans : la sensibilité à la récompense et au regard des pairs monte vite dès la puberté, culmine vers 15-17 ans puis redescend lentement ; le contrôle de soi monte lentement et régulièrement jusque vers 20-25 ans. L&#x27;écart entre les deux, entre 13 et 20 ans, est étiqueté écart de maturité. Schéma qualitatif d&#x27;après le modèle à deux systèmes (Shulman et al., 2016 ; Icenogle et al., 2019) : il explique une vulnérabilité et un besoin de cadre, il ne déresponsabilise personne.</desc><defs><marker id="cerveau-deux-vitesses-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><rect class="f2 area" x="150.0" y="30" width="210.0" height="220"/><text class="t-sm" x="255.0" y="44.0" text-anchor="middle">écart de maturité</text><line class="line" x1="60" y1="250" x2="510" y2="250"/><line class="line" x1="60" y1="250" x2="60" y2="30"/><line class="line" x1="60.0" y1="250" x2="60.0" y2="255"/><text class="t-sm" x="60.0" y="268" text-anchor="middle">10</text><line class="line" x1="120.0" y1="250" x2="120.0" y2="255"/><text class="t-sm" x="120.0" y="268" text-anchor="middle">12</text><line class="line" x1="180.0" y1="250" x2="180.0" y2="255"/><text class="t-sm" x="180.0" y="268" text-anchor="middle">14</text><line class="line" x1="240.0" y1="250" x2="240.0" y2="255"/><text class="t-sm" x="240.0" y="268" text-anchor="middle">16</text><line class="line" x1="300.0" y1="250" x2="300.0" y2="255"/><text class="t-sm" x="300.0" y="268" text-anchor="middle">18</text><line class="line" x1="360.0" y1="250" x2="360.0" y2="255"/><text class="t-sm" x="360.0" y="268" text-anchor="middle">20</text><line class="line" x1="420.0" y1="250" x2="420.0" y2="255"/><text class="t-sm" x="420.0" y="268" text-anchor="middle">22</text><line class="line" x1="510.0" y1="250" x2="510.0" y2="255"/><text class="t-sm" x="510.0" y="268" text-anchor="middle">25</text><text class="t-sm" x="285.0" y="284" text-anchor="middle">âge (années)</text><text class="t-sm" x="66" y="22" text-anchor="start">niveau (sans unité)</text><path class="curve s1" d="M60.0,206.0 C90.0,206.0 90.0,151.0 120.0,151.0 C150.0,151.0 150.0,74.0 180.0,74.0 C210.0,74.0 210.0,47.6 240.0,47.6 C270.0,47.6 270.0,63.0 300.0,63.0 C330.0,63.0 330.0,91.6 360.0,91.6 C390.0,91.6 390.0,113.6 420.0,113.6 C465.0,113.6 465.0,129.0 510.0,129.0"/><text class="t-sm" x="518.0" y="133.0" text-anchor="start">sensibilité à la</text><text class="t-sm" x="518.0" y="146.0" text-anchor="start">récompense et</text><text class="t-sm" x="518.0" y="159.0" text-anchor="start">aux pairs</text><path class="curve s2" d="M60.0,210.4 C90.0,210.4 90.0,192.8 120.0,192.8 C150.0,192.8 150.0,170.8 180.0,170.8 C210.0,170.8 210.0,144.4 240.0,144.4 C270.0,144.4 270.0,118.0 300.0,118.0 C330.0,118.0 330.0,91.6 360.0,91.6 C390.0,91.6 390.0,69.6 420.0,69.6 C465.0,69.6 465.0,52.0 510.0,52.0"/><text class="t-sm" x="518.0" y="56.0" text-anchor="start">contrôle de soi</text><text class="t-sm" x="10.0" y="296.0" text-anchor="start">Schéma qualitatif, pas des mesures. Vers 16 ans, les capacités de raisonnement approchent</text><text class="t-sm" x="10.0" y="311.0" text-anchor="start">celles de l&#x27;adulte ; la maturité psychosociale progresse encore entre 18 et 21 ans (Icenogle et</text><text class="t-sm" x="10.0" y="326.0" text-anchor="start">al., 2019). Il explique une vulnérabilité et un besoin de cadre ; il ne déresponsabilise</text><text class="t-sm" x="10.0" y="341.0" text-anchor="start">personne.</text></svg>