<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="modele-ecologique-t modele-ecologique-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="modele-ecologique-t">Quatre couches : l&#x27;enfant, la famille, l&#x27;école, la société</title><desc id="modele-ecologique-d">Quatre anneaux concentriques : l&#x27;enfant (tempérament, handicap, statut), la famille (soutien, violence, enfants confiés), l&#x27;école (surveillance, classes surchargées, adultes formés), la société (pauvreté, normes, lois). Les facteurs de l&#x27;enfant et de la famille sont documentés par des études solides ; ceux de l&#x27;école et de la société à Madagascar relèvent souvent de l&#x27;hypothèse.</desc><circle class="box" cx="230" cy="230" r="210.0"/><circle class="box-a" cx="230" cy="230" r="157.5"/><circle class="box-s" cx="230" cy="230" r="105.0"/><circle class="box-p" cx="230" cy="230" r="52.5"/><text class="t-b" x="230" y="234.0" text-anchor="middle">L&#x27;enfant</text><text class="t-b" x="230" y="155.2" text-anchor="middle">La famille</text><text class="t-b" x="230" y="102.8" text-anchor="middle">L&#x27;école</text><text class="t-b" x="230" y="50.2" text-anchor="middle">La société</text><circle class="box-p" cx="470" cy="34" r="6"/><text class="t-b" x="484" y="38">L&#x27;enfant</text><text class="t-sm" x="484" y="54">tempérament, handicap,</text><text class="t-sm" x="484" y="68">statut</text><circle class="box-s" cx="470" cy="88" r="6"/><text class="t-b" x="484" y="92">La famille</text><text class="t-sm" x="484" y="108">soutien, violence,</text><text class="t-sm" x="484" y="122">enfants confiés</text><circle class="box-a" cx="470" cy="142" r="6"/><text class="t-b" x="484" y="146">L&#x27;école</text><text class="t-sm" x="484" y="162">surveillance, classes</text><text class="t-sm" x="484" y="176">surchargées, adultes</text><text class="t-sm" x="484" y="190">formés</text><circle class="box" cx="470" cy="210" r="6"/><text class="t-b" x="484" y="214">La société</text><text class="t-sm" x="484" y="230">pauvreté, normes, lois</text></svg>