<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 258" role="img" aria-labelledby="comparateur-27-58-t comparateur-27-58-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="comparateur-27-58-t">Deux chiffres malagasy, deux statuts</title><desc id="comparateur-27-58-d">Tableau à deux colonnes comparant, ligne par ligne, l&#x27;enquête scolaire nationale de 2025 (27,2 % d&#x27;élèves harcelés) et le chiffre de 58 % qui circule dans la presse. Qui a été interrogé : 2 440 élèves de 13 à 17 ans dans 38 écoles, taux de réponse de 87,2 % pour l&#x27;enquête, contre des élèves de 10 à 21 ans d&#x27;effectif non précisé pour le chiffre de presse. Définition : harcèlement à l&#x27;école, question standardisée, contre non précisé. Période : les 12 derniers mois, contre non précisé. Méthode : tirage au sort à deux degrés, contre méthode non publiée. Publication : fiche de résultats publiée (OMS, 2025), contre aucun rapport primaire retrouvé, seulement des articles de presse (L&#x27;Express de Madagascar, 2025 ; Newsmada, 2024). Cinq réponses manquantes sur cinq à droite.</desc><text class="t-b" x="252.5" y="30.0" text-anchor="middle">Enquête nationale 2025 · 27,2 %</text><text class="t-b" x="497.5" y="30.0" text-anchor="middle">Chiffre de presse · 58 %</text><text class="t-b" x="120.0" y="70.0" text-anchor="end">Qui a été</text><text class="t-b" x="120.0" y="84.0" text-anchor="end">interrogé</text><rect class="box-s" x="132.0" y="54.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="138.0" y="70.0" text-anchor="start">2 440 élèves de 13 à 17 ans, 38</text><text class="t-sm" x="138.0" y="83.0" text-anchor="start">écoles, taux de réponse 87,2 %</text><rect class="box-a" x="377.0" y="54.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="383.0" y="70.0" text-anchor="start">élèves de 10 à 21 ans, effectif non</text><text class="t-sm" x="383.0" y="83.0" text-anchor="start">précisé</text><text class="t-b" x="120.0" y="114.0" text-anchor="end">Quelle</text><text class="t-b" x="120.0" y="128.0" text-anchor="end">définition</text><rect class="box-s" x="132.0" y="98.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="138.0" y="114.0" text-anchor="start">harcèlement à l&#x27;école, question</text><text class="t-sm" x="138.0" y="127.0" text-anchor="start">standardisée</text><rect class="box-a" x="377.0" y="98.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="383.0" y="114.0" text-anchor="start">non précisé</text><text class="t-b" x="120.0" y="158.0" text-anchor="end">Quelle période</text><rect class="box-s" x="132.0" y="142.0" width="241.0" height="25.0" rx="6"/><text class="t-sm" x="138.0" y="158.0" text-anchor="start">les 12 derniers mois</text><rect class="box-a" x="377.0" y="142.0" width="241.0" height="25.0" rx="6"/><text class="t-sm" x="383.0" y="158.0" text-anchor="start">non précisé</text><text class="t-b" x="120.0" y="189.0" text-anchor="end">Quelle méthode</text><rect class="box-s" x="132.0" y="173.0" width="241.0" height="25.0" rx="6"/><text class="t-sm" x="138.0" y="189.0" text-anchor="start">tirage au sort à deux degrés</text><rect class="box-a" x="377.0" y="173.0" width="241.0" height="25.0" rx="6"/><text class="t-sm" x="383.0" y="189.0" text-anchor="start">non précisé, aucun protocole publié</text><text class="t-b" x="120.0" y="220.0" text-anchor="end">Où est-ce publié</text><rect class="box-s" x="132.0" y="204.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="138.0" y="220.0" text-anchor="start">fiche de résultats publiée (OMS,</text><text class="t-sm" x="138.0" y="233.0" text-anchor="start">2025)</text><rect class="box-a" x="377.0" y="204.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="383.0" y="220.0" text-anchor="start">aucun rapport primaire retrouvé,</text><text class="t-sm" x="383.0" y="233.0" text-anchor="start">articles de presse seulement</text></svg>