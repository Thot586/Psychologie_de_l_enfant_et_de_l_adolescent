<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 257.0" role="img" aria-labelledby="fenetre-de-tolerance-t fenetre-de-tolerance-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="fenetre-de-tolerance-t">La fenêtre de tolérance</title><desc id="fenetre-de-tolerance-d">Trois zones empilées : en haut, hyperactivation (agitation, colère, fuite) ; au milieu, la fenêtre de tolérance, où l&#x27;on peut réfléchir, parler, apprendre ; en bas, hypoactivation (figement, repli, absence). Une ligne oscille entre les zones avec trois repères : une moquerie fait sortir vers le haut, le retour d&#x27;un adulte fiable ramène dans la fenêtre, une nouvelle menace fait basculer vers le bas.</desc><rect class="box-b" x="20.0" y="16.0" width="600.0" height="60.0" rx="8"/><text class="t-b" x="30.0" y="36.0" text-anchor="start">Hyperactivation</text><text class="t-sm" x="30.0" y="54.0" text-anchor="start">agitation · colère · fuite</text><rect class="box-s" x="20.0" y="82.0" width="600.0" height="93.0" rx="8"/><text class="t-b" x="30.0" y="102.0" text-anchor="start">Fenêtre de tolérance : on peut réfléchir, parler, apprendre</text><text class="t-sm" x="30.0" y="120.0" text-anchor="start">on y ramène l&#x27;enfant par la présence, le calme et la prévisibilité</text><rect class="box-b" x="20.0" y="181.0" width="600.0" height="60.0" rx="8"/><text class="t-b" x="30.0" y="201.0" text-anchor="start">Hypoactivation</text><text class="t-sm" x="30.0" y="219.0" text-anchor="start">figement · repli · absence</text><path class="curve s1" d="M20.0,131.5 C65.0,131.5 65.0,120.0 110.0,120.0 C149.0,120.0 149.0,48.3 188.0,48.3 C230.0,48.3 230.0,108.4 272.0,108.4 C311.0,108.4 311.0,143.1 350.0,143.1 C389.0,143.1 389.0,131.5 428.0,131.5 C464.0,131.5 464.0,219.3 500.0,219.3 C536.0,219.3 536.0,154.6 572.0,154.6 C596.0,154.6 596.0,136.1 620.0,136.1"/><circle class="halo" cx="188.0" cy="48.3" r="8"/><circle class="f2" cx="188.0" cy="48.3" r="5"/><text class="t-sm" x="188.0" y="36.3" text-anchor="middle">moquerie</text><circle class="halo" cx="350.0" cy="143.1" r="8"/><circle class="f2" cx="350.0" cy="143.1" r="5"/><text class="t-sm" x="350.0" y="131.1" text-anchor="middle">retour d&#x27;un adulte</text><text class="t-sm" x="350.0" y="143.1" text-anchor="middle">fiable</text><circle class="halo" cx="500.0" cy="219.3" r="8"/><circle class="f2" cx="500.0" cy="219.3" r="5"/><text class="t-sm" x="500.0" y="207.3" text-anchor="middle">nouvelle menace</text></svg>