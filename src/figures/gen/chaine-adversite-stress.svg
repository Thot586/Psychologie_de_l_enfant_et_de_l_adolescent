<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" role="img" aria-labelledby="chaine-adversite-stress-t chaine-adversite-stress-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="chaine-adversite-stress-t">Des adversités répétées à la santé : une chaîne que les protections peuvent interrompre</title><desc id="chaine-adversite-stress-d">Chaîne de quatre maillons : adversités répétées (harcèlement, violence à la maison, négligence) ; stress qui déborde (corps en alerte, sommeil, concentration) ; ce qui se voit (repli, colère, maux de ventre, chute scolaire) ; à long terme, si rien ne change (anxiété, dépression, santé). Les protections (adulte fiable, école qui protège, soins) atténuent, parfois inversent. Associations observées dans les études ; aucun destin individuel.</desc><defs><marker id="chaine-adversite-stress-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><rect class="box-b" x="20.0" y="16.0" width="130.5" height="102.0" rx="8"/><text class="t-b" x="30.0" y="36.0">Adversités</text><text class="t-b" x="30.0" y="52.0">répétées</text><text class="t-sm" x="30.0" y="70.0">harcèlement,</text><text class="t-sm" x="30.0" y="84.0">violence à la</text><text class="t-sm" x="30.0" y="98.0">maison, négligence</text><line class="arrow" x1="152.5" y1="67.0" x2="174.5" y2="67.0" marker-end="url(#chaine-adversite-stress-arr)"/><rect class="box-a" x="176.5" y="16.0" width="130.5" height="102.0" rx="8"/><text class="t-b" x="186.5" y="36.0">Stress qui déborde</text><text class="t-sm" x="186.5" y="54.0">corps en alerte,</text><text class="t-sm" x="186.5" y="68.0">sommeil,</text><text class="t-sm" x="186.5" y="82.0">concentration</text><line class="arrow" x1="309.0" y1="67.0" x2="331.0" y2="67.0" marker-end="url(#chaine-adversite-stress-arr)"/><rect class="box" x="333.0" y="16.0" width="130.5" height="102.0" rx="8"/><text class="t-b" x="343.0" y="36.0">Ce qui se voit</text><text class="t-sm" x="343.0" y="54.0">repli, colère,</text><text class="t-sm" x="343.0" y="68.0">maux de ventre,</text><text class="t-sm" x="343.0" y="82.0">chute scolaire</text><line class="arrow" x1="465.5" y1="67.0" x2="487.5" y2="67.0" marker-end="url(#chaine-adversite-stress-arr)"/><rect class="box-b" x="489.5" y="16.0" width="130.5" height="102.0" rx="8"/><text class="t-b" x="499.5" y="36.0">À long terme, si</text><text class="t-b" x="499.5" y="52.0">rien ne change</text><text class="t-sm" x="499.5" y="70.0">anxiété,</text><text class="t-sm" x="499.5" y="84.0">dépression, santé</text><path class="curve s4" d="M320.0,174 C320.0,136 398.2,158 398.2,124" marker-end="url(#chaine-adversite-stress-arr)"/><rect class="box-s" x="190.0" y="176.0" width="260.0" height="72.0" rx="8"/><text class="t-b" x="200.0" y="196.0">Protections</text><text class="t-sm" x="200.0" y="214.0">adulte fiable, école qui protège,</text><text class="t-sm" x="200.0" y="228.0">soins</text><text class="t-sm" x="320.0" y="266.0" text-anchor="middle">atténuent, parfois inversent</text><text class="t-sm" x="10.0" y="292.0" text-anchor="start">Associations observées dans les études (Hughes et al., 2017 ; Arseneault, 2018) ; aucun destin</text><text class="t-sm" x="10.0" y="307.0" text-anchor="start">individuel.</text></svg>