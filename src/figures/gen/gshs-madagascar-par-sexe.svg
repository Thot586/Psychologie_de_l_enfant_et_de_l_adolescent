<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" width="640" height="432" role="img" aria-labelledby="gshs-madagascar-par-sexe-t gshs-madagascar-par-sexe-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="gshs-madagascar-par-sexe-t">Madagascar, 13-17 ans scolarisés, 2025 : garçons et filles</title><desc id="gshs-madagascar-par-sexe-d">Barres groupées par sexe, en pourcentage d&#x27;élèves sur les 12 derniers mois (bagarre, harcèlement, cyberharcèlement, idées suicidaires, tentative) ou sur les 30 derniers jours (sans ami proche, parents qui ne comprennent pas). Harcelés à l&#x27;école : garçons 26,3, filles 28,1. Cyberharcelés : 11,1 et 9,8. Bagarre : 29,4 et 29,5. Idées suicidaires sérieuses : 5,8 et 13,5. Tentative de suicide : 7,8 et 8,8. Sans ami proche : 2,4 et 4,4. Parents qui ne comprennent jamais ou rarement leurs soucis : 65,2 et 60,8. Source : OMS, 2025 (GSHS Madagascar, 2 440 élèves).</desc><rect class="f1" x="250" y="6" width="12" height="12" rx="2"/><text x="267" y="12.5" dominant-baseline="middle">Garçons</text><rect class="f2" x="337.5" y="6" width="12" height="12" rx="2"/><text x="354.5" y="12.5" dominant-baseline="middle">Filles</text><line class="grid" x1="250.0" y1="28" x2="250.0" y2="398"/><text class="t-sm" x="250.0" y="414" text-anchor="middle">0</text><line class="grid" x1="295.7" y1="28" x2="295.7" y2="398"/><text class="t-sm" x="295.7" y="414" text-anchor="middle">10</text><line class="grid" x1="341.4" y1="28" x2="341.4" y2="398"/><text class="t-sm" x="341.4" y="414" text-anchor="middle">20</text><line class="grid" x1="387.1" y1="28" x2="387.1" y2="398"/><text class="t-sm" x="387.1" y="414" text-anchor="middle">30</text><line class="grid" x1="432.9" y1="28" x2="432.9" y2="398"/><text class="t-sm" x="432.9" y="414" text-anchor="middle">40</text><line class="grid" x1="478.6" y1="28" x2="478.6" y2="398"/><text class="t-sm" x="478.6" y="414" text-anchor="middle">50</text><line class="gri