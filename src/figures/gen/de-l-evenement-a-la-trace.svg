<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" role="img" aria-labelledby="de-l-evenement-a-la-trace-t de-l-evenement-a-la-trace-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="de-l-evenement-a-la-trace-t">De l&#x27;événement à la trace : quatre temps, et ce que fait l&#x27;adulte</title><desc id="de-l-evenement-a-la-trace-d">Chaîne en quatre temps. L&#x27;événement : l&#x27;adulte sécurise et arrête l&#x27;exposition. Réaction immédiate normale, jours 0 à 7 : sursauts, sommeil perturbé, images qui reviennent, repli ou agitation ; l&#x27;adulte écoute sans forcer. Réorganisation, semaines 2 à 4 : les signes s&#x27;atténuent chez la majorité des enfants ; l&#x27;adulte restaure les routines. Persistance au-delà d&#x27;un mois : seuil d&#x27;orientation vers un professionnel (NICE, 2018 ; Inserm, 2020 ; Trickey et al., 2012).</desc><defs><marker id="de-l-evenement-a-la-trace-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><rect class="box-b" x="20.0" y="16.0" width="130.5" height="142.0" rx="8"/><text class="t-b" x="30.0" y="36.0">1. L&#x27;événement</text><text class="t-sm" x="30.0" y="54.0">Adulte :</text><text class="t-sm" x="30.0" y="68.0">sécuriser, arrêter</text><text class="t-sm" x="30.0" y="82.0">l&#x27;exposition</text><line class="arrow" x1="152.5" y1="87.0" x2="174.5" y2="87.0" marker-end="url(#de-l-evenement-a-la-trace-arr)"/><rect class="box-a" x="176.5" y="16.0" width="130.5" height="142.0" rx="8"/><text class="t-b" x="186.5" y="36.0">2. Jours 0 à 7</text><text class="t-sm" x="186.5" y="54.0">Sursauts, sommeil,</text><text class="t-sm" x="186.5" y="68.0">images qui</text><text class="t-sm" x="186.5" y="82.0">reviennent, repli</text><text class="t-sm" x="186.5" y="96.0">ou agitation :</text><text class="t-sm" x="186.5" y="110.0">réaction normale</text><text class="t-sm" x="186.5" y="124.0">Adulte : écouter</text><text class="t-sm" x="186.5" y="138.0">sans forcer</text><line class="arrow" x1="309.0" y1="87.0" x2="331.0" y2="87.0" marker-end="url(#de-l-evenement-a-la-trace-arr)"/><rect class="box" x="333.0" y="16.0" width="130.5" height="142.0" rx="8"/><text class="t-b" x="343.0" y="36.0">3. Semaines 2 à 4</text><text class="t-sm" x="343.0" y="54.0">Les signes</text><text class="t-sm" x="343.0" y="68.0">s&#x27;atténuent chez</text><text class="t-sm" x="343.0" y="82.0">la majorité</text><text class="t-sm" x="343.0" y="96.0">Adulte : restaurer</text><text class="t-sm" x="343.0" y="110.0">les routines</text><line class="arrow" x1="465.5" y1="87.0" x2="487.5" y2="87.0" marker-end="url(#de-l-evenement-a-la-trace-arr)"/><rect class="box-p" x="489.5" y="16.0" width="130.5" height="142.0" rx="8"/><text class="t-b" x="499.5" y="36.0">4. Au-delà d&#x27;un</text><text class="t-b" x="499.5" y="52.0">mois</text><text class="t-sm" x="499.5" y="70.0">Seuil</text><text class="t-sm" x="499.5" y="84.0">d&#x27;orientation</text><text class="t-sm" x="499.5" y="98.0">Adulte : orienter</text><text class="t-sm" x="499.5" y="112.0">vers un</text><text class="t-sm" x="499.5" y="126.0">professionnel</text></svg>