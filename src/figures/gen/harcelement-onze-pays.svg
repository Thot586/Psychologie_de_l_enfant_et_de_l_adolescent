<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 559" width="640" height="559" role="img" aria-labelledby="harcelement-onze-pays-t harcelement-onze-pays-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="harcelement-onze-pays-t">Élèves harcelés dans le mois : onze pays d&#x27;Afrique subsaharienne (Madagascar non inclus)</title><desc id="harcelement-onze-pays-d">Barres horizontales classées par valeur croissante, en pourcentage d&#x27;adolescents scolarisés harcelés au cours des 30 derniers jours (Aboagye et al., 2021a, enquêtes GSHS 2010-2017) : Maurice 22,2 ; Tanzanie 23,7 ; Eswatini 29,8 ; Bénin 41,1 ; Mozambique 42,7 ; Namibie 43,5 ; Seychelles 43,5 ; Mauritanie 43,6 ; Liberia 44,5 ; Ghana 49,3 ; Sierra Leone 54,6 ; moyenne des onze pays 38,8. Madagascar ne figure pas dans cette analyse ; son chiffre (27,2 % harcelés à l&#x27;école dans l&#x27;année, OMS 2025) porte sur une autre période et ne se compare pas directement.</desc><line class="grid" x1="250.0" y1="24" x2="250.0" y2="525"/><text class="t-sm" x="250.0" y="541" text-anchor="middle">0</text><line class="grid" x1="303.3" y1="24" x2="303.3" y2="525"/><text class="t-sm" x="303.3" y="541" text-anchor="middle">10</text><line class="grid" x1="356.7" y1="24" x2="356.7" y2="525"/><text class="t-sm" x="356.7" y="541" text-anchor="middle">20</text><line class="grid" x1="410.0" y1="24" x2="410.0" y2="525"/><text class="t-sm" x="410.0" y="541" text-anchor="middle">30</text><line class="grid" x1="463.3" y1="24" x2="463.3" y2="525"/><text class="t-sm" x="463.3" y="541" text-anchor="middle">40</text><line class="grid" x1="516.7" y1="24" x2="516.7" y2="525"/><text class="t-sm" x="516.7" y="541" text-anchor="middle">50</text><line class="grid" x1="570.0" y1="24" x2="570.0" y2="525"/><text class="t-sm" x="570.0" y="541" text-anchor="middle">60 %</text><path class="f1" d="M250.0,40 h114.39999999999998 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-114.39999999999998 z"><title>Maurice : 22,2 %</title></path><text x="240" y="51.0" text-anchor="end" dominant-baseline="middle">Maurice</text><text class="t-num" x="376.4" y="51" dominant-baseline="middle">22,2 %</text><path class="f1" d="M250.0,85 h122.39999999999998 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-122.39999999999998 z"><title>Tanzanie : 23,7 %</title></path><text x="240" y="96.0" text-anchor="end" dominant-baseline="middle">Tanzanie</text><text class="t-num" x="384.4" y="96" dominant-baseline="middle">23,7 %</text><path class="f1" d="M250.0,130 h154.93333333333334 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-154.93333333333334 z"><title>Eswatini : 29,8 %</title></path><text x="240" y="141.0" text-anchor="end" dominant-baseline="middle">Eswatini</text><text class="t-num" x="416.9" y="141" dominant-baseline="middle">29,8 %</text><path class="f1" d="M250.0,175 h215.2 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-215.2 z"><title>Bénin : 41,1 %</title></path><text x="240" y="186.0" text-anchor="end" dominant-baseline="middle">Bénin</text><text class="t-num" x="477.2" y="186" dominant-baseline="middle">41,1 %</text><path class="f1" d="M250.0,220 h223.73333333333335 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-223.73333333333335 z"><title>Mozambique : 42,7 %</title></path><text x="240" y="231.0" text-anchor="end" dominant-baseline="middle">Mozambique</text><text class="t-num" x="485.7" y="231" dominant-baseline="middle">42,7 %</text><path class="f1" d="M250.0,265 h228.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-228.0 z"><title>Namibie : 43,5 %</title></path><text x="240" y="276.0" text-anchor="end" dominant-baseline="middle">Namibie</text><text class="t-num" x="490.0" y="276" dominant-baseline="middle">43,5 %</text><path class="f1" d="M250.0,310 h228.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-228.0 z"><title>Seychelles : 43,5 %</title></path><text x="240" y="321.0" text-anchor="end" dominant-baseline="middle">Seychelles</text><text class="t-num" x="490.0" y="321" dominant-baseline="middle">43,5 %</text><path class="f1" d="M250.0,355 h228.5333333333333 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-228.5333333333333 z"><title>Mauritanie : 43,6 %</title></path><text x="240" y="366.0" text-anchor="end" dominant-baseline="middle">Mauritanie</text><text class="t-num" x="490.5" y="366" dominant-baseline="middle">43,6 %</text><path class="f1" d="M250.0,400 h233.33333333333337 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-233.33333333333337 z"><title>Liberia : 44,5 %</title></path><text x="240" y="411.0" text-anchor="end" dominant-baseline="middle">Liberia</text><text class="t-num" x="495.3" y="411" dominant-baseline="middle">44,5 %</text><path class="f1" d="M250.0,445 h258.9333333333334 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-258.9333333333334 z"><title>Ghana : 49,3 %</title></path><text x="240" y="456.0" text-anchor="end" dominant-baseline="middle">Ghana</text><text class="t-num" x="520.9" y="456" dominant-baseline="middle">49,3 %</text><path class="f1" d="M250.0,490 h287.20000000000005 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-287.20000000000005 z"><title>Sierra Leone : 54,6 %</title></path><text x="240" y="501.0" text-anchor="end" dominant-baseline="middle">Sierra Leone</text><text class="t-num" x="549.2" y="501" dominant-baseline="middle">54,6 %</text><line class="ref" x1="456.9" y1="24" x2="456.9" y2="525" stroke-width="2"/><text class="t-sm" x="460.9" y="22">moyenne des onze pays : 38,8 %</text></svg>