<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="fourche-trois-questions-t fourche-trois-questions-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="fourche-trois-questions-t">Trois questions pour trancher</title><desc id="fourche-trois-questions-d">Organigramme. Un enfant me raconte quelque chose. Question 1 : un adulte est-il l&#x27;auteur des faits ? Si oui, ce n&#x27;est pas du harcèlement entre élèves : châtiment corporel ou discipline, voir le tableau des cinq situations. Question 2 : cela se répète-t-il ? Si non, agression isolée ou conflit : on soigne, on protège, on traite le fait. Question 3 : l&#x27;enfant peut-il faire cesser ou se défendre à armes égales ? Si oui, conflit : faire parler les deux enfants avec un adulte. Si non, harcèlement : écouter seul, tracer par écrit, protéger, saisir l&#x27;établissement, travailler le groupe, jamais de face-à-face (Olweus, 1993 ; Gaffney et al., 2021a ; National Academies, 2016). Quelle que soit la sortie, on ne laisse pas la situation sans réponse.</desc><defs><marker id="fourche-trois-questions-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><rect class="box-p" x="130.0" y="16.0" width="490.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="36.0">1. Un adulte est-il l&#x27;auteur des faits ?</text><circle class="f1" cx="100" cy="36" r="14"/><text class="on-fill t-b" x="100" y="41" text-anchor="middle">1</text><rect class="box" x="130.0" y="82.0" width="235.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="102.0">Non : question suivante</text><line class="arrow-soft" x1="335.0" y1="56.0" x2="247.5" y2="80.0" marker-end="url(#fourche-trois-questions-arr)"/><rect class="box-a" x="385.0" y="82.0" width="235.0" height="102.0" rx="8"/><text class="t-b" x="395.0" y="102.0">Oui : pas un harcèlement entre</text><text class="t-b" x="395.0" y="118.0">élèves</text><text class="t-sm" x="395.0" y="136.0">châtiment corporel ou discipline</text><text class="t-sm" x="395.0" y="150.0">: voir le tableau des cinq</text><text class="t-sm" x="395.0" y="164.0">situations</text><line class="arrow-soft" x1="415.0" y1="56.0" x2="502.5" y2="80.0" marker-end="url(#fourche-trois-questions-arr)"/><line class="arrow" x1="375.0" y1="186.0" x2="375.0" y2="200.0" marker-end="url(#fourche-trois-questions-arr)"/><rect class="box-p" x="130.0" y="204.0" width="490.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="224.0">2. Cela se répète-t-il ?</text><circle class="f1" cx="100" cy="224" r="14"/><text class="on-fill t-b" x="100" y="229" text-anchor="middle">2</text><rect class="box" x="130.0" y="270.0" width="235.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="290.0">Oui : question suivante</text><line class="arrow-soft" x1="335.0" y1="244.0" x2="247.5" y2="268.0" marker-end="url(#fourche-trois-questions-arr)"/><rect class="box-a" x="385.0" y="270.0" width="235.0" height="88.0" rx="8"/><text class="t-b" x="395.0" y="290.0">Non : agression isolée ou</text><text class="t-b" x="395.0" y="306.0">conflit</text><text class="t-sm" x="395.0" y="324.0">on soigne, on protège, on traite</text><text class="t-sm" x="395.0" y="338.0">le fait</text><line class="arrow-soft" x1="415.0" y1="244.0" x2="502.5" y2="268.0" marker-end="url(#fourche-trois-questions-arr)"/><line class="arrow" x1="375.0" y1="360.0" x2="375.0" y2="374.0" marker-end="url(#fourche-trois-questions-arr)"/><rect class="box-p" x="130.0" y="378.0" width="490.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="398.0">3. L&#x27;enfant peut-il faire cesser, ou se défendre à armes égales ?</text><circle class="f1" cx="100" cy="398" r="14"/><text class="on-fill t-b" x="100" y="403" text-anchor="middle">3</text><rect class="box-s" x="130.0" y="444.0" width="235.0" height="72.0" rx="8"/><text class="t-b" x="140.0" y="464.0">Oui : conflit</text><text class="t-sm" x="140.0" y="482.0">faire parler les deux enfants</text><text class="t-sm" x="140.0" y="496.0">avec un adulte</text><line class="arrow-soft" x1="335.0" y1="418.0" x2="247.5" y2="442.0" marker-end="url(#fourche-trois-questions-arr)"/><rect class="box-b" x="385.0" y="444.0" width="235.0" height="100.0" rx="8"/><text class="t-b" x="395.0" y="464.0">Non : harcèlement</text><text class="t-sm" x="395.0" y="482.0">écouter seul, tracer par écrit,</text><text class="t-sm" x="395.0" y="496.0">protéger, saisir</text><text class="t-sm" x="395.0" y="510.0">l&#x27;établissement, travailler le</text><text class="t-sm" x="395.0" y="524.0">groupe ; jamais de face-à-face</text><line class="arrow-soft" x1="415.0" y1="418.0" x2="502.5" y2="442.0" marker-end="url(#fourche-trois-questions-arr)"/><text class="t-sm" x="10.0" y="556.0" text-anchor="start">Quelle que soit la sortie, on ne laisse pas la situation sans réponse (Olweus, 1993 ; Gaffney</text><text class="t-sm" x="10.0" y="571.0" text-anchor="start">et al., 2021a ; National Academies, 2016).</text></svg>