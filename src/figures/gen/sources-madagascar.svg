<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 466" role="img" aria-labelledby="sources-madagascar-t sources-madagascar-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="sources-madagascar-t">Ce que chaque source malagasy mesure, et ce qu&#x27;elle ne mesure pas</title><desc id="sources-madagascar-d">Quatre sources malagasy et le vide qui reste, décrits par qui a été interrogé, ce que la source mesure vraiment, ce qu&#x27;elle ne mesure pas et son niveau de preuve. Enquête scolaire nationale de 2025, menée par l&#x27;Organisation mondiale de la Santé : 2 440 élèves de 38 écoles, de la classe de septième à la terminale, 13 à 17 ans, taux de réponse 87,2 % ; elle mesure le harcèlement déclaré à l&#x27;école dans l&#x27;année, 27,2 %, dont 26,3 % des garçons et 28,1 % des filles, et le cyberharcèlement, 10,5 % ; elle ne mesure ni les enfants déscolarisés ni le devenir à long terme ; preuve établie (OMS, 2025). Étude nationale sur les violences envers les enfants de 2018 : 2 523 personnes pour le volet quantitatif, 701 jeunes pour le volet qualitatif, 12 sites ; elle mesure les violences subies en milieu scolaire et familial, plus de la moitié des jeunes déclarant au moins une violence en milieu scolaire ; elle ne mesure pas le harcèlement au sens des trois critères ; preuve faible (IBCR et UNICEF, 2018). Enquêtes par grappes à indicateurs multiples, cycle 2025 diffusé en 2026 et cycle 2018 : ménages, enfants de 1 à 14 ans ; elles mesurent la discipline violente exercée par les adultes ; elles ne mesurent pas les violences entre élèves ; preuve établie (INSTAT et UNICEF, 2026 et 2019). Enquête par grappes du Sud de 2012 : enfants de 2 à 14 ans des régions du Sud, dont 64 % punis physiquement dans le mois précédent et 20 % sous une forme sévère ; portée régionale et non nationale ; preuve établie (INSTAT et UNICEF, 2013 ; End Corporal Punishment, 2022). Le vide, enfin : aucune publication à comité de lecture ni thèse identifiée sur le harcèlement entre élèves à Madagascar, aucun programme évalué, aucune donnée de suivi à long terme ; lacune.</desc><text class="t-b" x="191.2" y="30.0" text-anchor="middle">Qui a été</text><text class="t-b" x="191.2" y="44.0" text-anchor="middle">interrogé</text><text class="t-b" x="313.8" y="30.0" text-anchor="middle">Ce qu&#x27;elle mesure</text><text class="t-b" x="436.2" y="30.0" text-anchor="middle">Ce qu&#x27;elle ne</text><text class="t-b" x="436.2" y="44.0" text-anchor="middle">mesure pas</text><text class="t-b" x="558.8" y="30.0" text-anchor="middle">Niveau de preuve</text><text class="t-b" x="120.0" y="70.0" text-anchor="end">Enquête scolaire</text><text class="t-b" x="120.0" y="84.0" text-anchor="end">nationale 2025</text><text class="t-b" x="120.0" y="98.0" text-anchor="end">(OMS)</text><rect class="box" x="132.0" y="54.0" width="118.5" height="103.0" rx="6"/><text class="t-sm" x="138.0" y="70.0" text-anchor="start">2 440 élèves, 38</text><text class="t-sm" x="138.0" y="83.0" text-anchor="start">écoles, 7e à</text><text class="t-sm" x="138.0" y="96.0" text-anchor="start">terminale, 13-17</text><text class="t-sm" x="138.0" y="109.0" text-anchor="start">ans, réponse 87,2</text><text class="t-sm" x="138.0" y="122.0" text-anchor="start">%</text><rect class="box" x="254.5" y="54.0" width="118.5" height="103.0" rx="6"/><text class="t-sm" x="260.5" y="70.0" text-anchor="start">harcèlement à</text><text class="t-sm" x="260.5" y="83.0" text-anchor="start">l&#x27;école dans</text><text class="t-sm" x="260.5" y="96.0" text-anchor="start">l&#x27;année 27,2 %</text><text class="t-sm" x="260.5" y="109.0" text-anchor="start">(garçons 26,3,</text><text class="t-sm" x="260.5" y="122.0" text-anchor="start">filles 28,1) ;</text><text class="t-sm" x="260.5" y="135.0" text-anchor="start">cyberharcèlement</text><text class="t-sm" x="260.5" y="148.0" text-anchor="start">10,5 %</text><rect class="box" x="377.0" y="54.0" width="118.5" height="103.0" rx="6"/><text class="t-sm" x="383.0" y="70.0" text-anchor="start">les enfants</text><text class="t-sm" x="383.0" y="83.0" text-anchor="start">déscolarisés ; le</text><text class="t-sm" x="383.0" y="96.0" text-anchor="start">devenir à long</text><text class="t-sm" x="383.0" y="109.0" text-anchor="start">terme</text><rect class="box-s" x="499.5" y="54.0" width="118.5" height="103.0" rx="6"/><text class="t-sm" x="505.5" y="70.0" text-anchor="start">Preuve établie</text><text class="t-b" x="120.0" y="179.0" text-anchor="end">Étude nationale</text><text class="t-b" x="120.0" y="193.0" text-anchor="end">sur les</text><text class="t-b" x="120.0" y="207.0" text-anchor="end">violences 2018</text><text class="t-b" x="120.0" y="221.0" text-anchor="end">(IBCR et UNICEF)</text><rect class="box" x="132.0" y="163.0" width="118.5" height="90.0" rx="6"/><text class="t-sm" x="138.0" y="179.0" text-anchor="start">2 523 personnes,</text><text class="t-sm" x="138.0" y="192.0" text-anchor="start">701 jeunes, 12</text><text class="t-sm" x="138.0" y="205.0" text-anchor="start">sites</text><rect class="box" x="254.5" y="163.0" width="118.5" height="90.0" rx="6"/><text class="t-sm" x="260.5" y="179.0" text-anchor="start">violences subies à</text><text class="t-sm" x="260.5" y="192.0" text-anchor="start">l&#x27;école et en</text><text class="t-sm" x="260.5" y="205.0" text-anchor="start">famille : plus de</text><text class="t-sm" x="260.5" y="218.0" text-anchor="start">la moitié des</text><text class="t-sm" x="260.5" y="231.0" text-anchor="start">jeunes en</text><text class="t-sm" x="260.5" y="244.0" text-anchor="start">déclarent une</text><rect class="box" x="377.0" y="163.0" width="118.5" height="90.0" rx="6"/><text class="t-sm" x="383.0" y="179.0" text-anchor="start">le harcèlement au</text><text class="t-sm" x="383.0" y="192.0" text-anchor="start">sens des trois</text><text class="t-sm" x="383.0" y="205.0" text-anchor="start">critères</text><rect class="box-b" x="499.5" y="163.0" width="118.5" height="90.0" rx="6"/><text class="t-sm" x="505.5" y="179.0" text-anchor="start">Preuve faible</text><text class="t-b" x="120.0" y="275.0" text-anchor="end">Enquêtes par</text><text class="t-b" x="120.0" y="289.0" text-anchor="end">grappes MICS</text><text class="t-b" x="120.0" y="303.0" text-anchor="end">(2018, 2025)</text><rect class="box" x="132.0" y="259.0" width="118.5" height="51.0" rx="6"/><text class="t-sm" x="138.0" y="275.0" text-anchor="start">ménages, enfants</text><text class="t-sm" x="138.0" y="288.0" text-anchor="start">de 1 à 14 ans</text><rect class="box" x="254.5" y="259.0" width="118.5" height="51.0" rx="6"/><text class="t-sm" x="260.5" y="275.0" text-anchor="start">la discipline</text><text class="t-sm" x="260.5" y="288.0" text-anchor="start">violente exercée</text><text class="t-sm" x="260.5" y="301.0" text-anchor="start">par les adultes</text><rect class="box" x="377.0" y="259.0" width="118.5" height="51.0" rx="6"/><text class="t-sm" x="383.0" y="275.0" text-anchor="start">les violences</text><text class="t-sm" x="383.0" y="288.0" text-anchor="start">entre élèves</text><rect class="box-s" x="499.5" y="259.0" width="118.5" height="51.0" rx="6"/><text class="t-sm" x="505.5" y="275.0" text-anchor="start">Preuve établie</text><text class="t-b" x="120.0" y="332.0" text-anchor="end">Enquête par</text><text class="t-b" x="120.0" y="346.0" text-anchor="end">grappes du Sud,</text><text class="t-b" x="120.0" y="360.0" text-anchor="end">2012</text><rect class="box" x="132.0" y="316.0" width="118.5" height="64.0" rx="6"/><text class="t-sm" x="138.0" y="332.0" text-anchor="start">enfants de 2 à 14</text><text class="t-sm" x="138.0" y="345.0" text-anchor="start">ans, régions du</text><text class="t-sm" x="138.0" y="358.0" text-anchor="start">Sud</text><rect class="box" x="254.5" y="316.0" width="118.5" height="64.0" rx="6"/><text class="t-sm" x="260.5" y="332.0" text-anchor="start">64 % punis</text><text class="t-sm" x="260.5" y="345.0" text-anchor="start">physiquement dans</text><text class="t-sm" x="260.5" y="358.0" text-anchor="start">le mois, dont 20 %</text><text class="t-sm" x="260.5" y="371.0" text-anchor="start">sous forme sévère</text><rect class="box" x="377.0" y="316.0" width="118.5" height="64.0" rx="6"/><text class="t-sm" x="383.0" y="332.0" text-anchor="start">la moyenne du pays</text><text class="t-sm" x="383.0" y="345.0" text-anchor="start">: portée régionale</text><rect class="box-s" x="499.5" y="316.0" width="118.5" height="64.0" rx="6"/><text class="t-sm" x="505.5" y="332.0" text-anchor="start">Preuve établie</text><text class="t-b" x="120.0" y="402.0" text-anchor="end">Le vide</text><rect class="box" x="132.0" y="386.0" width="118.5" height="64.0" rx="6"/><text class="t-sm" x="138.0" y="402.0" text-anchor="start">aucune publication</text><text class="t-sm" x="138.0" y="415.0" text-anchor="start">à comité de</text><text class="t-sm" x="138.0" y="428.0" text-anchor="start">lecture, aucune</text><text class="t-sm" x="138.0" y="441.0" text-anchor="start">thèse identifiée</text><rect class="box" x="254.5" y="386.0" width="118.5" height="64.0" rx="6"/><text class="t-sm" x="260.5" y="402.0" text-anchor="start">aucun programme</text><text class="t-sm" x="260.5" y="415.0" text-anchor="start">évalué à</text><text class="t-sm" x="260.5" y="428.0" text-anchor="start">Madagascar</text><rect class="box" x="377.0" y="386.0" width="118.5" height="64.0" rx="6"/><text class="t-sm" x="383.0" y="402.0" text-anchor="start">aucune donnée de</text><text class="t-sm" x="383.0" y="415.0" text-anchor="start">suivi à long terme</text><rect class="box" x="499.5" y="386.0" width="118.5" height="64.0" rx="6"/><text class="t-sm" x="505.5" y="402.0" text-anchor="start">Lacune</text></svg>