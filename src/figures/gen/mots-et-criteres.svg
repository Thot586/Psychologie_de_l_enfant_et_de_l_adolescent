<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 415" role="img" aria-labelledby="mots-et-criteres-t mots-et-criteres-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="mots-et-criteres-t">Ce que chaque mot met en avant, ce qu&#x27;il laisse de côté</title><desc id="mots-et-criteres-d">Comparateur : herisetra an-tsekoly (malagasy) met en avant la violence à l&#x27;école, toutes violences confondues, y compris celles des adultes ; ne dit ni la répétition ni le déséquilibre de pouvoir ; ajouter les deux questions : est-ce que cela se répète, peut-il se défendre. Bullying (anglais) : relation de domination répétée, bien reconnu en Europe du Nord, sans équivalent proche dans les langues latines ; ajouter une description de la scène. Harcèlement (français) : répétition et intention ; recouvre aussi le harcèlement au travail et sexuel, peut paraître juridique et effrayant ; ajouter le contexte scolaire. Ijime (japonais) : exclusion par le groupe, sens partiellement différent. « C&#x27;est un jeu » : absence d&#x27;intention supposée ; ajouter les trois critères (Smith et al., 2002 ; Smith et al., 2016 ; Olweus, 1993).</desc><text class="t-b" x="211.7" y="30.0" text-anchor="middle">Ce que le mot met en</text><text class="t-b" x="211.7" y="44.0" text-anchor="middle">avant</text><text class="t-b" x="375.0" y="30.0" text-anchor="middle">Ce qu&#x27;il ne dit pas</text><text class="t-b" x="538.3" y="30.0" text-anchor="middle">Ce qu&#x27;il faut ajouter</text><text class="t-b" x="120.0" y="70.0" text-anchor="end">herisetra</text><text class="t-b" x="120.0" y="84.0" text-anchor="end">an-tsekoly</text><rect class="box" x="132.0" y="54.0" width="159.3" height="64.0" rx="6"/><text class="t-sm" x="138.0" y="70.0" text-anchor="start">La violence à l&#x27;école,</text><text class="t-sm" x="138.0" y="83.0" text-anchor="start">toutes violences</text><text class="t-sm" x="138.0" y="96.0" text-anchor="start">confondues, y compris</text><text class="t-sm" x="138.0" y="109.0" text-anchor="start">celles des adultes</text><rect class="box" x="295.3" y="54.0" width="159.3" height="64.0" rx="6"/><text class="t-sm" x="301.3" y="70.0" text-anchor="start">Ni la répétition, ni le</text><text class="t-sm" x="301.3" y="83.0" text-anchor="start">déséquilibre de pouvoir</text><rect class="box-s" x="458.7" y="54.0" width="159.3" height="64.0" rx="6"/><text class="t-sm" x="464.7" y="70.0" text-anchor="start">Deux questions : est-ce</text><text class="t-sm" x="464.7" y="83.0" text-anchor="start">que cela se répète ?</text><text class="t-sm" x="464.7" y="96.0" text-anchor="start">peut-il se défendre ?</text><text class="t-b" x="120.0" y="140.0" text-anchor="end">bullying</text><rect class="box" x="132.0" y="124.0" width="159.3" height="64.0" rx="6"/><text class="t-sm" x="138.0" y="140.0" text-anchor="start">Une relation de</text><text class="t-sm" x="138.0" y="153.0" text-anchor="start">domination répétée</text><rect class="box" x="295.3" y="124.0" width="159.3" height="64.0" rx="6"/><text class="t-sm" x="301.3" y="140.0" text-anchor="start">Reconnu en Europe du</text><text class="t-sm" x="301.3" y="153.0" text-anchor="start">Nord, sans équivalent</text><text class="t-sm" x="301.3" y="166.0" text-anchor="start">proche dans les langues</text><text class="t-sm" x="301.3" y="179.0" text-anchor="start">latines</text><rect class="box-s" x="458.7" y="124.0" width="159.3" height="64.0" rx="6"/><text class="t-sm" x="464.7" y="140.0" text-anchor="start">Une description de la</text><text class="t-sm" x="464.7" y="153.0" text-anchor="start">scène</text><text class="t-b" x="120.0" y="210.0" text-anchor="end">harcèlement</text><rect class="box" x="132.0" y="194.0" width="159.3" height="64.0" rx="6"/><text class="t-sm" x="138.0" y="210.0" text-anchor="start">La répétition et</text><text class="t-sm" x="138.0" y="223.0" text-anchor="start">l&#x27;intention</text><rect class="box" x="295.3" y="194.0" width="159.3" height="64.0" rx="6"/><text class="t-sm" x="301.3" y="210.0" text-anchor="start">Recouvre aussi le</text><text class="t-sm" x="301.3" y="223.0" text-anchor="start">travail et le sexuel :</text><text class="t-sm" x="301.3" y="236.0" text-anchor="start">peut paraître juridique,</text><text class="t-sm" x="301.3" y="249.0" text-anchor="start">effrayant</text><rect class="box-s" x="458.7" y="194.0" width="159.3" height="64.0" rx="6"/><text class="t-sm" x="464.7" y="210.0" text-anchor="start">Le contexte scolaire</text><text class="t-b" x="120.0" y="280.0" text-anchor="end">ijime</text><rect class="box" x="132.0" y="264.0" width="159.3" height="38.0" rx="6"/><text class="t-sm" x="138.0" y="280.0" text-anchor="start">L&#x27;exclusion par le</text><text class="t-sm" x="138.0" y="293.0" text-anchor="start">groupe</text><rect class="box" x="295.3" y="264.0" width="159.3" height="38.0" rx="6"/><text class="t-sm" x="301.3" y="280.0" text-anchor="start">Sens partiellement</text><text class="t-sm" x="301.3" y="293.0" text-anchor="start">différent du bullying</text><rect class="box-s" x="458.7" y="264.0" width="159.3" height="38.0" rx="6"/><text class="t-sm" x="464.7" y="280.0" text-anchor="start">Les traductions ne se</text><text class="t-sm" x="464.7" y="293.0" text-anchor="start">superposent pas</text><text class="t-b" x="120.0" y="324.0" text-anchor="end">« c&#x27;est un jeu »</text><rect class="box" x="132.0" y="308.0" width="159.3" height="51.0" rx="6"/><text class="t-sm" x="138.0" y="324.0" text-anchor="start">L&#x27;absence d&#x27;intention</text><text class="t-sm" x="138.0" y="337.0" text-anchor="start">supposée</text><rect class="box" x="295.3" y="308.0" width="159.3" height="51.0" rx="6"/><text class="t-sm" x="301.3" y="324.0" text-anchor="start">Un geste sans intention</text><text class="t-sm" x="301.3" y="337.0" text-anchor="start">supposée passe pour un</text><text class="t-sm" x="301.3" y="350.0" text-anchor="start">jeu</text><rect class="box-b" x="458.7" y="308.0" width="159.3" height="51.0" rx="6"/><text class="t-sm" x="464.7" y="324.0" text-anchor="start">Les trois critères,</text><text class="t-sm" x="464.7" y="337.0" text-anchor="start">énoncés à voix haute</text><text class="t-sm" x="10.0" y="373.0" text-anchor="start">Sources : Smith et al. (2002) ; Smith et al. (2016) ; Newsmada (2024) ; Olweus (1993) ; Gaffney</text><text class="t-sm" x="10.0" y="388.0" text-anchor="start">et al. (2021a) ; IBCR et UNICEF (2018).</text></svg>