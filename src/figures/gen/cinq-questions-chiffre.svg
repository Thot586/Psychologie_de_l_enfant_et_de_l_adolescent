<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 916" role="img" aria-labelledby="cinq-questions-chiffre-t cinq-questions-chiffre-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="cinq-questions-chiffre-t">Cinq questions à poser devant n&#x27;importe quel chiffre</title><desc id="cinq-questions-chiffre-d">Organigramme vertical en six paliers numérotés, sans aucune donnée chiffrée. Point de départ : un chiffre entendu ou lu. Chacun des cinq premiers paliers pose une question et se divise en deux : une réponse acceptable, une réponse manquante. 1. Qui a été interrogé ? acceptable : effectif, âge et régions donnés ; manquante : « des élèves », sans effectif. 2. Quelle définition ? acceptable : la question posée est reproduite ; manquante : « harcèlement », sans définition. 3. Quelle période ? acceptable : une période de rappel annoncée ; manquante : période non précisée. 4. Quelle méthode ? acceptable : écoles tirées au sort, questionnaire anonyme ; manquante : aucun protocole publié. 5. Où est-ce publié ? acceptable : rapport téléchargeable ou article relu par des pairs ; manquante : presse seulement. 6. Ce que je fais du chiffre, avec deux sorties : si les cinq réponses sont là, chiffre citable avec ses étiquettes ; s&#x27;il en manque, chiffre à mentionner en disant son statut.</desc><defs><marker id="cinq-questions-chiffre-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><rect class="box-p" x="130.0" y="16.0" width="490.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="36.0">1. Qui a été interrogé ?</text><circle class="f1" cx="100" cy="36" r="14"/><text class="on-fill t-b" x="100" y="41" text-anchor="middle">1</text><rect class="box-s" x="130.0" y="82.0" width="235.0" height="58.0" rx="8"/><text class="t-b" x="140.0" y="102.0">Réponse acceptable</text><text class="t-sm" x="140.0" y="120.0">effectif, âge et régions donnés</text><line class="arrow-soft" x1="335.0" y1="56.0" x2="247.5" y2="80.0" marker-end="url(#cinq-questions-chiffre-arr)"/><rect class="box-b" x="385.0" y="82.0" width="235.0" height="58.0" rx="8"/><text class="t-b" x="395.0" y="102.0">Réponse manquante</text><text class="t-sm" x="395.0" y="120.0">« des élèves », sans effectif</text><line class="arrow-soft" x1="415.0" y1="56.0" x2="502.5" y2="80.0" marker-end="url(#cinq-questions-chiffre-arr)"/><line class="arrow" x1="375.0" y1="142.0" x2="375.0" y2="156.0" marker-end="url(#cinq-questions-chiffre-arr)"/><rect class="box-p" x="130.0" y="160.0" width="490.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="180.0">2. Quelle définition ?</text><circle class="f1" cx="100" cy="180" r="14"/><text class="on-fill t-b" x="100" y="185" text-anchor="middle">2</text><rect class="box-s" x="130.0" y="226.0" width="235.0" height="58.0" rx="8"/><text class="t-b" x="140.0" y="246.0">Réponse acceptable</text><text class="t-sm" x="140.0" y="264.0">la question posée est reproduite</text><line class="arrow-soft" x1="335.0" y1="200.0" x2="247.5" y2="224.0" marker-end="url(#cinq-questions-chiffre-arr)"/><rect class="box-b" x="385.0" y="226.0" width="235.0" height="58.0" rx="8"/><text class="t-b" x="395.0" y="246.0">Réponse manquante</text><text class="t-sm" x="395.0" y="264.0">« harcèlement », sans définition</text><line class="arrow-soft" x1="415.0" y1="200.0" x2="502.5" y2="224.0" marker-end="url(#cinq-questions-chiffre-arr)"/><line class="arrow" x1="375.0" y1="286.0" x2="375.0" y2="300.0" marker-end="url(#cinq-questions-chiffre-arr)"/><rect class="box-p" x="130.0" y="304.0" width="490.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="324.0">3. Quelle période ?</text><circle class="f1" cx="100" cy="324" r="14"/><text class="on-fill t-b" x="100" y="329" text-anchor="middle">3</text><rect class="box-s" x="130.0" y="370.0" width="235.0" height="58.0" rx="8"/><text class="t-b" x="140.0" y="390.0">Réponse acceptable</text><text class="t-sm" x="140.0" y="408.0">une période de rappel annoncée</text><line class="arrow-soft" x1="335.0" y1="344.0" x2="247.5" y2="368.0" marker-end="url(#cinq-questions-chiffre-arr)"/><rect class="box-b" x="385.0" y="370.0" width="235.0" height="58.0" rx="8"/><text class="t-b" x="395.0" y="390.0">Réponse manquante</text><text class="t-sm" x="395.0" y="408.0">période non précisée</text><line class="arrow-soft" x1="415.0" y1="344.0" x2="502.5" y2="368.0" marker-end="url(#cinq-questions-chiffre-arr)"/><line class="arrow" x1="375.0" y1="430.0" x2="375.0" y2="444.0" marker-end="url(#cinq-questions-chiffre-arr)"/><rect class="box-p" x="130.0" y="448.0" width="490.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="468.0">4. Quelle méthode ?</text><circle class="f1" cx="100" cy="468" r="14"/><text class="on-fill t-b" x="100" y="473" text-anchor="middle">4</text><rect class="box-s" x="130.0" y="514.0" width="235.0" height="58.0" rx="8"/><text class="t-b" x="140.0" y="534.0">Réponse acceptable</text><text class="t-sm" x="140.0" y="552.0">écoles tirées au sort, anonyme</text><line class="arrow-soft" x1="335.0" y1="488.0" x2="247.5" y2="512.0" marker-end="url(#cinq-questions-chiffre-arr)"/><rect class="box-b" x="385.0" y="514.0" width="235.0" height="58.0" rx="8"/><text class="t-b" x="395.0" y="534.0">Réponse manquante</text><text class="t-sm" x="395.0" y="552.0">aucun protocole publié</text><line class="arrow-soft" x1="415.0" y1="488.0" x2="502.5" y2="512.0" marker-end="url(#cinq-questions-chiffre-arr)"/><line class="arrow" x1="375.0" y1="574.0" x2="375.0" y2="588.0" marker-end="url(#cinq-questions-chiffre-arr)"/><rect class="box-p" x="130.0" y="592.0" width="490.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="612.0">5. Où est-ce publié ?</text><circle class="f1" cx="100" cy="612" r="14"/><text class="on-fill t-b" x="100" y="617" text-anchor="middle">5</text><rect class="box-s" x="130.0" y="658.0" width="235.0" height="58.0" rx="8"/><text class="t-b" x="140.0" y="678.0">Réponse acceptable</text><text class="t-sm" x="140.0" y="696.0">rapport ou article relu</text><line class="arrow-soft" x1="335.0" y1="632.0" x2="247.5" y2="656.0" marker-end="url(#cinq-questions-chiffre-arr)"/><rect class="box-b" x="385.0" y="658.0" width="235.0" height="58.0" rx="8"/><text class="t-b" x="395.0" y="678.0">Réponse manquante</text><text class="t-sm" x="395.0" y="696.0">presse seulement</text><line class="arrow-soft" x1="415.0" y1="632.0" x2="502.5" y2="656.0" marker-end="url(#cinq-questions-chiffre-arr)"/><line class="arrow" x1="375.0" y1="718.0" x2="375.0" y2="732.0" marker-end="url(#cinq-questions-chiffre-arr)"/><rect class="box-p" x="130.0" y="736.0" width="490.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="756.0">6. Ce que je fais du chiffre</text><circle class="f1" cx="100" cy="756" r="14"/><text class="on-fill t-b" x="100" y="761" text-anchor="middle">6</text><rect class="box-s" x="130.0" y="802.0" width="235.0" height="58.0" rx="8"/><text class="t-b" x="140.0" y="822.0">Les cinq réponses sont là</text><text class="t-sm" x="140.0" y="840.0">citable, avec ses étiquettes</text><line class="arrow-soft" x1="335.0" y1="776.0" x2="247.5" y2="800.0" marker-end="url(#cinq-questions-chiffre-arr)"/><rect class="box-a" x="385.0" y="802.0" width="235.0" height="58.0" rx="8"/><text class="t-b" x="395.0" y="822.0">Des réponses manquent</text><text class="t-sm" x="395.0" y="840.0">à mentionner avec son statut</text><line class="arrow-soft" x1="415.0" y1="776.0" x2="502.5" y2="800.0" marker-end="url(#cinq-questions-chiffre-arr)"/><text class="t-sm" x="10.0" y="872.0" text-anchor="start">Point de départ : un chiffre entendu ou lu. Le schéma porte sur la façon de juger un chiffre,</text><text class="t-sm" x="10.0" y="887.0" text-anchor="start">pas sur une valeur : aucune donnée chiffrée n&#x27;y figure.</text></svg>