<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-labelledby="dose-ene-t dose-ene-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="dose-ene-t">Effet dose des expériences négatives de l&#x27;enfance : quatre expériences ou plus, comparées à aucune</title><desc id="dose-ene-d">Grille en quatre bandes de rapports de cotes (Hughes et al., 2017, méta-analyse de 37 études et 253 719 participants). Rapport de cotes inférieur à 2 : inactivité physique, surpoids ou obésité, diabète. Entre 2 et 3 : tabagisme, alcool excessif, mauvaise santé perçue, cancer, maladie cardiaque, maladie respiratoire. Entre 3 et 6 : conduites sexuelles à risque, maladie mentale, usage problématique d&#x27;alcool. Supérieur à 7 : usage problématique de drogues, violence interpersonnelle, violence auto-infligée. Un score élevé ne prédit pas le destin d&#x27;un enfant : ce sont des risques de population, pas un test individuel.</desc><text class="t-b" x="191.2" y="30.0" text-anchor="middle">Rapport de cotes &lt;</text><text class="t-b" x="191.2" y="44.0" text-anchor="middle">2</text><text class="t-b" x="313.8" y="30.0" text-anchor="middle">Entre 2 et 3</text><text class="t-b" x="436.2" y="30.0" text-anchor="middle">Entre 3 et 6</text><text class="t-b" x="558.8" y="30.0" text-anchor="middle">Supérieur à 7</text><text class="t-b" x="120.0" y="70.0" text-anchor="end">Ce qui est plus</text><text class="t-b" x="120.0" y="84.0" text-anchor="end">fréquent</text><rect class="box" x="132.0" y="54.0" width="118.5" height="90.0" rx="6"/><text class="t-sm" x="138.0" y="70.0" text-anchor="start">Inactivité</text><text class="t-sm" x="138.0" y="83.0" text-anchor="start">physique, surpoids</text><text class="t-sm" x="138.0" y="96.0" text-anchor="start">ou obésité,</text><text class="t-sm" x="138.0" y="109.0" text-anchor="start">diabète</text><rect class="box-a" x="254.5" y="54.0" width="118.5" height="90.0" rx="6"/><text class="t-sm" x="260.5" y="70.0" text-anchor="start">Tabagisme, alcool</text><text class="t-sm" x="260.5" y="83.0" text-anchor="start">excessif, mauvaise</text><text class="t-sm" x="260.5" y="96.0" text-anchor="start">santé perçue,</text><text class="t-sm" x="260.5" y="109.0" text-anchor="start">cancer, maladie</text><text class="t-sm" x="260.5" y="122.0" text-anchor="start">cardiaque, maladie</text><text class="t-sm" x="260.5" y="135.0" text-anchor="start">respiratoire</text><rect class="box-a" x="377.0" y="54.0" width="118.5" height="90.0" rx="6"/><text class="t-sm" x="383.0" y="70.0" text-anchor="start">Conduites</text><text class="t-sm" x="383.0" y="83.0" text-anchor="start">sexuelles à</text><text class="t-sm" x="383.0" y="96.0" text-anchor="start">risque, maladie</text><text class="t-sm" x="383.0" y="109.0" text-anchor="start">mentale, usage</text><text class="t-sm" x="383.0" y="122.0" text-anchor="start">problématique</text><text class="t-sm" x="383.0" y="135.0" text-anchor="start">d&#x27;alcool</text><rect class="box-b" x="499.5" y="54.0" width="118.5" height="90.0" rx="6"/><text class="t-sm" x="505.5" y="70.0" text-anchor="start">Usage</text><text class="t-sm" x="505.5" y="83.0" text-anchor="start">problématique de</text><text class="t-sm" x="505.5" y="96.0" text-anchor="start">drogues, violence</text><text class="t-sm" x="505.5" y="109.0" text-anchor="start">interpersonnelle,</text><text class="t-sm" x="505.5" y="122.0" text-anchor="start">violence</text><text class="t-sm" x="505.5" y="135.0" text-anchor="start">auto-infligée</text></svg>