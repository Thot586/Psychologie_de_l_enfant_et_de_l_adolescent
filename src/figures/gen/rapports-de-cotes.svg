<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 222" width="640" height="222" role="img" aria-labelledby="rapports-de-cotes-t rapports-de-cotes-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="rapports-de-cotes-t">Rapports de cotes : combien de fois plus de chances, par rapport aux enfants non concernés</title><desc id="rapports-de-cotes-d">Points sur une échelle avec une ligne de référence à 1 (aucune différence). Idées suicidaires chez les victimes : 2,23 ; tentatives de suicide : 2,55 (van Geel et al. 2014). Automutilation non suicidaire : victimes 2,46, auteurs 2,12, auteurs-victimes 2,98 (Huang et al. 2022). Un rapport de cotes de 2 ne signifie pas un risque doublé quand l&#x27;événement est fréquent.</desc><line class="grid" x1="250.0" y1="12" x2="250.0" y2="188"/><text class="t-sm" x="250.0" y="204" text-anchor="middle">0</text><line class="grid" x1="330.0" y1="12" x2="330.0" y2="188"/><text class="t-sm" x="330.0" y="204" text-anchor="middle">1</text><line class="grid" x1="410.0" y1="12" x2="410.0" y2="188"/><text class="t-sm" x="410.0" y="204" text-anchor="middle">2</text><line class="grid" x1="490.0" y1="12" x2="490.0" y2="188"/><text class="t-sm" x="490.0" y="204" text-anchor="middle">3</text><line class="grid" x1="570.0" y1="12" x2="570.0" y2="188"/><text class="t-sm" x="570.0" y="204" text-anchor="middle">4</text><line class="ref" x1="330.0" y1="12" x2="330.0" y2="188" stroke-width="2"/><text class="t-sm" x="334.0" y="10">1 = aucune différence</text><line class="line-soft" x1="330.0" y1="32" x2="428.4" y2="32"/><circle class="halo" cx="428.4" cy="32" r="8"/><circle class="f1" cx="428.4" cy="32" r="6"><title>Idées suicidaires · victimes : 2,23</title></circle><text class="t-num" x="440.4" y="32" dominant-baseline="middle">2,23</text><text x="240" y="32.0" text-anchor="end" dominant-baseline="middle">Idées suicidaires · victimes</text><line class="line-soft" x1="330.0" y1="66" x2="454.0" y2="66"/><circle class="halo" cx="454.0" cy="66" r="8"/><circle class="f1" cx="454.0" cy="66" r="6"><title>Tentatives de suicide · victimes : 2,55</title></circle><text class="t-num" x="466.0" y="66" dominant-baseline="middle">2,55</text><text x="240" y="66.0" text-anchor="end" dominant-baseline="middle">Tentatives de suicide · victimes</text><line class="line-soft" x1="330.0" y1="100" x2="446.8" y2="100"/><circle class="halo" cx="446.8" cy="100" r="8"/><circle class="f1" cx="446.8" cy="100" r="6"><title>Automutilation · victimes : 2,46</title></circle><text class="t-num" x="458.8" y="100" dominant-baseline="middle">2,46</text><text x="240" y="100.0" text-anchor="end" dominant-baseline="middle">Automutilation · victimes</text><line class="line-soft" x1="330.0" y1="134" x2="419.6" y2="134"/><circle class="halo" cx="419.6" cy="134" r="8"/><circle class="f1" cx="419.6" cy="134" r="6"><title>Automutilation · auteurs : 2,12</title></circle><text class="t-num" x="431.6" y="134" dominant-baseline="middle">2,12</text><text x="240" y="134.0" text-anchor="end" dominant-baseline="middle">Automutilation · auteurs</text><line class="line-soft" x1="330.0" y1="168" x2="488.4" y2="168"/><circle class="halo" cx="488.4" cy="168" r="8"/><circle class="f1" cx="488.4" cy="168" r="6"><title>Automutilation · auteurs-victimes : 2,98</title></circle><text class="t-num" x="500.4" y="168" dominant-baseline="middle">2,98</text><text x="240" y="161.0" text-anchor="end" dominant-baseline="middle">Automutilation ·</text><text x="240" y="176.0" text-anchor="end" dominant-baseline="middle">auteurs-victimes</text></svg>