<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 406" role="img" aria-labelledby="transition-college-t transition-college-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="transition-college-t">Le changement d&#x27;école : ce qui se joue de part et d&#x27;autre</title><desc id="transition-college-d">Trois temps : avant la transition (groupe d&#x27;amis constitué, adultes connus), la transition (changement d&#x27;établissement, souvent aussi de foyer), après (réseaux à reconstruire). Deux trajectoires : l&#x27;une s&#x27;interrompt (l&#x27;enfant harcelé avant ne l&#x27;est plus après), l&#x27;autre se poursuit (victime chronique) ; ce sont les trajectoires qui se poursuivent qui s&#x27;accompagnent du plus de difficultés psychiques et scolaires. Facteurs associés à la chronicité dans une cohorte britannique de 2 232 enfants : désavantage socio-économique, faible chaleur maternelle, maltraitance (Bowes et al., 2013). À Madagascar, environ un tiers des enfants de moins de 18 ans ne vivent pas avec leurs deux parents (Andriamaro, 2013).</desc><defs><marker id="transition-college-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><rect class="box-s" x="20.0" y="16.0" width="182.7" height="114.0" rx="8"/><text class="t-b" x="30.0" y="36.0">Avant la transition</text><text class="t-sm" x="30.0" y="54.0">Groupe d&#x27;amis constitué,</text><text class="t-sm" x="30.0" y="68.0">adultes connus</text><line class="arrow" x1="204.7" y1="73.0" x2="226.7" y2="73.0" marker-end="url(#transition-college-arr)"/><rect class="box-a" x="228.7" y="16.0" width="182.7" height="114.0" rx="8"/><text class="t-b" x="238.7" y="36.0">La transition</text><text class="t-sm" x="238.7" y="54.0">Changement</text><text class="t-sm" x="238.7" y="68.0">d&#x27;établissement, souvent</text><text class="t-sm" x="238.7" y="82.0">aussi de foyer</text><line class="arrow" x1="413.3" y1="73.0" x2="435.3" y2="73.0" marker-end="url(#transition-college-arr)"/><rect class="box" x="437.3" y="16.0" width="182.7" height="114.0" rx="8"/><text class="t-b" x="447.3" y="36.0">Après</text><text class="t-sm" x="447.3" y="54.0">Réseaux à reconstruire :</text><text class="t-sm" x="447.3" y="68.0">une trajectoire</text><text class="t-sm" x="447.3" y="82.0">s&#x27;interrompt, l&#x27;autre se</text><text class="t-sm" x="447.3" y="96.0">poursuit (victime</text><text class="t-sm" x="447.3" y="110.0">chronique)</text><path class="curve s4" d="M320.0,186 C320.0,148 528.7,170 528.7,136" marker-end="url(#transition-college-arr)"/><rect class="box-b" x="190.0" y="188.0" width="260.0" height="100.0" rx="8"/><text class="t-b" x="200.0" y="208.0">Chronicité : facteurs associés</text><text class="t-sm" x="200.0" y="226.0">désavantage socio-économique, faible</text><text class="t-sm" x="200.0" y="240.0">chaleur maternelle, maltraitance</text><text class="t-sm" x="200.0" y="254.0">(Bowes et al., 2013, cohorte de 2</text><text class="t-sm" x="200.0" y="268.0">232 enfants)</text><text class="t-sm" x="320.0" y="306.0" text-anchor="middle">les trajectoires qui se poursuivent s&#x27;accompagnent du plus de difficultés</text><text class="t-sm" x="320.0" y="320.0" text-anchor="middle">psychiques et scolaires</text><text class="t-sm" x="10.0" y="346.0" text-anchor="start">À Madagascar, environ un tiers des enfants de moins de 18 ans ne vivent pas avec leurs deux</text><text class="t-sm" x="10.0" y="361.0" text-anchor="start">parents ; la circulation des enfants entre parents, grands-parents et familles d&#x27;accueil est</text><text class="t-sm" x="10.0" y="376.0" text-anchor="start">fréquente (Andriamaro, 2013).</text></svg>