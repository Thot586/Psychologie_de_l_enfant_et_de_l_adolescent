<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" role="img" aria-labelledby="cercles-qui-fait-quoi-t cercles-qui-fait-quoi-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="cercles-qui-fait-quoi-t">Qui fait quoi autour d&#x27;un enfant harcelé</title><desc id="cercles-qui-fait-quoi-d">Cinq cercles concentriques : la famille et les proches (protègent, écoutent, notent) ; l&#x27;école (directeur, enseignants, FRAM : cadre, sanctions éducatives, plan d&#x27;action) ; la protection de l&#x27;enfance (Réseau de Protection de l&#x27;Enfant, Ligne Verte 147, Trano Aro Zo : signalement, orientation) ; la santé (centre de santé, urgences, psychiatrie : soins) ; la justice et la police (Police des mœurs et protection des mineurs, gendarmerie, procureur : violences graves).</desc><circle class="box-b" cx="230" cy="230" r="210.0"/><circle class="box" cx="230" cy="230" r="168.0"/><circle class="box-a" cx="230" cy="230" r="126.0"/><circle class="box-p" cx="230" cy="230" r="84.0"/><circle class="box-s" cx="230" cy="230" r="42.0"/><text class="t-b" x="230" y="234.0" text-anchor="middle">Famille, proches</text><text class="t-b" x="230" y="171.0" text-anchor="middle">École</text><text class="t-b" x="230" y="129.0" text-anchor="middle">Protection de l&#x27;enfance</text><text class="t-b" x="230" y="87.0" text-anchor="middle">Santé</text><text class="t-b" x="230" y="45.0" text-anchor="middle">Justice, police</text><circle class="box-s" cx="470" cy="34" r="6"/><text class="t-b" x="484" y="38">Famille, proches</text><text class="t-sm" x="484" y="54">protègent, écoutent,</text><text class="t-sm" x="484" y="68">notent</text><circle class="box-p" cx="470" cy="88" r="6"/><text class="t-b" x="484" y="92">École</text><text class="t-sm" x="484" y="108">directeur, enseignants,</text><text class="t-sm" x="484" y="122">FRAM : cadre, sanctions</text><text class="t-sm" x="484" y="136">éducatives, plan</text><text class="t-sm" x="484" y="150">d&#x27;action</text><circle class="box-a" cx="470" cy="170" r="6"/><text class="t-b" x="484" y="174">Protection de l&#x27;enfance</text><text class="t-sm" x="484" y="190">RPE, Ligne Verte 147,</text><text class="t-sm" x="484" y="204">Trano Aro Zo :</text><text class="t-sm" x="484" y="218">signalement, orientation</text><circle class="box" cx="470" cy="238" r="6"/><text class="t-b" x="484" y="242">Santé</text><text class="t-sm" x="484" y="258">centre de santé,</text><text class="t-sm" x="484" y="272">urgences, psychiatrie :</text><text class="t-sm" x="484" y="286">soins</text><circle class="box-b" cx="470" cy="306" r="6"/><text class="t-b" x="484" y="310">Justice, police</text><text class="t-sm" x="484" y="326">Police des mœurs et</text><text class="t-sm" x="484" y="340">protection des mineurs,</text><text class="t-sm" x="484" y="354">gendarmerie, procureur :</text><text class="t-sm" x="484" y="368">violences graves</text><text class="t-sm" x="10.0" y="454.0" text-anchor="start">Chaque cercle a sa fonction ; aucun ne remplace les autres.</text></svg>