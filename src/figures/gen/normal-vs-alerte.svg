<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="normal-vs-alerte-t normal-vs-alerte-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="normal-vs-alerte-t">Comportement attendu ou signal d&#x27;alerte : ce n&#x27;est pas le comportement qui alerte, c&#x27;est la trajectoire</title><desc id="normal-vs-alerte-d">Grille par tranche d&#x27;âge : comportements attendus à 2-5 ans (colères, morsures, peurs du noir), 6-8 ans (mensonges, disputes, peur de l&#x27;école les premiers jours), 9-12 ans (souci de l&#x27;apparence, secrets, contestation des règles), 13-18 ans (opposition, besoin d&#x27;intimité, coucher tardif). Pour tous les âges, trois critères d&#x27;alerte communs : cela dure dans le temps, l&#x27;enfant perd des acquis déjà installés, le sommeil, l&#x27;école, les repas ou les relations en souffrent. Règle d&#x27;orientation : des signes dans au moins deux domaines de vie, qui durent, justifient un avis (HAS, 2020).</desc><text class="t-b" x="252.5" y="30.0" text-anchor="middle">Comportements attendus à cet âge</text><text class="t-b" x="497.5" y="30.0" text-anchor="middle">Ce qui doit alerter, à tout âge</text><text class="t-b" x="120.0" y="70.0" text-anchor="end">2-5 ans</text><rect class="box" x="132.0" y="54.0" width="241.0" height="25.0" rx="6"/><text class="t-sm" x="138.0" y="70.0" text-anchor="start">Colères, morsures, peurs du noir</text><rect class="box-b" x="377.0" y="54.0" width="241.0" height="25.0" rx="6"/><text class="t-sm" x="383.0" y="70.0" text-anchor="start">Cela dure dans le temps</text><text class="t-b" x="120.0" y="101.0" text-anchor="end">6-8 ans</text><rect class="box" x="132.0" y="85.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="138.0" y="101.0" text-anchor="start">Mensonges, disputes, peur de l&#x27;école</text><text class="t-sm" x="138.0" y="114.0" text-anchor="start">les premiers jours</text><rect class="box-b" x="377.0" y="85.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="383.0" y="101.0" text-anchor="start">L&#x27;enfant perd des acquis déjà</text><text class="t-sm" x="383.0" y="114.0" text-anchor="start">installés</text><text class="t-b" x="120.0" y="145.0" text-anchor="end">9-12 ans</text><rect class="box" x="132.0" y="129.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="138.0" y="145.0" text-anchor="start">Souci de l&#x27;apparence, secrets,</text><text class="t-sm" x="138.0" y="158.0" text-anchor="start">contestation des règles</text><rect class="box-b" x="377.0" y="129.0" width="241.0" height="38.0" rx="6"/><text class="t-sm" x="383.0" y="145.0" text-anchor="start">Le sommeil, l&#x27;école, les repas ou les</text><text class="t-sm" x="383.0" y="158.0" text-anchor="start">relations en souffrent</text><text class="t-b" x="120.0" y="189.0" text-anchor="end">13-18 ans</text><rect class="box" x="132.0" y="173.0" width="241.0" height="51.0" rx="6"/><text class="t-sm" x="138.0" y="189.0" text-anchor="start">Opposition, besoin d&#x27;intimité,</text><text class="t-sm" x="138.0" y="202.0" text-anchor="start">coucher tardif</text><rect class="box-a" x="377.0" y="173.0" width="241.0" height="51.0" rx="6"/><text class="t-sm" x="383.0" y="189.0" text-anchor="start">Des signes dans au moins deux</text><text class="t-sm" x="383.0" y="202.0" text-anchor="start">domaines de vie, qui durent :</text><text class="t-sm" x="383.0" y="215.0" text-anchor="start">demander un avis</text></svg>