<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" width="640" height="272" role="img" aria-labelledby="exposition-madagascar-gshs-t exposition-madagascar-gshs-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="exposition-madagascar-gshs-t">Ce que dit l&#x27;enquête scolaire malgache</title><desc id="exposition-madagascar-gshs-d">Barres horizontales d&#x27;une seule couleur, classées par valeur décroissante, en pourcentage d&#x27;élèves : 62,9 % disent que leurs parents ou tuteurs ne comprennent jamais ou rarement leurs soucis ; 29,4 % ont été impliqués dans une bagarre ; 27,2 % ont été harcelés à l&#x27;école dans l&#x27;année, soit 26,3 % des garçons et 28,1 % des filles ; 24,6 % ont manqué l&#x27;école sans permission ; 3,5 % n&#x27;ont aucun ami proche. Enquête scolaire GSHS auprès de 2 440 élèves de 13 à 17 ans, 38 écoles, Madagascar (OMS, 2025). Chaque barre répond à une question différente : aucune n&#x27;est un total et elles ne s&#x27;additionnent pas.</desc><line class="grid" x1="250.0" y1="12" x2="250.0" y2="238"/><text class="t-sm" x="250.0" y="254" text-anchor="middle">0</text><line class="grid" x1="295.7" y1="12" x2="295.7" y2="238"/><text class="t-sm" x="295.7" y="254" text-anchor="middle">10</text><line class="grid" x1="341.4" y1="12" x2="341.4" y2="238"/><text class="t-sm" x="341.4" y="254" text-anchor="middle">20</text><line class="grid" x1="387.1" y1="12" x2="387.1" y2="238"/><text class="t-sm" x="387.1" y="254" text-anchor="middle">30</text><line class="grid" x1="432.9" y1="12" x2="432.9" y2="238"/><text class="t-sm" x="432.9" y="254" text-anchor="middle">40</text><line class="grid" x1="478.6" y1="12" x2="478.6" y2="238"/><text class="t-sm" x="478.6" y="254" text-anchor="middle">50</text><line class="grid" x1="524.3" y1="12" x2="524.3" y2="238"/><text class="t-sm" x="524.3" y="254" text-anchor="middle">60</text><line class="grid" x1="570.0" y1="12" x2="570.0" y2="238"/><text class="t-sm" x="570.0" y="254" text-anchor="middle">70</text><path class="f1" d="M250.0,28 h283.5428571428572 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-283.5428571428572 z"><title>Parents qui ne comprennent pas leurs soucis : 62,9 %</title></path><text x="240" y="32.0" text-anchor="end" dominant-baseline="middle">Parents qui ne comprennent pas</text><text x="240" y="47.0" text-anchor="end" dominant-baseline="middle">leurs soucis</text><text class="t-num" x="545.5" y="39" dominant-baseline="middle">62,9 %</text><path class="f1" d="M250.0,72 h130.39999999999998 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-130.39999999999998 z"><title>Impliqués dans une bagarre : 29,4 %</title></path><text x="240" y="83.0" text-anchor="end" dominant-baseline="middle">Impliqués dans une bagarre</text><text class="t-num" x="392.4" y="83" dominant-baseline="middle">29,4 %</text><path class="f1" d="M250.0,116 h120.34285714285716 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-120.34285714285716 z"><title>Harcelés à l&#x27;école dans l&#x27;année : 27,2 %</title></path><text x="240" y="127.0" text-anchor="end" dominant-baseline="middle">Harcelés à l&#x27;école dans l&#x27;année</text><text class="t-num" x="382.3" y="127" dominant-baseline="middle">27,2 %</text><path class="f1" d="M250.0,160 h108.45714285714286 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-108.45714285714286 z"><title>Ont manqué l&#x27;école sans permission : 24,6 %</title></path><text x="240" y="164.0" text-anchor="end" dominant-baseline="middle">Ont manqué l&#x27;école sans</text><text x="240" y="179.0" text-anchor="end" dominant-baseline="middle">permission</text><text class="t-num" x="370.5" y="171" dominant-baseline="middle">24,6 %</text><path class="f1" d="M250.0,204 h12.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-12.0 z"><title>Sans ami proche : 3,5 %</title></path><text x="240" y="215.0" text-anchor="end" dominant-baseline="middle">Sans ami proche</text><text class="t-num" x="274.0" y="215" dominant-baseline="middle">3,5 %</text></svg>