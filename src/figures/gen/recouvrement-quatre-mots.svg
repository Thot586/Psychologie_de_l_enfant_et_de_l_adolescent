<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" role="img" aria-labelledby="recouvrement-quatre-mots-t recouvrement-quatre-mots-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="recouvrement-quatre-mots-t">Quatre mots, quatre réalités</title><desc id="recouvrement-quatre-mots-d">Quatre notions comparées : harcèlement (entre pairs, répété, avec déséquilibre de pouvoir) ; herisetra an-tsekoly, violence à l&#x27;école (tout acte violent, y compris des adultes, sans distinguer répétition ni pouvoir) ; châtiment corporel (d&#x27;un adulte vers un enfant, interdit à l&#x27;école, licite au domicile) ; discipline (cadre sans violence : règles, conséquences logiques, dialogue).</desc><text class="t-b" x="191.2" y="30.0" text-anchor="middle">Qui ?</text><text class="t-b" x="313.8" y="30.0" text-anchor="middle">Répété ?</text><text class="t-b" x="436.2" y="30.0" text-anchor="middle">Déséquilibre ?</text><text class="t-b" x="558.8" y="30.0" text-anchor="middle">Cadre</text><text class="t-b" x="120.0" y="70.0" text-anchor="end">Harcèlement</text><rect class="box-b" x="132.0" y="54.0" width="118.5" height="38.0" rx="6"/><text class="t-sm" x="138.0" y="70.0" text-anchor="start">entre pairs</text><text class="t-sm" x="138.0" y="83.0" text-anchor="start">(élèves)</text><rect class="box-b" x="254.5" y="54.0" width="118.5" height="38.0" rx="6"/><text class="t-sm" x="260.5" y="70.0" text-anchor="start">oui</text><rect class="box-b" x="377.0" y="54.0" width="118.5" height="38.0" rx="6"/><text class="t-sm" x="383.0" y="70.0" text-anchor="start">oui</text><rect class="box-b" x="499.5" y="54.0" width="118.5" height="38.0" rx="6"/><text class="t-sm" x="505.5" y="70.0" text-anchor="start">protection de</text><text class="t-sm" x="505.5" y="83.0" text-anchor="start">l&#x27;enfant</text><text class="t-b" x="120.0" y="114.0" text-anchor="end">Herisetra</text><text class="t-b" x="120.0" y="128.0" text-anchor="end">an-tsekoly</text><rect class="box-a" x="132.0" y="98.0" width="118.5" height="38.0" rx="6"/><text class="t-sm" x="138.0" y="114.0" text-anchor="start">tout le monde,</text><text class="t-sm" x="138.0" y="127.0" text-anchor="start">adultes compris</text><rect class="box-a" x="254.5" y="98.0" width="118.5" height="38.0" rx="6"/><text class="t-sm" x="260.5" y="114.0" text-anchor="start">non précisé</text><rect class="box-a" x="377.0" y="98.0" width="118.5" height="38.0" rx="6"/><text class="t-sm" x="383.0" y="114.0" text-anchor="start">non précisé</text><rect class="box-a" x="499.5" y="98.0" width="118.5" height="38.0" rx="6"/><text class="t-sm" x="505.5" y="114.0" text-anchor="start">toute violence à</text><text class="t-sm" x="505.5" y="127.0" text-anchor="start">l&#x27;école</text><text class="t-b" x="120.0" y="158.0" text-anchor="end">Châtiment</text><text class="t-b" x="120.0" y="172.0" text-anchor="end">corporel</text><rect class="box-p" x="132.0" y="142.0" width="118.5" height="51.0" rx="6"/><text class="t-sm" x="138.0" y="158.0" text-anchor="start">adulte → enfant</text><rect class="box-p" x="254.5" y="142.0" width="118.5" height="51.0" rx="6"/><text class="t-sm" x="260.5" y="158.0" text-anchor="start">variable</text><rect class="box-p" x="377.0" y="142.0" width="118.5" height="51.0" rx="6"/><text class="t-sm" x="383.0" y="158.0" text-anchor="start">oui, par nature</text><rect class="box-p" x="499.5" y="142.0" width="118.5" height="51.0" rx="6"/><text class="t-sm" x="505.5" y="158.0" text-anchor="start">interdit à</text><text class="t-sm" x="505.5" y="171.0" text-anchor="start">l&#x27;école, licite au</text><text class="t-sm" x="505.5" y="184.0" text-anchor="start">domicile</text><text class="t-b" x="120.0" y="215.0" text-anchor="end">Discipline</text><rect class="box-s" x="132.0" y="199.0" width="118.5" height="51.0" rx="6"/><text class="t-sm" x="138.0" y="215.0" text-anchor="start">adulte → enfant</text><rect class="box-s" x="254.5" y="199.0" width="118.5" height="51.0" rx="6"/><text class="t-sm" x="260.5" y="215.0" text-anchor="start">—</text><rect class="box-s" x="377.0" y="199.0" width="118.5" height="51.0" rx="6"/><text class="t-sm" x="383.0" y="215.0" text-anchor="start">—</text><rect class="box-s" x="499.5" y="199.0" width="118.5" height="51.0" rx="6"/><text class="t-sm" x="505.5" y="215.0" text-anchor="start">règles,</text><text class="t-sm" x="505.5" y="228.0" text-anchor="start">conséquences</text><text class="t-sm" x="505.5" y="241.0" text-anchor="start">logiques, dialogue</text><text class="t-sm" x="10.0" y="264.0" text-anchor="start">Le mot malgache ne contient ni la répétition ni le déséquilibre de pouvoir : il englobe</text><text class="t-sm" x="10.0" y="279.0" text-anchor="start">harcèlement et châtiment sans les distinguer.</text></svg>