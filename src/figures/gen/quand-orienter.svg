<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 534" role="img" aria-labelledby="quand-orienter-t quand-orienter-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="quand-orienter-t">Quand orienter, et vers quoi</title><desc id="quand-orienter-d">Organigramme, dans l&#x27;ordre : la sécurité n&#x27;est pas assurée → arrêt immédiat de l&#x27;exposition avant toute autre démarche ; idées suicidaires ou automutilations → ne pas laisser seul, retirer les moyens de se blesser, accompagner sans attendre vers un service d&#x27;urgence ou de psychiatrie ; symptômes persistant au-delà d&#x27;un mois, déscolarisation, consommation de substances ou régression durable → orientation vers un professionnel formé à la psychothérapie centrée sur le trauma, ou à défaut vers un soignant formé au programme de l&#x27;OMS pour les non-spécialistes ; aucun de ces signes → surveillance active avec soutien de l&#x27;entourage et date de réévaluation (NICE, 2018 ; OMS mhGAP, 2023 ; Inserm, 2020).</desc><defs><marker id="quand-orienter-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><rect class="box-p" x="130.0" y="16.0" width="490.0" height="58.0" rx="8"/><text class="t-b" x="140.0" y="36.0">1. La sécurité est-elle assurée ?</text><text class="t-sm" x="140.0" y="54.0">Si non : arrêt immédiat de l&#x27;exposition, avant toute autre démarche.</text><circle class="f1" cx="100" cy="36" r="14"/><text class="on-fill t-b" x="100" y="41" text-anchor="middle">1</text><line class="arrow" x1="375.0" y1="76.0" x2="375.0" y2="90.0" marker-end="url(#quand-orienter-arr)"/><rect class="box-p" x="130.0" y="94.0" width="490.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="114.0">2. Idées suicidaires ou automutilations ?</text><circle class="f1" cx="100" cy="114" r="14"/><text class="on-fill t-b" x="100" y="119" text-anchor="middle">2</text><rect class="box" x="130.0" y="160.0" width="235.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="180.0">Non : question suivante</text><line class="arrow-soft" x1="335.0" y1="134.0" x2="247.5" y2="158.0" marker-end="url(#quand-orienter-arr)"/><rect class="box-b" x="385.0" y="160.0" width="235.0" height="100.0" rx="8"/><text class="t-b" x="395.0" y="180.0">Oui : ne pas laisser seul</text><text class="t-sm" x="395.0" y="198.0">retirer les moyens de se</text><text class="t-sm" x="395.0" y="212.0">blesser, accompagner sans</text><text class="t-sm" x="395.0" y="226.0">attendre vers un service</text><text class="t-sm" x="395.0" y="240.0">d&#x27;urgence ou de psychiatrie</text><line class="arrow-soft" x1="415.0" y1="134.0" x2="502.5" y2="158.0" marker-end="url(#quand-orienter-arr)"/><line class="arrow" x1="375.0" y1="262.0" x2="375.0" y2="276.0" marker-end="url(#quand-orienter-arr)"/><rect class="box-p" x="130.0" y="280.0" width="490.0" height="54.0" rx="8"/><text class="t-b" x="140.0" y="300.0">3. Symptômes au-delà d&#x27;un mois, déscolarisation, substances,</text><text class="t-b" x="140.0" y="316.0">régression durable ?</text><circle class="f1" cx="100" cy="300" r="14"/><text class="on-fill t-b" x="100" y="305" text-anchor="middle">3</text><rect class="box-s" x="130.0" y="362.0" width="235.0" height="72.0" rx="8"/><text class="t-b" x="140.0" y="382.0">Non : surveillance active</text><text class="t-sm" x="140.0" y="400.0">soutien de l&#x27;entourage, date de</text><text class="t-sm" x="140.0" y="414.0">réévaluation fixée</text><line class="arrow-soft" x1="335.0" y1="336.0" x2="247.5" y2="360.0" marker-end="url(#quand-orienter-arr)"/><rect class="box-a" x="385.0" y="362.0" width="235.0" height="100.0" rx="8"/><text class="t-b" x="395.0" y="382.0">Oui : orienter</text><text class="t-sm" x="395.0" y="400.0">professionnel formé à la</text><text class="t-sm" x="395.0" y="414.0">psychothérapie centrée sur le</text><text class="t-sm" x="395.0" y="428.0">trauma, ou soignant formé au</text><text class="t-sm" x="395.0" y="442.0">programme mhGAP de l&#x27;OMS</text><line class="arrow-soft" x1="415.0" y1="336.0" x2="502.5" y2="360.0" marker-end="url(#quand-orienter-arr)"/><text class="t-sm" x="10.0" y="474.0" text-anchor="start">Portes d&#x27;entrée à Madagascar : Centres Vonjy pour les violences sexuelles, Ligne Verte 147 pour</text><text class="t-sm" x="10.0" y="489.0" text-anchor="start">le signalement et l&#x27;orientation, services d&#x27;urgence et de psychiatrie (NICE, 2018 ; OMS, 2023 ;</text><text class="t-sm" x="10.0" y="504.0" text-anchor="start">Inserm, 2020).</text></svg>