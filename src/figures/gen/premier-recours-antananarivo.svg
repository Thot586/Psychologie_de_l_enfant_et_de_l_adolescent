<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 277" width="640" height="277" role="img" aria-labelledby="premier-recours-antananarivo-t premier-recours-antananarivo-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="premier-recours-antananarivo-t">Vers qui les familles se tournent d&#x27;abord</title><desc id="premier-recours-antananarivo-d">Barres horizontales des premiers recours thérapeutiques devant un trouble psychique : traitement religieux 40 % ; recours psychiatrique 32,5 % ; recours mixte 7,5 % ; médecine générale 5 % ; tradipraticien seul 2,5 %. Étude rétrospective portant sur 217 patients du service de psychiatrie du centre hospitalier universitaire Joseph Raseta Befelatanana, à Antananarivo, de janvier 2014 à avril 2015 (Bakohariliva et al., 2018). Dans la même série, 75 % des patients pris en charge d&#x27;emblée en psychiatrie s&#x27;amélioraient en moins de dix jours. Étude d&#x27;un seul service, rétrospective : la sévérité du trouble influence à la fois le chemin suivi et la durée du séjour. Il ne s&#x27;agit pas d&#x27;opposer les recours entre eux : on peut prier et consulter.</desc><line class="grid" x1="250.0" y1="12" x2="250.0" y2="243"/><text class="t-sm" x="250.0" y="259" text-anchor="middle">0</text><line class="grid" x1="314.0" y1="12" x2="314.0" y2="243"/><text class="t-sm" x="314.0" y="259" text-anchor="middle">10</text><line class="grid" x1="378.0" y1="12" x2="378.0" y2="243"/><text class="t-sm" x="378.0" y="259" text-anchor="middle">20</text><line class="grid" x1="442.0" y1="12" x2="442.0" y2="243"/><text class="t-sm" x="442.0" y="259" text-anchor="middle">30</text><line class="grid" x1="506.0" y1="12" x2="506.0" y2="243"/><text class="t-sm" x="506.0" y="259" text-anchor="middle">40</text><line class="grid" x1="570.0" y1="12" x2="570.0" y2="243"/><text class="t-sm" x="570.0" y="259" text-anchor="middle">50 %</text><path class="f1" d="M250.0,28 h252.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-252.0 z"><title>Traitement religieux : 40 %</title></path><text x="240" y="39.0" text-anchor="end" dominant-baseline="middle">Traitement religieux</text><text class="t-num" x="514.0" y="39" dominant-baseline="middle">40 %</text><path class="f1" d="M250.0,73 h204.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-204.0 z"><title>Recours psychiatrique : 32,5 %</title></path><text x="240" y="84.0" text-anchor="end" dominant-baseline="middle">Recours psychiatrique</text><text class="t-num" x="466.0" y="84" dominant-baseline="middle">32,5 %</text><path class="f1" d="M250.0,118 h44.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-44.0 z"><title>Recours mixte : 7,5 %</title></path><text x="240" y="129.0" text-anchor="end" dominant-baseline="middle">Recours mixte</text><text class="t-num" x="306.0" y="129" dominant-baseline="middle">7,5 %</text><path class="f1" d="M250.0,163 h28.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-28.0 z"><title>Médecine générale : 5 %</title></path><text x="240" y="174.0" text-anchor="end" dominant-baseline="middle">Médecine générale</text><text class="t-num" x="290.0" y="174" dominant-baseline="middle">5 %</text><path class="f1" d="M250.0,208 h12.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-12.0 z"><title>Tradipraticien seul : 2,5 %</title></path><text x="240" y="219.0" text-anchor="end" dominant-baseline="middle">Tradipraticien seul</text><text class="t-num" x="274.0" y="219" dominant-baseline="middle">2,5 %</text></svg>