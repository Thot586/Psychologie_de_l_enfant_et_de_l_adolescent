<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 188" role="img" aria-labelledby="cinq-etapes-parcours-t cinq-etapes-parcours-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="cinq-etapes-parcours-t">Les cinq étapes du parcours</title><desc id="cinq-etapes-parcours-d">Cinq jalons reliés par une flèche continue, de gauche à droite. Étape A, comprendre l&#x27;enfant, 3 modules : développement, besoins et émotions, traumatisme et résilience. Étape B, comprendre le harcèlement, 4 modules : définir, nommer à Madagascar, selon l&#x27;âge, les chiffres. Étape C, ce que ça fait et qui est exposé, 3 modules : conséquences, facteurs d&#x27;exposition, écrans et vie en ligne. Étape D, agir, 4 modules : repérer, parler et écouter, mon enfant est concerné, demander de l&#x27;aide. Étape E, transmettre, 4 modules : prévenir, sensibiliser, ressources, consolider. Chaque étape prépare la suivante : on ne qualifie pas un comportement sans connaître l&#x27;âge, on n&#x27;agit pas sans avoir qualifié. Schéma de la structure du site, 18 modules répartis en cinq étapes ; aucune donnée chiffrée.</desc><defs><marker id="cinq-etapes-parcours-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><rect class="box-p" x="20.0" y="16.0" width="99.2" height="160.0" rx="8"/><text class="t-b" x="30.0" y="36.0">A ·</text><text class="t-b" x="30.0" y="52.0">Comprendre</text><text class="t-b" x="30.0" y="68.0">l&#x27;enfant</text><text class="t-sm" x="30.0" y="86.0">3 modules</text><text class="t-sm" x="30.0" y="100.0">développement</text><text class="t-sm" x="30.0" y="114.0">besoins et</text><text class="t-sm" x="30.0" y="128.0">émotions</text><text class="t-sm" x="30.0" y="142.0">traumatisme</text><text class="t-sm" x="30.0" y="156.0">et résilience</text><line class="arrow" x1="121.2" y1="96.0" x2="143.2" y2="96.0" marker-end="url(#cinq-etapes-parcours-arr)"/><rect class="box-p" x="145.2" y="16.0" width="99.2" height="160.0" rx="8"/><text class="t-b" x="155.2" y="36.0">B ·</text><text class="t-b" x="155.2" y="52.0">Comprendre le</text><text class="t-b" x="155.2" y="68.0">harcèlement</text><text class="t-sm" x="155.2" y="86.0">4 modules</text><text class="t-sm" x="155.2" y="100.0">définir</text><text class="t-sm" x="155.2" y="114.0">nommer à</text><text class="t-sm" x="155.2" y="128.0">Madagascar</text><text class="t-sm" x="155.2" y="142.0">selon l&#x27;âge</text><text class="t-sm" x="155.2" y="156.0">les chiffres</text><line class="arrow" x1="246.4" y1="96.0" x2="268.4" y2="96.0" marker-end="url(#cinq-etapes-parcours-arr)"/><rect class="box-p" x="270.4" y="16.0" width="99.2" height="160.0" rx="8"/><text class="t-b" x="280.4" y="36.0">C · Ce que ça</text><text class="t-b" x="280.4" y="52.0">fait, qui est</text><text class="t-b" x="280.4" y="68.0">exposé</text><text class="t-sm" x="280.4" y="86.0">3 modules</text><text class="t-sm" x="280.4" y="100.0">conséquences</text><text class="t-sm" x="280.4" y="114.0">facteurs</text><text class="t-sm" x="280.4" y="128.0">d&#x27;exposition</text><text class="t-sm" x="280.4" y="142.0">écrans et vie</text><text class="t-sm" x="280.4" y="156.0">en ligne</text><line class="arrow" x1="371.6" y1="96.0" x2="393.6" y2="96.0" marker-end="url(#cinq-etapes-parcours-arr)"/><rect class="box-a" x="395.6" y="16.0" width="99.2" height="160.0" rx="8"/><text class="t-b" x="405.6" y="36.0">D · Agir</text><text class="t-sm" x="405.6" y="54.0">4 modules</text><text class="t-sm" x="405.6" y="68.0">repérer</text><text class="t-sm" x="405.6" y="82.0">parler et</text><text class="t-sm" x="405.6" y="96.0">écouter</text><text class="t-sm" x="405.6" y="110.0">mon enfant</text><text class="t-sm" x="405.6" y="124.0">est concerné</text><text class="t-sm" x="405.6" y="138.0">demander de</text><text class="t-sm" x="405.6" y="152.0">l&#x27;aide</text><line class="arrow" x1="496.8" y1="96.0" x2="518.8" y2="96.0" marker-end="url(#cinq-etapes-parcours-arr)"/><rect class="box-s" x="520.8" y="16.0" width="99.2" height="160.0" rx="8"/><text class="t-b" x="530.8" y="36.0">E ·</text><text class="t-b" x="530.8" y="52.0">Transmettre</text><text class="t-sm" x="530.8" y="70.0">4 modules</text><text class="t-sm" x="530.8" y="84.0">prévenir</text><text class="t-sm" x="530.8" y="98.0">sensibiliser</text><text class="t-sm" x="530.8" y="112.0">ressources</text><text class="t-sm" x="530.8" y="126.0">consolider</text></svg>