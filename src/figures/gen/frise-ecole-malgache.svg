<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" role="img" aria-labelledby="frise-ecole-malgache-t frise-ecole-malgache-d" class="scroll" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="frise-ecole-malgache-t">L&#x27;école malgache et ses habitudes de discipline : deux siècles</title><desc id="frise-ecole-malgache-d">Frise à jalons : 1810-1828, écoles des missions protestantes britanniques sous Radama Ier, naissance de l&#x27;école à Madagascar ; 1899, obligation scolaire proclamée par Gallieni, école coloniale formant des auxiliaires de l&#x27;administration, hiérarchies entre enseignants selon le sexe et l&#x27;origine ; années 1940, école missionnaire prise entre christianiser, franciser, malgachiser ; années 1970, malgachisation de l&#x27;enseignement ; 1996, arrêté ministériel 5246-96 MEN interdisant le châtiment corporel à l&#x27;école, complété par une note de 2017 ; 2018, étude nationale sur les violences envers les enfants ; 2025, première enquête GSHS. Le châtiment corporel reste licite au domicile (Rakotozafindrasambo, 2022 ; Duteil, 2011 ; Rosnes, 2017 ; Koerner, 1999 ; Randriamasinony, 2007 ; End Corporal Punishment, 2019 ; IBCR et UNICEF, 2018 ; OMS, 2025).</desc><line class="line" x1="30" y1="30" x2="610" y2="30"/><line class="line" x1="55.2" y1="26" x2="55.2" y2="34"/><text class="t-sm" x="55.2" y="48" text-anchor="middle">1810</text><line class="line" x1="156.1" y1="26" x2="156.1" y2="34"/><text class="t-sm" x="156.1" y="48" text-anchor="middle">1850</text><line class="line" x1="279.7" y1="26" x2="279.7" y2="34"/><text class="t-sm" x="279.7" y="48" text-anchor="middle">1899</text><line class="line" x1="383.0" y1="26" x2="383.0" y2="34"/><text class="t-sm" x="383.0" y="48" text-anchor="middle">1940</text><line class="line" x1="471.3" y1="26" x2="471.3" y2="34"/><text class="t-sm" x="471.3" y="48" text-anchor="middle">1975</text><line class="line" x1="524.3" y1="26" x2="524.3" y2="34"/><text class="t-sm" x="524.3" y="48" text-anchor="middle">1996</text><line class="line" x1="579.7" y1="26" x2="579.7" y2="34"/><text class="t-sm" x="579.7" y="48" text-anchor="middle">2018</text><line class="line" x1="597.4" y1="26" x2="597.4" y2="34"/><circle class="f1" cx="67.8" cy="58" r="5"/><text class="t-sm" x="90.8" y="74.0" text-anchor="middle">Écoles des missions</text><text class="t-sm" x="90.8" y="87.0" text-anchor="middle">protestantes</text><text class="t-sm" x="90.8" y="100.0" text-anchor="middle">(1810-1828)</text><circle class="f1" cx="279.7" cy="58" r="5"/><text class="t-sm" x="279.7" y="74.0" text-anchor="middle">Obligation scolaire,</text><text class="t-sm" x="279.7" y="87.0" text-anchor="middle">école coloniale (1899)</text><circle class="f1" cx="395.7" cy="58" r="5"/><line class="line-soft" x1="395.7" y1="64" x2="395.7" y2="110.0"/><text class="t-sm" x="395.7" y="119.0" text-anchor="middle">Christianiser,</text><text class="t-sm" x="395.7" y="132.0" text-anchor="middle">franciser, malgachiser</text><text class="t-sm" x="395.7" y="145.0" text-anchor="middle">(années 1940)</text><circle class="f1" cx="471.3" cy="58" r="5"/><text class="t-sm" x="471.3" y="74.0" text-anchor="middle">Malgachisation (années</text><text class="t-sm" x="471.3" y="87.0" text-anchor="middle">1970)</text><circle class="f1" cx="524.3" cy="58" r="5"/><line class="line-soft" x1="524.3" y1="64" x2="524.3" y2="155.0"/><text class="t-sm" x="524.3" y="164.0" text-anchor="middle">Arrêté 5246-96 :</text><text class="t-sm" x="524.3" y="177.0" text-anchor="middle">châtiment corporel</text><text class="t-sm" x="524.3" y="190.0" text-anchor="middle">interdit à l&#x27;école ;</text><text class="t-sm" x="524.3" y="203.0" text-anchor="middle">note de 2017</text><circle class="f2" cx="579.7" cy="58" r="5"/><line class="line-soft" x1="579.7" y1="64" x2="546.0" y2="110.0"/><text class="t-sm" x="546.0" y="119.0" text-anchor="middle">Étude nationale sur</text><text class="t-sm" x="546.0" y="132.0" text-anchor="middle">les violences (2018)</text><circle class="f2" cx="597.4" cy="58" r="5"/><line class="line-soft" x1="597.4" y1="64" x2="542.8" y2="213.0"/><text class="t-sm" x="542.8" y="222.0" text-anchor="middle">Première enquête GSHS</text><text class="t-sm" x="542.8" y="235.0" text-anchor="middle">(2025)</text><text class="t-sm" x="10.0" y="260.0" text-anchor="start">Le châtiment corporel reste licite au domicile. Sources : Rakotozafindrasambo (2022) ; Duteil</text><text class="t-sm" x="10.0" y="275.0" text-anchor="start">(2011) ; Rosnes (2017) ; Koerner (1999) ; Randriamasinony (2007) ; End Corporal Punishment</text><text class="t-sm" x="10.0" y="290.0" text-anchor="start">(2019) ; IBCR et UNICEF (2018) ; OMS (2025).</text></svg>