<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 408" role="img" aria-labelledby="fourche-six-chemins-t fourche-six-chemins-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="fourche-six-chemins-t">J&#x27;ai remarqué quelque chose : six chemins, une règle commune</title><desc id="fourche-six-chemins-d">À partir de « j&#x27;ai remarqué quelque chose », six chemins : mon enfant est harcelé ; mon enfant harcèle ; mon enfant est témoin ; j&#x27;encadre un groupe où ça se passe ; ce n&#x27;est pas mon enfant (voisin, neveu, enfant confié) ; l&#x27;auteur est un adulte de l&#x27;école. Règle commune : protéger d&#x27;abord, qualifier ensuite.</desc><defs><marker id="fourche-six-chemins-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><rect class="box-s" x="20.0" y="16.0" width="600.0" height="38.0" rx="8"/><text class="t-b" x="30.0" y="36.0">Règle commune : protéger d&#x27;abord, qualifier ensuite</text><rect class="box" x="320.0" y="68.0" width="300.0" height="38.0" rx="8"/><text class="t-b" x="330.0" y="88.0">1. Mon enfant est harcelé</text><rect class="box" x="320.0" y="116.0" width="300.0" height="38.0" rx="8"/><text class="t-b" x="330.0" y="136.0">2. Mon enfant harcèle</text><rect class="box" x="320.0" y="164.0" width="300.0" height="38.0" rx="8"/><text class="t-b" x="330.0" y="184.0">3. Mon enfant est témoin</text><rect class="box" x="320.0" y="212.0" width="300.0" height="38.0" rx="8"/><text class="t-b" x="330.0" y="232.0">4. J&#x27;encadre un groupe où ça se passe</text><rect class="box" x="320.0" y="260.0" width="300.0" height="58.0" rx="8"/><text class="t-b" x="330.0" y="280.0">5. Ce n&#x27;est pas mon enfant</text><text class="t-sm" x="330.0" y="298.0">voisin, neveu, enfant confié</text><rect class="box" x="320.0" y="328.0" width="300.0" height="38.0" rx="8"/><text class="t-b" x="330.0" y="348.0">6. L&#x27;auteur est un adulte de l&#x27;école</text><rect class="box-p" x="20.0" y="182.0" width="190.0" height="70.0" rx="8"/><text class="t-b" x="30.0" y="202.0">J&#x27;ai remarqué quelque</text><text class="t-b" x="30.0" y="218.0">chose</text><path class="arrow-soft" d="M210,217.0 C270,217.0 260,87.0 318,87.0" marker-end="url(#fourche-six-chemins-arr)"/><path class="arrow-soft" d="M210,217.0 C270,217.0 260,135.0 318,135.0" marker-end="url(#fourche-six-chemins-arr)"/><path class="arrow-soft" d="M210,217.0 C270,217.0 260,183.0 318,183.0" marker-end="url(#fourche-six-chemins-arr)"/><path class="arrow-soft" d="M210,217.0 C270,217.0 260,231.0 318,231.0" marker-end="url(#fourche-six-chemins-arr)"/><path class="arrow-soft" d="M210,217.0 C270,217.0 260,289.0 318,289.0" marker-end="url(#fourche-six-chemins-arr)"/><path class="arrow-soft" d="M210,217.0 C270,217.0 260,347.0 318,347.0" marker-end="url(#fourche-six-chemins-arr)"/><text class="t-sm" x="10.0" y="382.0" text-anchor="start">Chaque chemin est détaillé dans le module ; la règle commune vaut pour tous.</text></svg>