<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" width="640" height="324" role="img" aria-labelledby="prevalences-comparees-t prevalences-comparees-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="prevalences-comparees-t">Combien d&#x27;élèves déclarent être harcelés ?</title><desc id="prevalences-comparees-d">Barres horizontales classées de la plus faible à la plus forte, en pourcentage d&#x27;élèves déclarant avoir été harcelés : Maurice 22,2 (Aboagye et al., 2021a) ; Madagascar 27,2, seule donnée nationale malagasy, élèves de 13 à 17 ans harcelés à l&#x27;école dans l&#x27;année, 2 440 élèves et 38 écoles (OMS, 2025) ; Afrique australe 32,73 (Rtbey et al., 2025) ; monde 32, soit environ un élève sur trois au cours du mois écoulé, 144 pays (UNESCO, 2019) ; Afrique subsaharienne 38,8, 11 pays et 25 454 élèves (Aboagye et al., 2021a) ; méta-analyse africaine 46,35, intervalle de confiance à 95 % de 41,45 à 51,24, 25 études et 41 716 adolescents (Rtbey et al., 2025) ; Afrique de l&#x27;Est 49,17 (Rtbey et al., 2025) ; Sierra Leone 54,6 (Aboagye et al., 2021a). Les périodes interrogées diffèrent, mois écoulé ou année écoulée : ces chiffres ne sont pas strictement comparables entre eux.</desc><line class="grid" x1="250.0" y1="12" x2="250.0" y2="290"/><text class="t-sm" x="250.0" y="306" text-anchor="middle">0</text><line class="grid" x1="303.3" y1="12" x2="303.3" y2="290"/><text class="t-sm" x="303.3" y="306" text-anchor="middle">10</text><line class="grid" x1="356.7" y1="12" x2="356.7" y2="290"/><text class="t-sm" x="356.7" y="306" text-anchor="middle">20</text><line class="grid" x1="410.0" y1="12" x2="410.0" y2="290"/><text class="t-sm" x="410.0" y="306" text-anchor="middle">30</text><line class="grid" x1="463.3" y1="12" x2="463.3" y2="290"/><text class="t-sm" x="463.3" y="306" text-anchor="middle">40</text><line class="grid" x1="516.7" y1="12" x2="516.7" y2="290"/><text class="t-sm" x="516.7" y="306" text-