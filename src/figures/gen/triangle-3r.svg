<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 474" role="img" aria-labelledby="triangle-3r-t triangle-3r-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="triangle-3r-t">Les 3 R : Répétition, Rapport de force, Retentissement</title><desc id="triangle-3r-d">Triangle avec un R à chaque sommet et une question en langage courant : Répétition, est-ce que ça se reproduit ? Rapport de force, l&#x27;enfant peut-il se défendre à armes égales ? Retentissement, souffre-t-il, évite-t-il, ses résultats chutent-ils ? Au centre : harcèlement présumé si les trois sont présents.</desc><polygon class="box" points="320,84 110,364 530,364"/><text class="t-b" x="320" y="24" text-anchor="middle">Répétition</text><text class="t-sm" x="320.0" y="40.0" text-anchor="middle">est-ce que ça se reproduit ?</text><text class="t-b" x="100" y="386" text-anchor="start">Rapport de force</text><text class="t-sm" x="100.0" y="402.0" text-anchor="start">l&#x27;enfant peut-il se défendre à</text><text class="t-sm" x="100.0" y="415.0" text-anchor="start">armes égales ?</text><text class="t-b" x="540" y="386" text-anchor="end">Retentissement</text><text class="t-sm" x="540.0" y="402.0" text-anchor="end">souffre-t-il, évite-t-il, ses</text><text class="t-sm" x="540.0" y="415.0" text-anchor="end">résultats chutent-ils ?</text><rect class="box-b" x="230.0" y="224.0" width="180.0" height="72.0" rx="8"/><text class="t-b" x="240.0" y="244.0">Harcèlement présumé</text><text class="t-sm" x="240.0" y="262.0">si les trois sont</text><text class="t-sm" x="240.0" y="276.0">présents</text><text class="t-sm" x="10.0" y="436.0" text-anchor="start">Les 3 R reformulent les critères d&#x27;Olweus en langage de terrain ; un seul incident sans</text><text class="t-sm" x="10.0" y="451.0" text-anchor="start">déséquilibre relève du conflit.</text></svg>