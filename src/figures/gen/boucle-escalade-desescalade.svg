<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376.0" role="img" aria-labelledby="boucle-escalade-desescalade-t boucle-escalade-desescalade-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="boucle-escalade-desescalade-t">Escalade et désescalade</title><desc id="boucle-escalade-desescalade-d">Deux boucles. Escalade : ordre, refus, punition, refus plus fort, et retour au début. Désescalade : nommer l&#x27;émotion, proposer un choix, laisser réparer, revenir sur ce qui s&#x27;est passé, et retour au début.</desc><defs><marker id="boucle-escalade-desescalade-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><line class="arrow" x1="202.5" y1="142.5" x2="214.6" y2="154.6" marker-end="url(#boucle-escalade-desescalade-arr)"/><line class="arrow" x1="217.5" y1="222.5" x2="205.4" y2="234.6" marker-end="url(#boucle-escalade-desescalade-arr)"/><line class="arrow" x1="137.5" y1="237.5" x2="125.4" y2="225.4" marker-end="url(#boucle-escalade-desescalade-arr)"/><line class="arrow" x1="122.5" y1="157.5" x2="134.6" y2="145.4" marker-end="url(#boucle-escalade-desescalade-arr)"/><rect class="box-b" x="118.0" y="96.0" width="104.0" height="28.0" rx="7"/><text class="t-sm" x="170.0" y="112.0" text-anchor="middle">Ordre</text><rect class="box-b" x="198.0" y="176.0" width="104.0" height="28.0" rx="7"/><text class="t-sm" x="250.0" y="192.0" text-anchor="middle">Refus</text><rect class="box-b" x="118.0" y="256.0" width="104.0" height="28.0" rx="7"/><text class="t-sm" x="170.0" y="272.0" text-anchor="middle">Punition</text><rect class="box-b" x="38.0" y="169.0" width="104.0" height="42.0" rx="7"/><text class="t-sm" x="90.0" y="185.0" text-anchor="middle">Refus plus</text><text class="t-sm" x="90.0" y="199.0" text-anchor="middle">fort</text><text class="t-b" x="170.0" y="336.0" text-anchor="middle">Escalade</text><line class="arrow" x1="502.5" y1="142.5" x2="514.6" y2="154.6" marker-end="url(#boucle-escalade-desescalade-arr)"/><line class="arrow" x1="517.5" y1="222.5" x2="505.4" y2="234.6" marker-end="url(#boucle-escalade-desescalade-arr)"/><line class="arrow" x1="437.5" y1="237.5" x2="425.4" y2="225.4" marker-end="url(#boucle-escalade-desescalade-arr)"/><line class="arrow" x1="422.5" y1="157.5" x2="434.6" y2="145.4" marker-end="url(#boucle-escalade-desescalade-arr)"/><rect class="box-s" x="418.0" y="89.0" width="104.0" height="42.0" rx="7"/><text class="t-sm" x="470.0" y="105.0" text-anchor="middle">Nommer</text><text class="t-sm" x="470.0" y="119.0" text-anchor="middle">l&#x27;émotion</text><rect class="box-s" x="498.0" y="169.0" width="104.0" height="42.0" rx="7"/><text class="t-sm" x="550.0" y="185.0" text-anchor="middle">Proposer un</text><text class="t-sm" x="550.0" y="199.0" text-anchor="middle">choix</text><rect class="box-s" x="418.0" y="249.0" width="104.0" height="42.0" rx="7"/><text class="t-sm" x="470.0" y="265.0" text-anchor="middle">Laisser</text><text class="t-sm" x="470.0" y="279.0" text-anchor="middle">réparer</text><rect class="box-s" x="338.0" y="162.0" width="104.0" height="56.0" rx="7"/><text class="t-sm" x="390.0" y="178.0" text-anchor="middle">Revenir sur ce</text><text class="t-sm" x="390.0" y="192.0" text-anchor="middle">qui s&#x27;est</text><text class="t-sm" x="390.0" y="206.0" text-anchor="middle">passé</text><text class="t-b" x="470.0" y="336.0" text-anchor="middle">Désescalade</text><text class="t-sm" x="10.0" y="354.0" text-anchor="start">La boucle de gauche se referme sur plus de tension ; celle de droite sur un apprentissage.</text></svg>