<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 508" role="img" aria-labelledby="cercles-resilience-t cercles-resilience-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="cercles-resilience-t">Où se fabrique la résilience</title><desc id="cercles-resilience-d">Cinq cercles emboîtés, l&#x27;influence circulant dans les deux sens. Au centre, l&#x27;enfant : autorégulation, sentiment d&#x27;efficacité, sens donné à l&#x27;expérience. Puis la famille et la famille élargie ; l&#x27;école et les pairs, avec un enseignant de confiance et au moins un ami ; la communauté : voisinage, communauté religieuse, association ; le système : santé, protection de l&#x27;enfance. La résilience se fabrique surtout dans les cercles extérieurs, autour de l&#x27;enfant (Masten et Barnes, 2018 ; Ungar, 2011). À Madagascar, les ressources communautaires nommées relèvent de l&#x27;opinion d&#x27;expert : aucune étude locale ne les a mesurées.</desc><circle class="box" cx="230" cy="230" r="210.0"/><circle class="box" cx="230" cy="230" r="168.0"/><circle class="box-a" cx="230" cy="230" r="126.0"/><circle class="box-s" cx="230" cy="230" r="84.0"/><circle class="box-p" cx="230" cy="230" r="42.0"/><text class="t-b" x="230" y="234.0" text-anchor="middle">L&#x27;enfant</text><text class="t-b" x="230" y="171.0" text-anchor="middle">Famille</text><text class="t-b" x="230" y="129.0" text-anchor="middle">École et pairs</text><text class="t-b" x="230" y="87.0" text-anchor="middle">Communauté</text><text class="t-b" x="230" y="45.0" text-anchor="middle">Système</text><circle class="box-p" cx="470" cy="34" r="6"/><text class="t-b" x="484" y="38">L&#x27;enfant</text><text class="t-sm" x="484" y="54">autorégulation,</text><text class="t-sm" x="484" y="68">sentiment d&#x27;efficacité,</text><text class="t-sm" x="484" y="82">sens donné à</text><text class="t-sm" x="484" y="96">l&#x27;expérience</text><circle class="box-s" cx="470" cy="116" r="6"/><text class="t-b" x="484" y="120">Famille</text><text class="t-sm" x="484" y="136">famille élargie, au</text><text class="t-sm" x="484" y="150">moins un adulte fiable</text><circle class="box-a" cx="470" cy="170" r="6"/><text class="t-b" x="484" y="174">École et pairs</text><text class="t-sm" x="484" y="190">un enseignant de</text><text class="t-sm" x="484" y="204">confiance, au moins un</text><text class="t-sm" x="484" y="218">ami</text><circle class="box" cx="470" cy="238" r="6"/><text class="t-b" x="484" y="242">Communauté</text><text class="t-sm" x="484" y="258">voisinage, communauté</text><text class="t-sm" x="484" y="272">religieuse, association</text><circle class="box" cx="470" cy="292" r="6"/><text class="t-b" x="484" y="296">Système</text><text class="t-sm" x="484" y="312">santé, protection de</text><text class="t-sm" x="484" y="326">l&#x27;enfance</text><text class="t-sm" x="10.0" y="454.0" text-anchor="start">L&#x27;influence circule dans les deux sens ; la résilience se fabrique surtout autour de l&#x27;enfant</text><text class="t-sm" x="10.0" y="469.0" text-anchor="start">(Masten et Barnes, 2018 ; Ungar, 2011). Ressources malagasy : opinion d&#x27;expert, non mesurées</text><text class="t-sm" x="10.0" y="484.0" text-anchor="start">localement.</text></svg>