<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" role="img" aria-labelledby="balance-risques-protections-t balance-risques-protections-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="balance-risques-protections-t">Adversités et protections : une balance, pas un destin</title><desc id="balance-risques-protections-d">Balance à fléau. Plateau gauche, adversités : harcèlement répété, violence à la maison, isolement, pauvreté. Plateau droit, protections : au moins un adulte fiable, des amis, une école qui protège, des compétences, un sens. Le pivot : au moins un adulte fiable. La résilience se construit ; elle n&#x27;est ni un don ni une obligation.</desc><polygon class="box-p" points="306,300 334,300 320,120"/><text class="t-b" x="320" y="324" text-anchor="middle">au moins un adulte fiable</text><g transform="rotate(-6 320 120)"><line class="line" x1="90" y1="120" x2="550" y2="120" stroke-width="3"/><line class="line-soft" x1="110" y1="120" x2="110" y2="170"/><line class="line-soft" x1="530" y1="120" x2="530" y2="170"/></g><rect class="box-b" x="5.0" y="170.0" width="210.0" height="100.0" rx="8"/><text class="t-b" x="15.0" y="190.0">Adversités</text><text class="t-sm" x="15.0" y="208.0">harcèlement répété</text><text class="t-sm" x="15.0" y="222.0">violence à la maison</text><text class="t-sm" x="15.0" y="236.0">isolement</text><text class="t-sm" x="15.0" y="250.0">pauvreté</text><rect class="box-s" x="425.0" y="150.0" width="210.0" height="100.0" rx="8"/><text class="t-b" x="435.0" y="170.0">Protections</text><text class="t-sm" x="435.0" y="188.0">au moins un adulte fiable</text><text class="t-sm" x="435.0" y="202.0">des amis</text><text class="t-sm" x="435.0" y="216.0">une école qui protège</text><text class="t-sm" x="435.0" y="230.0">des compétences, un sens</text><text class="t-sm" x="10.0" y="350.0" text-anchor="start">La résilience se construit ; elle n&#x27;est ni un don ni une obligation de s&#x27;en sortir (Masten et</text><text class="t-sm" x="10.0" y="365.0" text-anchor="start">Barnes, 2018).</text></svg>