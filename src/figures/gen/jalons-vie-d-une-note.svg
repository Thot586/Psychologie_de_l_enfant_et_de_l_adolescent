<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="jalons-vie-d-une-note-t jalons-vie-d-une-note-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="jalons-vie-d-une-note-t">La vie d&#x27;une note : cinq jalons</title><desc id="jalons-vie-d-une-note-d">Cinq étapes du cycle de vie d&#x27;un écrit concernant un enfant. Écrire : les faits, les dates, les lieux, les personnes présentes, les mots de l&#x27;enfant entre guillemets, sans interprétation ni diagnostic ni jugement sur la famille. Ranger : un support unique, sous clé ou protégé par un mot de passe, jamais sur un appareil partagé ni dans un groupe de messagerie. Donner accès : la personne référente et le responsable de la structure ; la famille peut consulter et faire corriger une erreur. Transmettre : seulement ce qui est nécessaire, seulement aux services qui peuvent agir, avec une trace de la remise. Détruire : à la date fixée à l&#x27;avance, à la fin de l&#x27;accompagnement. D&#x27;après la loi malagasy n° 2014-038 du 9 janvier 2015 sur la protection des données à caractère personnel.</desc><defs><marker id="jalons-vie-d-une-note-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><rect class="box-p" x="20.0" y="16.0" width="99.2" height="198.0" rx="8"/><text class="t-b" x="30.0" y="36.0">1. Écrire</text><text class="t-sm" x="30.0" y="54.0">faits, dates,</text><text class="t-sm" x="30.0" y="68.0">lieux,</text><text class="t-sm" x="30.0" y="82.0">personnes</text><text class="t-sm" x="30.0" y="96.0">présentes</text><text class="t-sm" x="30.0" y="110.0">mots de</text><text class="t-sm" x="30.0" y="124.0">l&#x27;enfant</text><text class="t-sm" x="30.0" y="138.0">entre</text><text class="t-sm" x="30.0" y="152.0">guillemets</text><text class="t-sm" x="30.0" y="166.0">ni</text><text class="t-sm" x="30.0" y="180.0">interprétation,</text><text class="t-sm" x="30.0" y="194.0">ni diagnostic</text><line class="arrow" x1="121.2" y1="115.0" x2="143.2" y2="115.0" marker-end="url(#jalons-vie-d-une-note-arr)"/><rect class="box-p" x="145.2" y="16.0" width="99.2" height="198.0" rx="8"/><text class="t-b" x="155.2" y="36.0">2. Ranger</text><text class="t-sm" x="155.2" y="54.0">un seul</text><text class="t-sm" x="155.2" y="68.0">support, sous</text><text class="t-sm" x="155.2" y="82.0">clé ou mot de</text><text class="t-sm" x="155.2" y="96.0">passe</text><text class="t-sm" x="155.2" y="110.0">jamais un</text><text class="t-sm" x="155.2" y="124.0">appareil</text><text class="t-sm" x="155.2" y="138.0">partagé</text><line class="arrow" x1="246.4" y1="115.0" x2="268.4" y2="115.0" marker-end="url(#jalons-vie-d-une-note-arr)"/><rect class="box-a" x="270.4" y="16.0" width="99.2" height="198.0" rx="8"/><text class="t-b" x="280.4" y="36.0">3. Donner</text><text class="t-b" x="280.4" y="52.0">accès</text><text class="t-sm" x="280.4" y="70.0">la personne</text><text class="t-sm" x="280.4" y="84.0">référente et</text><text class="t-sm" x="280.4" y="98.0">le</text><text class="t-sm" x="280.4" y="112.0">responsable</text><text class="t-sm" x="280.4" y="126.0">la famille</text><text class="t-sm" x="280.4" y="140.0">peut</text><text class="t-sm" x="280.4" y="154.0">consulter et</text><text class="t-sm" x="280.4" y="168.0">corriger</text><line class="arrow" x1="371.6" y1="115.0" x2="393.6" y2="115.0" marker-end="url(#jalons-vie-d-une-note-arr)"/><rect class="box-a" x="395.6" y="16.0" width="99.2" height="198.0" rx="8"/><text class="t-b" x="405.6" y="36.0">4.</text><text class="t-b" x="405.6" y="52.0">Transmettre</text><text class="t-sm" x="405.6" y="70.0">ce qui est</text><text class="t-sm" x="405.6" y="84.0">nécessaire, à</text><text class="t-sm" x="405.6" y="98.0">qui peut agir</text><text class="t-sm" x="405.6" y="112.0">garder une</text><text class="t-sm" x="405.6" y="126.0">trace de la</text><text class="t-sm" x="405.6" y="140.0">remise</text><line class="arrow" x1="496.8" y1="115.0" x2="518.8" y2="115.0" marker-end="url(#jalons-vie-d-une-note-arr)"/><rect class="box-s" x="520.8" y="16.0" width="99.2" height="198.0" rx="8"/><text class="t-b" x="530.8" y="36.0">5. Détruire</text><text class="t-sm" x="530.8" y="54.0">à la date</text><text class="t-sm" x="530.8" y="68.0">fixée</text><text class="t-sm" x="530.8" y="82.0">d&#x27;avance</text><text class="t-sm" x="530.8" y="96.0">à la fin de</text><text class="t-sm" x="530.8" y="110.0">l&#x27;accompagnement</text><text class="t-sm" x="10.0" y="226.0" text-anchor="start">Une note protège l&#x27;enfant ; elle ne le décrit pas. La durée de conservation est limitée à ce</text><text class="t-sm" x="10.0" y="241.0" text-anchor="start">pour quoi elle a été écrite (loi n° 2014-038).</text></svg>