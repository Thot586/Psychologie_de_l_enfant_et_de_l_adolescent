<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 124" width="640" height="124" role="img" aria-labelledby="good-school-toolkit-t good-school-toolkit-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="good-school-toolkit-t">Good School Toolkit (Ouganda) : violence physique du personnel dans la semaine, à 18 mois</title><desc id="good-school-toolkit-d">Deux points reliés : 48,7 % dans les écoles témoins, 31,0 % dans les écoles ayant reçu le programme (essai randomisé en grappes, 42 écoles primaires, Devries et al. 2015).</desc><circle class="halo" cx="256" cy="12" r="8"/><circle class="dot-ring" cx="256" cy="12" r="6"/><text x="269" y="12.5" dominant-baseline="middle">Écoles témoins</text><circle class="halo" cx="402.0" cy="12" r="8"/><circle class="f1" cx="402.0" cy="12" r="6"/><text x="415.0" y="12.5" dominant-baseline="middle">Écoles avec le programme</text><line class="grid" x1="250.0" y1="28" x2="250.0" y2="90"/><text class="t-sm" x="250.0" y="106" text-anchor="middle">0</text><line class="grid" x1="303.3" y1="28" x2="303.3" y2="90"/><text class="t-sm" x="303.3" y="106" text-anchor="middle">10</text><line class="grid" x1="356.7" y1="28" x2="356.7" y2="90"/><text class="t-sm" x="356.7" y="106" text-anchor="middle">20</text><line class="grid" x1="410.0" y1="28" x2="410.0" y2="90"/><text class="t-sm" x="410.0" y="106" text-anchor="middle">30</text><line class="grid" x1="463.3" y1="28" x2="463.3" y2="90"/><text class="t-sm" x="463.3" y="106" text-anchor="middle">40</text><line class="grid" x1="516.7" y1="28" x2="516.7" y2="90"/><text class="t-sm" x="516.7" y="106" text-anchor="middle">50</text><line class="grid" x1="570.0" y1="28" x2="570.0" y2="90"/><text class="t-sm" x="570.0" y="106" text-anchor="middle">60 %</text><line class="line" x1="509.7" y1="54" x2="426.3" y2="54" stroke-width="3"/><path class="f1" d="M426.3,49 L426.3,59 L417.3,54 z"/><circle class="halo" cx="509.7" cy="54" r="9"/><circle class="dot-ring" cx="509.7" cy="54" r="7"><title>Écoles témoins : 48,7 %</title></circle><circle class="halo" cx="415.3" cy="54" r="9"/><circle class="f1" cx="415.3" cy="54" r="7"><title>Écoles avec le programme : 31 %</title></circle><text class="t-num" x="509.7" y="39" text-anchor="middle">48,7 %</text><text class="t-num" x="415.3" y="39" text-anchor="middle">31 %</text><text x="240" y="47.0" text-anchor="end" dominant-baseline="middle">Violence physique du personnel,</text><text x="240" y="62.0" text-anchor="end" dominant-baseline="middle">une semaine</text></svg>