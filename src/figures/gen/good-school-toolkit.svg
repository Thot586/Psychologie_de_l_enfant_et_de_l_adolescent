<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 106" width="640" height="106" role="img" aria-labelledby="good-school-toolkit-t good-school-toolkit-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="good-school-toolkit-t">Good School Toolkit (Ouganda) : violence physique du personnel dans la semaine, à 18 mois</title><desc id="good-school-toolkit-d">Deux points reliés : 48,7 % dans les écoles témoins, 31,0 % dans les écoles ayant reçu le programme (essai randomisé en grappes, 42 écoles primaires, Devries et al. 2015).</desc><line class="grid" x1="250.0" y1="14" x2="250.0" y2="72"/><text class="t-sm" x="250.0" y="88" text-anchor="middle">0</text><line class="grid" x1="303.3" y1="14" x2="303.3" y2="72"/><text class="t-sm" x="303.3" y="88" text-anchor="middle">10</text><line class="grid" x1="356.7" y1="14" x2="356.7" y2="72"/><text class="t-sm" x="356.7" y="88" text-anchor="middle">20</text><line class="grid" x1="410.0" y1="14" x2="410.0" y2="72"/><text class="t-sm" x="410.0" y="88" text-anchor="middle">30</text><line class="grid" x1="463.3" y1="14" x2="463.3" y2="72"/><text class="t-sm" x="463.3" y="88" text-anchor="middle">40</text><line class="grid" x1="516.7" y1="14" x2="516.7" y2="72"/><text class="t-sm" x="516.7" y="88" text-anchor="middle">50</text><line class="grid" x1="570.0" y1="14" x2="570.0" y2="72"/><text class="t-sm" x="570.0" y="88" text-anchor="middle">60</text><line class="line" x1="509.7" y1="38" x2="415.3" y2="38" stroke-width="3"/><circle class="halo" cx="509.7" cy="38" r="9"/><circle class="dot" cx="509.7" cy="38" r="7"><title>Avant : 48,7 %</title></circle><circle class="halo" cx="415.3" cy="38" r="9"/><circle class="f1" cx="415.3" cy="38" r="7"><title>Après : 31 %</title></circle><text class="t-num" x="509.7" y="24" text-anchor="middle">48,7 %</text><text class="t-num" x="415.3" y="24" text-anchor="middle">31 %</text><text x="240" y="31.0" text-anchor="end" dominant-baseline="middle">Écoles témoins → écoles avec le</text><text x="240" y="46.0" text-anchor="end" dominant-baseline="middle">programme</text></svg>