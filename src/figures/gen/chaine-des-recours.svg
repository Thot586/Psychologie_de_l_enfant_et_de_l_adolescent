<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 146" role="img" aria-labelledby="chaine-des-recours-t chaine-des-recours-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="chaine-des-recours-t">À qui la famille parle d&#x27;abord, et où l&#x27;enfant peut être perdu</title><desc id="chaine-des-recours-d">Chaîne des recours dans l&#x27;ordre réel : la famille et les ray aman-dreny ; le fokontany, héritier administratif du fokonolona, et le cas échéant le dina ; l&#x27;Église ou le responsable religieux, souvent aussi l&#x27;établissement quand l&#x27;école est confessionnelle ; l&#x27;école et son responsable ; le Réseau de Protection de l&#x27;Enfant et la Ligne Verte 147 ; les soins, consultation ou service de psychiatrie. À chaque maillon, la démarche peut s&#x27;arrêter. Un dispositif communautaire n&#x27;est pas automatiquement protecteur : un dina peut être capté par les puissants du lieu. On peut prier et consulter : ne demandez jamais à une famille de choisir. Le 147 signale et oriente, ce n&#x27;est pas une ligne de crise (Condominas, 1961 ; Andriamalala, 2010 ; Klein, 2024 ; Bakohariliva et al., 2018).</desc><defs><marker id="chaine-des-recours-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><rect class="box-p" x="20.0" y="16.0" width="78.3" height="118.0" rx="8"/><text class="t-b" x="30.0" y="36.0">1. Famille,</text><text class="t-b" x="30.0" y="52.0">ray</text><text class="t-b" x="30.0" y="68.0">aman-dreny</text><text class="t-sm" x="30.0" y="86.0">peut</text><text class="t-sm" x="30.0" y="100.0">s&#x27;arrêter</text><text class="t-sm" x="30.0" y="114.0">ici</text><line class="arrow" x1="100.3" y1="75.0" x2="122.3" y2="75.0" marker-end="url(#chaine-des-recours-arr)"/><rect class="box" x="124.3" y="16.0" width="78.3" height="118.0" rx="8"/><text class="t-b" x="134.3" y="36.0">2.</text><text class="t-b" x="134.3" y="52.0">Fokontany,</text><text class="t-b" x="134.3" y="68.0">dina</text><text class="t-sm" x="134.3" y="86.0">peut</text><text class="t-sm" x="134.3" y="100.0">s&#x27;arrêter</text><text class="t-sm" x="134.3" y="114.0">ici</text><line class="arrow" x1="204.7" y1="75.0" x2="226.7" y2="75.0" marker-end="url(#chaine-des-recours-arr)"/><rect class="box" x="228.7" y="16.0" width="78.3" height="118.0" rx="8"/><text class="t-b" x="238.7" y="36.0">3. Église,</text><text class="t-b" x="238.7" y="52.0">responsable</text><text class="t-b" x="238.7" y="68.0">religieux</text><text class="t-sm" x="238.7" y="86.0">premier</text><text class="t-sm" x="238.7" y="100.0">recours</text><text class="t-sm" x="238.7" y="114.0">fréquent</text><line class="arrow" x1="309.0" y1="75.0" x2="331.0" y2="75.0" marker-end="url(#chaine-des-recours-arr)"/><rect class="box" x="333.0" y="16.0" width="78.3" height="118.0" rx="8"/><text class="t-b" x="343.0" y="36.0">4. École,</text><text class="t-b" x="343.0" y="52.0">direction</text><text class="t-sm" x="343.0" y="70.0">peut</text><text class="t-sm" x="343.0" y="84.0">s&#x27;arrêter</text><text class="t-sm" x="343.0" y="98.0">ici</text><line class="arrow" x1="413.3" y1="75.0" x2="435.3" y2="75.0" marker-end="url(#chaine-des-recours-arr)"/><rect class="box-a" x="437.3" y="16.0" width="78.3" height="118.0" rx="8"/><text class="t-b" x="447.3" y="36.0">5. RPE,</text><text class="t-b" x="447.3" y="52.0">Ligne Verte</text><text class="t-b" x="447.3" y="68.0">147</text><text class="t-sm" x="447.3" y="86.0">signale et</text><text class="t-sm" x="447.3" y="100.0">oriente</text><line class="arrow" x1="517.7" y1="75.0" x2="539.7" y2="75.0" marker-end="url(#chaine-des-recours-arr)"/><rect class="box-s" x="541.7" y="16.0" width="78.3" height="118.0" rx="8"/><text class="t-b" x="551.7" y="36.0">6. Soins,</text><text class="t-b" x="551.7" y="52.0">psychiatrie</text><text class="t-sm" x="551.7" y="70.0">consultation,</text><text class="t-sm" x="551.7" y="84.0">urgence</text></svg>