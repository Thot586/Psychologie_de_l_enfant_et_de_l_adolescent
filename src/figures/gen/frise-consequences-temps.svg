<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="frise-consequences-temps-t frise-consequences-temps-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="frise-consequences-temps-t">Ce qui est observé, et quand</title><desc id="frise-consequences-temps-d">Quatre blocs se succédant dans le temps, de gauche à droite. Semaines qui suivent : anxiété, sommeil difficile, maux de ventre et de tête, évitement de lieux et de moments, chute de la concentration (Moore et al., 2017, 165 études retenues sur 317 évaluées). Mois à 2 ans : symptômes dépressifs et anxieux encore mesurables entre jumeaux identiques dont un seul a été harcelé (Singham et al., 2017, cohorte TEDS, 11 108 jumeaux). Vers 5 ans : la plupart des écarts ne sont plus mesurables ; seules persistent la désorganisation cognitive et les pensées de type paranoïde. Début de l&#x27;âge adulte : dépression, anxiété, trouble panique, agoraphobie et idées suicidaires plus fréquents chez les anciennes victimes, dans trois cohortes suivies en Finlande, aux États-Unis et au Royaume-Uni (Arseneault, 2017 et 2018). Ce qui pèse le plus n&#x27;est pas d&#x27;avoir été harcelé une fois, mais de l&#x27;être longtemps (Bowes et al., 2013, cohorte E-Risk, 2 232 enfants). Repères de groupe, pas de pronostic individuel.</desc><defs><marker id="frise-consequences-temps-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><rect class="box-b" x="20.0" y="16.0" width="130.5" height="172.0" rx="8"/><text class="t-b" x="30.0" y="36.0">Semaines qui</text><text class="t-b" x="30.0" y="52.0">suivent</text><text class="t-sm" x="30.0" y="70.0">anxiété, sommeil</text><text class="t-sm" x="30.0" y="84.0">difficile</text><text class="t-sm" x="30.0" y="98.0">maux de ventre et</text><text class="t-sm" x="30.0" y="112.0">de tête</text><text class="t-sm" x="30.0" y="126.0">évitement de lieux</text><text class="t-sm" x="30.0" y="140.0">et de moments</text><text class="t-sm" x="30.0" y="154.0">chute de la</text><text class="t-sm" x="30.0" y="168.0">concentration</text><line class="arrow" x1="152.5" y1="102.0" x2="174.5" y2="102.0" marker-end="url(#frise-consequences-temps-arr)"/><rect class="box-a" x="176.5" y="16.0" width="130.5" height="172.0" rx="8"/><text class="t-b" x="186.5" y="36.0">Mois à 2 ans</text><text class="t-sm" x="186.5" y="54.0">symptômes</text><text class="t-sm" x="186.5" y="68.0">dépressifs et</text><text class="t-sm" x="186.5" y="82.0">anxieux encore</text><text class="t-sm" x="186.5" y="96.0">mesurables</text><text class="t-sm" x="186.5" y="110.0">entre jumeaux dont</text><text class="t-sm" x="186.5" y="124.0">un seul a été</text><text class="t-sm" x="186.5" y="138.0">harcelé</text><line class="arrow" x1="309.0" y1="102.0" x2="331.0" y2="102.0" marker-end="url(#frise-consequences-temps-arr)"/><rect class="box-s" x="333.0" y="16.0" width="130.5" height="172.0" rx="8"/><text class="t-b" x="343.0" y="36.0">Vers 5 ans</text><text class="t-sm" x="343.0" y="54.0">la plupart des</text><text class="t-sm" x="343.0" y="68.0">écarts ne sont</text><text class="t-sm" x="343.0" y="82.0">plus mesurables</text><text class="t-sm" x="343.0" y="96.0">persistent :</text><text class="t-sm" x="343.0" y="110.0">désorganisation</text><text class="t-sm" x="343.0" y="124.0">cognitive, pensées</text><text class="t-sm" x="343.0" y="138.0">de type paranoïde</text><line class="arrow" x1="465.5" y1="102.0" x2="487.5" y2="102.0" marker-end="url(#frise-consequences-temps-arr)"/><rect class="box-b" x="489.5" y="16.0" width="130.5" height="172.0" rx="8"/><text class="t-b" x="499.5" y="36.0">Début de l&#x27;âge</text><text class="t-b" x="499.5" y="52.0">adulte</text><text class="t-sm" x="499.5" y="70.0">dépression,</text><text class="t-sm" x="499.5" y="84.0">anxiété, trouble</text><text class="t-sm" x="499.5" y="98.0">panique,</text><text class="t-sm" x="499.5" y="112.0">agoraphobie</text><text class="t-sm" x="499.5" y="126.0">idées suicidaires</text><text class="t-sm" x="499.5" y="140.0">plus fréquentes</text><text class="t-sm" x="10.0" y="200.0" text-anchor="start">Ce qui pèse le plus n&#x27;est pas d&#x27;avoir été harcelé une fois, mais de l&#x27;être longtemps (Bowes et</text><text class="t-sm" x="10.0" y="215.0" text-anchor="start">al., 2013). Repères de groupe, pas de pronostic individuel. Sources : Moore et al., 2017 ;</text><text class="t-sm" x="10.0" y="230.0" text-anchor="start">Singham et al., 2017 ; Arseneault, 2017 et 2018.</text></svg>