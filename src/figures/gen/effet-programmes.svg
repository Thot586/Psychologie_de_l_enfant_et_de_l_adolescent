<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 162" width="640" height="162" role="img" aria-labelledby="effet-programmes-t effet-programmes-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="effet-programmes-t">De combien un programme anti-harcèlement fait baisser le harcèlement</title><desc id="effet-programmes-d">Barres horizontales : réduction de la victimisation d&#x27;environ 15 à 16 %, réduction de la perpétration d&#x27;environ 18 à 19 % (méta-analyse Campbell de 100 évaluations, Gaffney et al. 2021a, surtout en Europe et en Amérique du Nord).</desc><line class="grid" x1="250.0" y1="12" x2="250.0" y2="128"/><text class="t-sm" x="250.0" y="144" text-anchor="middle">0</text><line class="grid" x1="356.7" y1="12" x2="356.7" y2="128"/><text class="t-sm" x="356.7" y="144" text-anchor="middle">10</text><line class="grid" x1="463.3" y1="12" x2="463.3" y2="128"/><text class="t-sm" x="463.3" y="144" text-anchor="middle">20</text><line class="grid" x1="570.0" y1="12" x2="570.0" y2="128"/><text class="t-sm" x="570.0" y="144" text-anchor="middle">30 %</text><path class="f1" d="M250.0,28 h161.33333333333337 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-161.33333333333337 z"><title>Victimisation · réduction : 15,5 % (15 à 16 % selon les études)</title></path><line class="line" x1="410.0" y1="39" x2="420.7" y2="39" stroke-width="1.5"/><line class="line" x1="410.0" y1="33" x2="410.0" y2="45"/><line class="line" x1="420.7" y1="33" x2="420.7" y2="45"/><text x="240" y="39.0" text-anchor="end" dominant-baseline="middle">Victimisation · réduction</text><text class="t-num" x="428.7" y="39" dominant-baseline="middle">15,5 %</text><text class="t-sm" x="240" y="55.0" text-anchor="end">15 à 16 % selon les études</text><path class="f1" d="M250.0,83 h193.33333333333337 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-193.33333333333337 z"><title>Perpétration · réduction : 18,5 % (18 à 19 % selon les études)</title></path><line class="line" x1="442.0" y1="94" x2="452.7" y2="94" stroke-width="1.5"/><line class="line" x1="442.0" y1="88" x2="442.0" y2="100"/><line class="line" x1="452.7" y1="88" x2="452.7" y2="100"/><text x="240" y="94.0" text-anchor="end" dominant-baseline="middle">Perpétration · réduction</text><text class="t-num" x="460.7" y="94" dominant-baseline="middle">18,5 %</text><text class="t-sm" x="240" y="110.0" text-anchor="end">18 à 19 % selon les études</text></svg>