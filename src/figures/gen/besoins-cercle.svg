<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 222" role="img" aria-labelledby="besoins-cercle-t besoins-cercle-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="besoins-cercle-t">Pas une pyramide : des besoins simultanés</title><desc id="besoins-cercle-d">Deux panneaux. À gauche, la pyramide de Maslow à cinq étages, barrée : la hiérarchie n&#x27;est pas confirmée par les données, les besoins ne se satisfont pas dans l&#x27;ordre (Tay et Diener, 2011, enquête dans 123 pays). À droite, un cercle de cinq composantes égales des soins attentifs, simultanées et non empilées : santé, nutrition, sécurité et sûreté, soins bienveillants, possibilités d&#x27;apprentissage précoce (OMS, UNICEF et Banque mondiale, 2018), avec au centre trois besoins psychologiques : autonomie, compétence, relation (Ryan et Deci, 2000).</desc><rect class="box" x="20.0" y="16.0" width="294.0" height="186.0" rx="8"/><text class="t-b" x="30.0" y="36.0">Pyramide barrée : hiérarchie non</text><text class="t-b" x="30.0" y="52.0">confirmée</text><text class="t-sm" x="30.0" y="70.0">Accomplissement</text><text class="t-sm" x="30.0" y="84.0">Estime</text><text class="t-sm" x="30.0" y="98.0">Appartenance</text><text class="t-sm" x="30.0" y="112.0">Sécurité</text><text class="t-sm" x="30.0" y="126.0">Besoins physiologiques</text><text class="t-sm" x="30.0" y="140.0">—</text><text class="t-sm" x="30.0" y="154.0">Les besoins ne se satisfont pas dans</text><text class="t-sm" x="30.0" y="168.0">l&#x27;ordre : enquête dans 123 pays (Tay et</text><text class="t-sm" x="30.0" y="182.0">Diener, 2011)</text><rect class="box-s" x="326.0" y="16.0" width="294.0" height="186.0" rx="8"/><text class="t-b" x="336.0" y="36.0">Cercle : cinq composantes simultanées</text><text class="t-sm" x="336.0" y="54.0">Santé</text><text class="t-sm" x="336.0" y="68.0">Nutrition</text><text class="t-sm" x="336.0" y="82.0">Sécurité et sûreté</text><text class="t-sm" x="336.0" y="96.0">Soins bienveillants</text><text class="t-sm" x="336.0" y="110.0">Possibilités d&#x27;apprentissage précoce</text><text class="t-sm" x="336.0" y="124.0">—</text><text class="t-sm" x="336.0" y="138.0">Au centre : autonomie, compétence,</text><text class="t-sm" x="336.0" y="152.0">relation (Ryan et Deci, 2000)</text><text class="t-sm" x="336.0" y="166.0">Cadre des soins attentifs (OMS, UNICEF,</text><text class="t-sm" x="336.0" y="180.0">Banque mondiale, 2018)</text></svg>