<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 359" role="img" aria-labelledby="besoins-cercle-t besoins-cercle-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="besoins-cercle-t">Pas une pyramide : des besoins simultanés</title><desc id="besoins-cercle-d">Deux panneaux. À gauche, la pyramide de Maslow à cinq étages, barrée : la hiérarchie n&#x27;est pas confirmée par les données, les besoins ne se satisfont pas dans l&#x27;ordre (Tay et Diener, 2011, enquête dans 123 pays). À droite, un cercle de cinq composantes égales des soins attentifs, simultanées et non empilées : santé, nutrition, sécurité et sûreté, soins bienveillants, possibilités d&#x27;apprentissage précoce (OMS, UNICEF et Banque mondiale, 2018), avec au centre trois besoins psychologiques : autonomie, compétence, relation (Ryan et Deci, 2000).</desc><rect class="box" x="20.0" y="16.0" width="294.0" height="323.0" rx="8"/><text class="t-b" x="30.0" y="36.0">La pyramide : une hiérarchie non</text><text class="t-b" x="30.0" y="52.0">confirmée</text><text class="t-sm" x="30.0" y="232.0">Les besoins ne se satisfont pas dans</text><text class="t-sm" x="30.0" y="246.0">l&#x27;ordre : enquête dans 123 pays (Tay et</text><text class="t-sm" x="30.0" y="260.0">Diener, 2011)</text><polygon class="etage" points="151.0,64.0 183.0,64.0 203.4,84.0 130.6,84.0"/><text class="t-sm" x="167.0" y="78.0" text-anchor="middle">Accomplissement</text><polygon class="etage" points="130.6,86.0 203.4,86.0 223.8,106.0 110.2,106.0"/><text class="t-sm" x="167.0" y="100.0" text-anchor="middle">Estime</text><polygon class="etage" points="110.2,108.0 223.8,108.0 244.2,128.0 89.8,128.0"/><text class="t-sm" x="167.0" y="122.0" text-anchor="middle">Appartenance</text><polygon class="etage" points="89.8,130.0 244.2,130.0 264.6,150.0 69.4,150.0"/><text class="t-sm" x="167.0" y="144.0" text-anchor="middle">Sécurité</text><polygon class="etage" points="69.4,152.0 264.6,152.0 285.0,172.0 49.0,172.0"/><text class="t-sm" x="167.0" y="166.0" text-anchor="middle">Physiologiques</text><line class="barre" x1="43.0" y1="174.0" x2="291.0" y2="62.0"/><rect class="box-s" x="326.0" y="16.0" width="294.0" height="323.0" rx="8"/><text class="t-b" x="336.0" y="36.0">Le cercle : cinq composantes simultanées</text><text class="t-sm" x="336.0" y="216.0">1 santé · 2 nutrition · 3 sécurité et</text><text class="t-sm" x="336.0" y="230.0">sûreté · 4 soins bienveillants · 5</text><text class="t-sm" x="336.0" y="244.0">possibilités d&#x27;apprentissage précoce</text><text class="t-sm t-b" x="336.0" y="258.0">Au centre</text><text class="t-sm" x="342.0" y="272.0">autonomie, compétence, relation (Ryan et</text><text class="t-sm" x="342.0" y="286.0">Deci, 2000)</text><text class="t-sm" x="336.0" y="305.0">Cadre des soins attentifs (OMS, UNICEF,</text><text class="t-sm" x="336.0" y="319.0">Banque mondiale, 2018)</text><path class="part" d="M474.3,83.5 L475.6,48.0 A74,74 0 0 1 542.5,96.7 L509.2,108.8 A38.480000000000004,38.480000000000004 0 0 0 474.3,83.5 Z"/><text class="t-sm t-b on-fill" x="506.1" y="80.5" text-anchor="middle">1</text><path class="part" d="M510.0,111.4 L544.1,101.6 A74,74 0 0 1 518.6,180.3 L496.7,152.3 A38.480000000000004,38.480000000000004 0 0 0 510.0,111.4 Z"/><text class="t-sm t-b on-fill" x="526.5" y="143.4" text-anchor="middle">2</text><path class="part" d="M494.5,153.9 L514.4,183.4 A74,74 0 0 1 431.6,183.4 L451.5,153.9 A38.480000000000004,38.480000000000004 0 0 0 494.5,153.9 Z"/><text class="t-sm t-b on-fill" x="473.0" y="182.2" text-anchor="middle">3</text><path class="part" d="M449.3,152.3 L427.4,180.3 A74,74 0 0 1 401.9,101.6 L436.0,111.4 A38.480000000000004,38.480000000000004 0 0 0 449.3,152.3 Z"/><text class="t-sm t-b on-fill" x="419.5" y="143.4" text-anchor="middle">4</text><path class="part" d="M436.8,108.8 L403.5,96.7 A74,74 0 0 1 470.4,48.0 L471.7,83.5 A38.480000000000004,38.480000000000004 0 0 0 436.8,108.8 Z"/><text class="t-sm t-b on-fill" x="439.9" y="80.5" text-anchor="middle">5</text><text class="t-sm" x="473.0" y="114.0" text-anchor="middle">autonomie ·</text><text class="t-sm" x="473.0" y="127.0" text-anchor="middle">compétence ·</text><text class="t-sm" x="473.0" y="140.0" text-anchor="middle">relation</text></svg>