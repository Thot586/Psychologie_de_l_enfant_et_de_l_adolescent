<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" role="img" aria-labelledby="calendrier-puberte-t calendrier-puberte-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="calendrier-puberte-t">La puberté n&#x27;arrive pas au même moment pour tout le monde</title><desc id="calendrier-puberte-d">Deux bandes sur un axe de 7 à 18 ans : chez les filles, le début de la puberté se situe en moyenne entre 8 et 13 ans ; chez les garçons, entre 9 et 14 ans ; le processus se poursuit plusieurs années. Dans une même classe de 11 ans, certains ont déjà terminé leur poussée, d&#x27;autres n&#x27;ont pas commencé. Être en avance ou en retard sur son groupe expose davantage aux moqueries, à un regard sexualisé et aux difficultés psychologiques (Patton et Viner, 2007 ; Sawyer et al., 2018).</desc><text class="t-b" x="38" y="42">Filles : début entre 8 et 13 ans, puis plusieurs années</text><circle class="dot-ink" cx="82.7" cy="80" r="4"/><line class="line-soft" x1="82.7" y1="59" x2="82.7" y2="76"/><text class="t-sm" x="88.7" y="56.0" text-anchor="start">début possible</text><circle class="dot-ink" cx="346.4" cy="80" r="4"/><line class="line-soft" x1="346.4" y1="59" x2="346.4" y2="76"/><text class="t-sm" x="352.4" y="56.0" text-anchor="start">début tardif</text><line class="line-soft" x1="30" y1="89" x2="610" y2="89"/><text class="t-b" x="38" y="108">Garçons : début entre 9 et 14 ans, puis plusieurs années</text><circle class="dot-ink" cx="135.5" cy="146" r="4"/><line class="line-soft" x1="135.5" y1="125" x2="135.5" y2="142"/><text class="t-sm" x="141.5" y="122.0" text-anchor="start">début possible</text><circle class="dot-ink" cx="399.1" cy="146" r="4"/><line class="line-soft" x1="399.1" y1="125" x2="399.1" y2="142"/><text class="t-sm" x="405.1" y="122.0" text-anchor="start">début tardif</text><line class="line" x1="30" y1="162" x2="610" y2="162"/><line class="line" x1="30.0" y1="158" x2="30.0" y2="166"/><text class="t-sm" x="30.0" y="180" text-anchor="middle">7</text><line class="line" x1="82.7" y1="158" x2="82.7" y2="166"/><text class="t-sm" x="82.7" y="180" text-anchor="middle">8</text><line class="line" x1="135.5" y1="158" x2="135.5" y2="166"/><text class="t-sm" x="135.5" y="180" text-anchor="middle">9</text><line class="line" x1="188.2" y1="158" x2="188.2" y2="166"/><text class="t-sm" x="188.2" y="180" text-anchor="middle">10</text><line class="line" x1="240.9" y1="158" x2="240.9" y2="166"/><text class="t-sm" x="240.9" y="180" text-anchor="middle">11</text><line class="line" x1="293.6" y1="158" x2="293.6" y2="166"/><text class="t-sm" x="293.6" y="180" text-anchor="middle">12</text><line class="line" x1="346.4" y1="158" x2="346.4" y2="166"/><text class="t-sm" x="346.4" y="180" text-anchor="middle">13</text><line class="line" x1="399.1" y1="158" x2="399.1" y2="166"/><text class="t-sm" x="399.1" y="180" text-anchor="middle">14</text><line class="line" x1="451.8" y1="158" x2="451.8" y2="166"/><text class="t-sm" x="451.8" y="180" text-anchor="middle">15</text><line class="line" x1="504.5" y1="158" x2="504.5" y2="166"/><text class="t-sm" x="504.5" y="180" text-anchor="middle">16</text><line class="line" x1="557.3" y1="158" x2="557.3" y2="166"/><text class="t-sm" x="557.3" y="180" text-anchor="middle">17</text><line class="line" x1="610.0" y1="158" x2="610.0" y2="166"/><text class="t-sm" x="610.0" y="180" text-anchor="middle">18</text><circle class="f3" cx="240.9" cy="190" r="5"/><text class="t-sm" x="240.9" y="206.0" text-anchor="middle">Dans une classe de 11</text><text class="t-sm" x="240.9" y="219.0" text-anchor="middle">ans : certains ont</text><text class="t-sm" x="240.9" y="232.0" text-anchor="middle">fini, d&#x27;autres n&#x27;ont</text><text class="t-sm" x="240.9" y="245.0" text-anchor="middle">pas commencé</text><text class="t-sm" x="10.0" y="270.0" text-anchor="start">Être en avance ou en retard sur son groupe expose davantage aux moqueries, à un regard</text><text class="t-sm" x="10.0" y="285.0" text-anchor="start">sexualisé et aux difficultés psychologiques (Patton et Viner, 2007 ; Sawyer et al., 2018).</text></svg>