<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120" role="img" aria-labelledby="surexposition-handicap-t surexposition-handicap-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="surexposition-handicap-t">Handicap : la surexposition la mieux documentée</title><desc id="surexposition-handicap-d">Points placés sur une échelle dont la ligne de référence à 1 représente le risque des autres enfants. Les enfants en situation de handicap ont environ deux fois plus de risques de subir des violences, d&#x27;après une revue mondiale (Eldred et al., 2025). Au Burkina Faso, une enquête auprès de 2 222 adolescents de 10 à 19 ans dans quatre régions trouve un risque de violences physiques multiplié par 6,5 (Musizvingoza et al., 2022). Deux repères accompagnent ces valeurs : environ 240 millions d&#x27;enfants dans le monde, près d&#x27;un sur dix, vivent avec un handicap (UNICEF, 2021) ; et la plupart des programmes de prévention en milieu scolaire ne sont ni conçus ni évalués pour ces enfants (Eldred et al., 2025). Madagascar : aucune donnée disponible, aucune barre n&#x27;est tracée pour le pays (Comité des droits de l&#x27;enfant, 2022).</desc><line class="grid" x1="250.0" y1="12" x2="250.0" y2="86"/><text class="t-sm" x="250.0" y="102" text-anchor="middle">0</text><line class="grid" x1="290.0" y1="12" x2="290.0" y2="86"/><text class="t-sm" x="290.0" y="102" text-anchor="middle">1</text><line class="grid" x1="330.0" y1="12" x2="330.0" y2="86"/><text class="t-sm" x="330.0" y="102" text-anchor="middle">2</text><line class="grid" x1="370.0" y1="12" x2="370.0" y2="86"/><text class="t-sm" x="370.0" y="102" text-anchor="middle">3</text><line class="grid" x1="410.0" y1="12" x2="410.0" y2="86"/><text class="t-sm" x="410.0" y="102" text-anchor="middle">4</text><line class="grid" x1="450.0" y1="12" x2="450.0" y2="86"/><text class="t-sm" x="450.0" y="102" text-anchor="middle">5</text><line class="grid" x1="490.0" y1="12" x2="490.0" y2="86"/><text class="t-sm" x="490.0" y="102" text-anchor="middle">6</text><line class="grid" x1="530.0" y1="12" x2="530.0" y2="86"/><text class="t-sm" x="530.0" y="102" text-anchor="middle">7</text><line class="grid" x1="570.0" y1="12" x2="570.0" y2="86"/><text class="t-sm" x="570.0" y="102" text-anchor="middle">8</text><line class="ref" x1="290.0" y1="12" x2="290.0" y2="86" stroke-width="2"/><text class="t-sm" x="294.0" y="10">1 = aucune différence</text><line class="line-soft" x1="290.0" y1="32" x2="330.0" y2="32"/><circle class="halo" cx="330.0" cy="32" r="8"/><circle class="f1" cx="330.0" cy="32" r="6"><title>Toutes violences · revue mondiale : 2</title></circle><text class="t-num" x="342.0" y="32" dominant-baseline="middle">2</text><text x="240" y="25.0" text-anchor="end" dominant-baseline="middle">Toutes violences · revue</text><text x="240" y="40.0" text-anchor="end" dominant-baseline="middle">mondiale</text><line class="line-soft" x1="290.0" y1="66" x2="510.0" y2="66"/><circle class="halo" cx="510.0" cy="66" r="8"/><circle class="f1" cx="510.0" cy="66" r="6"><title>Violences physiques · Burkina Faso, 10-19 ans : 6,5</title></circle><text class="t-num" x="522.0" y="66" dominant-baseline="middle">6,5</text><text x="240" y="59.0" text-anchor="end" dominant-baseline="middle">Violences physiques · Burkina</text><text x="240" y="74.0" text-anchor="end" dominant-baseline="middle">Faso, 10-19 ans</text></svg>