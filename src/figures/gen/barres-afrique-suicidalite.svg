<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 188" width="640" height="188" role="img" aria-labelledby="barres-afrique-suicidalite-t barres-afrique-suicidalite-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="barres-afrique-suicidalite-t">Ce que trouvent les études africaines</title><desc id="barres-afrique-suicidalite-d">Points placés sur une échelle de rapports de cotes allant de 0 à 3, avec une ligne de référence à 1 qui signifie « aucune différence ». Chez les élèves harcelés, les idées suicidaires sont plus fréquentes : rapport de cotes 1,68 (intervalle de confiance à 95 % : 1,56 à 1,81), sur 16 études, 34 007 participants et 11 pays africains (Bezie et al., 2025). Dans une réanalyse de onze enquêtes scolaires d&#x27;Afrique subsaharienne portant sur 25 454 adolescents scolarisés, les jeunes qui déclarent une tentative de suicide ont 1,86 fois plus de risque d&#x27;être harcelés, ceux qui consomment du cannabis 1,59 fois plus, ceux qui sont anxieux 1,53 fois plus (Aboagye et al., 2021a). Ce sont des associations mesurées à un instant donné : elles ne disent pas ce qui est venu en premier. Madagascar n&#x27;est inclus dans aucune de ces analyses, ni dans la synthèse de 25 études et 41 716 adolescents de 16 pays africains (Rtbey et al., 2025).</desc><line class="grid" x1="250.0" y1="12" x2="250.0" y2="154"/><text class="t-sm" x="250.0" y="170" text-anchor="middle">0</text><line class="grid" x1="356.7" y1="12" x2="356.7" y2="154"/><text class="t-sm" x="356.7" y="170" text-anchor="middle">1</text><line class="grid" x1="463.3" y1="12" x2="463.3" y2="154"/><text class="t-sm" x="463.3" y="170" text-anchor="middle">2</text><line class="grid" x1="570.0" y1="12" x2="570.0" y2="154"/><text class="t-sm" x="570.0" y="170" text-anchor="middle">3</text><line class="ref" x1="356.7" y1="12" x2="356.7" y2="154" stroke-width="2"/><text class="t-sm" x="360.7" y="10">1 = aucune différence</text><line class="line-soft" x1="356.7" y1="32" x2="429.2" y2="32"/><circle class="halo" cx="429.2" cy="32" r="8"/><circle class="f1" cx="429.2" cy="32" r="6"><title>Élèves harcelés · idées suicidaires : 1,68</title></circle><text class="t-num" x="441.2" y="32" dominant-baseline="middle">1,68</text><text x="240" y="25.0" text-anchor="end" dominant-baseline="middle">Élèves harcelés · idées</text><text x="240" y="40.0" text-anchor="end" dominant-baseline="middle">suicidaires</text><line class="line-soft" x1="356.7" y1="66" x2="448.4" y2="66"/><circle class="halo" cx="448.4" cy="66" r="8"/><circle class="f1" cx="448.4" cy="66" r="6"><title>Tentative de suicide · risque d&#x27;être harcelé : 1,86</title></circle><text class="t-num" x="460.4" y="66" dominant-baseline="middle">1,86</text><text x="240" y="59.0" text-anchor="end" dominant-baseline="middle">Tentative de suicide · risque</text><text x="240" y="74.0" text-anchor="end" dominant-baseline="middle">d&#x27;être harcelé</text><line class="line-soft" x1="356.7" y1="100" x2="419.6" y2="100"/><circle class="halo" cx="419.6" cy="100" r="8"/><circle class="f1" cx="419.6" cy="100" r="6"><title>Cannabis · risque d&#x27;être harcelé : 1,59</title></circle><text class="t-num" x="431.6" y="100" dominant-baseline="middle">1,59</text><text x="240" y="100.0" text-anchor="end" dominant-baseline="middle">Cannabis · risque d&#x27;être harcelé</text><line class="line-soft" x1="356.7" y1="134" x2="413.2" y2="134"/><circle class="halo" cx="413.2" cy="134" r="8"/><circle class="f1" cx="413.2" cy="134" r="6"><title>Anxiété · risque d&#x27;être harcelé : 1,53</title></circle><text class="t-num" x="425.2" y="134" dominant-baseline="middle">1,53</text><text x="240" y="134.0" text-anchor="end" dominant-baseline="middle">Anxiété · risque d&#x27;être harcelé</text></svg>