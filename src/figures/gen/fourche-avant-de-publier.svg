<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 980" role="img" aria-labelledby="fourche-avant-de-publier-t fourche-avant-de-publier-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="fourche-avant-de-publier-t">Avant de publier quoi que ce soit</title><desc id="fourche-avant-de-publier-d">Six questions successives à partir de « j&#x27;ai envie de publier quelque chose sur cette situation ». Une image, une voix ou un nom d&#x27;enfant : ne pas publier, transmettre. Une capture d&#x27;écran de harcèlement : ne pas publier, la conserver datée dans le dossier et la remettre à l&#x27;école, à la police ou à la gendarmerie. Une image intime de mineur : ne jamais la transférer, noter où elle a été vue et signaler à la Ligne Verte 147 et au portail national de signalement. Nommer une personne, une famille, un enseignant ou une école : ne pas publier, l&#x27;injure et la diffamation restant des infractions au titre de la loi n° 2014-006 modifiée en 2016. Un habitant du quartier pourrait reconnaître l&#x27;enfant : ne pas publier. Situation en cours devant l&#x27;école, la protection de l&#x27;enfance ou la justice : attendre. Si aucune de ces conditions n&#x27;est remplie, la publication devient possible après accord écrit du parent, accord de l&#x27;enfant et vérification de l&#x27;anonymisation.</desc><defs><marker id="fourche-avant-de-publier-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><rect class="box-p" x="130.0" y="16.0" width="490.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="36.0">1. Une image, une voix ou un nom d&#x27;enfant ?</text><circle class="f1" cx="100" cy="36" r="14"/><text class="on-fill t-b" x="100" y="41" text-anchor="middle">1</text><rect class="box" x="130.0" y="82.0" width="235.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="102.0">Non : question suivante</text><line class="arrow-soft" x1="335.0" y1="56.0" x2="247.5" y2="80.0" marker-end="url(#fourche-avant-de-publier-arr)"/><rect class="box-b" x="385.0" y="82.0" width="235.0" height="58.0" rx="8"/><text class="t-b" x="395.0" y="102.0">Oui : ne pas publier</text><text class="t-sm" x="395.0" y="120.0">transmettre à qui peut agir</text><line class="arrow-soft" x1="415.0" y1="56.0" x2="502.5" y2="80.0" marker-end="url(#fourche-avant-de-publier-arr)"/><line class="arrow" x1="375.0" y1="142.0" x2="375.0" y2="156.0" marker-end="url(#fourche-avant-de-publier-arr)"/><rect class="box-p" x="130.0" y="160.0" width="490.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="180.0">2. Une capture d&#x27;écran de harcèlement ?</text><circle class="f1" cx="100" cy="180" r="14"/><text class="on-fill t-b" x="100" y="185" text-anchor="middle">2</text><rect class="box" x="130.0" y="226.0" width="235.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="246.0">Non : question suivante</text><line class="arrow-soft" x1="335.0" y1="200.0" x2="247.5" y2="224.0" marker-end="url(#fourche-avant-de-publier-arr)"/><rect class="box-b" x="385.0" y="226.0" width="235.0" height="86.0" rx="8"/><text class="t-b" x="395.0" y="246.0">Oui : ne pas publier</text><text class="t-sm" x="395.0" y="264.0">la conserver datée dans le</text><text class="t-sm" x="395.0" y="278.0">dossier, la remettre à l&#x27;école,</text><text class="t-sm" x="395.0" y="292.0">à la police ou à la gendarmerie</text><line class="arrow-soft" x1="415.0" y1="200.0" x2="502.5" y2="224.0" marker-end="url(#fourche-avant-de-publier-arr)"/><line class="arrow" x1="375.0" y1="314.0" x2="375.0" y2="328.0" marker-end="url(#fourche-avant-de-publier-arr)"/><rect class="box-p" x="130.0" y="332.0" width="490.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="352.0">3. Une image intime de mineur ?</text><circle class="f1" cx="100" cy="352" r="14"/><text class="on-fill t-b" x="100" y="357" text-anchor="middle">3</text><rect class="box" x="130.0" y="398.0" width="235.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="418.0">Non : question suivante</text><line class="arrow-soft" x1="335.0" y1="372.0" x2="247.5" y2="396.0" marker-end="url(#fourche-avant-de-publier-arr)"/><rect class="box-b" x="385.0" y="398.0" width="235.0" height="86.0" rx="8"/><text class="t-b" x="395.0" y="418.0">Oui : ne jamais la transférer</text><text class="t-sm" x="395.0" y="436.0">noter où elle a été vue et</text><text class="t-sm" x="395.0" y="450.0">signaler : Ligne Verte 147,</text><text class="t-sm" x="395.0" y="464.0">portail national de signalement</text><line class="arrow-soft" x1="415.0" y1="372.0" x2="502.5" y2="396.0" marker-end="url(#fourche-avant-de-publier-arr)"/><line class="arrow" x1="375.0" y1="486.0" x2="375.0" y2="500.0" marker-end="url(#fourche-avant-de-publier-arr)"/><rect class="box-p" x="130.0" y="504.0" width="490.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="524.0">4. Je nomme une personne, une famille, un enseignant, une école ?</text><circle class="f1" cx="100" cy="524" r="14"/><text class="on-fill t-b" x="100" y="529" text-anchor="middle">4</text><rect class="box" x="130.0" y="570.0" width="235.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="590.0">Non : question suivante</text><line class="arrow-soft" x1="335.0" y1="544.0" x2="247.5" y2="568.0" marker-end="url(#fourche-avant-de-publier-arr)"/><rect class="box-b" x="385.0" y="570.0" width="235.0" height="86.0" rx="8"/><text class="t-b" x="395.0" y="590.0">Oui : ne pas publier</text><text class="t-sm" x="395.0" y="608.0">injure et diffamation restent</text><text class="t-sm" x="395.0" y="622.0">des infractions (loi n° 2014-006</text><text class="t-sm" x="395.0" y="636.0">modifiée en 2016)</text><line class="arrow-soft" x1="415.0" y1="544.0" x2="502.5" y2="568.0" marker-end="url(#fourche-avant-de-publier-arr)"/><line class="arrow" x1="375.0" y1="658.0" x2="375.0" y2="672.0" marker-end="url(#fourche-avant-de-publier-arr)"/><rect class="box-p" x="130.0" y="676.0" width="490.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="696.0">5. Quelqu&#x27;un du quartier pourrait-il reconnaître l&#x27;enfant ?</text><circle class="f1" cx="100" cy="696" r="14"/><text class="on-fill t-b" x="100" y="701" text-anchor="middle">5</text><rect class="box" x="130.0" y="742.0" width="235.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="762.0">Non : question suivante</text><line class="arrow-soft" x1="335.0" y1="716.0" x2="247.5" y2="740.0" marker-end="url(#fourche-avant-de-publier-arr)"/><rect class="box-b" x="385.0" y="742.0" width="235.0" height="38.0" rx="8"/><text class="t-b" x="395.0" y="762.0">Oui : ne pas publier</text><line class="arrow-soft" x1="415.0" y1="716.0" x2="502.5" y2="740.0" marker-end="url(#fourche-avant-de-publier-arr)"/><line class="arrow" x1="375.0" y1="782.0" x2="375.0" y2="796.0" marker-end="url(#fourche-avant-de-publier-arr)"/><rect class="box-p" x="130.0" y="800.0" width="490.0" height="54.0" rx="8"/><text class="t-b" x="140.0" y="820.0">6. La situation est-elle en cours devant l&#x27;école, la protection de</text><text class="t-b" x="140.0" y="836.0">l&#x27;enfance ou la justice ?</text><circle class="f1" cx="100" cy="820" r="14"/><text class="on-fill t-b" x="100" y="825" text-anchor="middle">6</text><rect class="box-s" x="130.0" y="882.0" width="235.0" height="86.0" rx="8"/><text class="t-b" x="140.0" y="902.0">Non : publication possible</text><text class="t-sm" x="140.0" y="920.0">après accord écrit du parent,</text><text class="t-sm" x="140.0" y="934.0">accord de l&#x27;enfant et</text><text class="t-sm" x="140.0" y="948.0">vérification de l&#x27;anonymisation</text><line class="arrow-soft" x1="335.0" y1="856.0" x2="247.5" y2="880.0" marker-end="url(#fourche-avant-de-publier-arr)"/><rect class="box-b" x="385.0" y="882.0" width="235.0" height="38.0" rx="8"/><text class="t-b" x="395.0" y="902.0">Oui : attendre</text><line class="arrow-soft" x1="415.0" y1="856.0" x2="502.5" y2="880.0" marker-end="url(#fourche-avant-de-publier-arr)"/></svg>