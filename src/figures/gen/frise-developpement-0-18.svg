<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" role="img" aria-labelledby="frise-developpement-0-18-t frise-developpement-0-18-d" class="scroll" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="frise-developpement-0-18-t">Quatre lignes de développement, de 0 à 18 ans</title><desc id="frise-developpement-0-18-d">Frise horizontale de 0 à 18 ans avec quatre bandes : corps (marche vers 1 an, puberté entre 8 et 14 ans), pensée (intelligence sensori-motrice 0-2 ans, pensée préopératoire 2-6 ans, opérations concrètes 6-12 ans, raisonnement sur des hypothèses à partir de 11-12 ans, d&#x27;après Piaget nuancé par Barrouillet), émotions et relations (attachement 0-2 ans, contrôle avec effort 3-7 ans, théorie de l&#x27;esprit 4-5 ans, comparaison sociale 6-12 ans, statut dans le groupe 10-12 ans, influence des pairs 12-18 ans), autonomie (premiers choix 3-6 ans, responsabilités 6-12 ans, identité et affiliations 15-18 ans). Les âges sont des moyennes indicatives, pas des normes à atteindre.</desc><rect class="f4 area" x="223.3" y="14" width="128.9" height="16" rx="3"/><text class="t-sm" x="287.8" y="26" text-anchor="middle">6-10</text><rect class="f1 area" x="352.2" y="14" width="64.4" height="16" rx="3"/><text class="t-sm" x="384.4" y="26" text-anchor="middle">10-12</text><rect class="f3 area" x="416.7" y="14" width="96.7" height="16" rx="3"/><text class="t-sm" x="465.0" y="26" text-anchor="middle">12-15</text><rect class="f2 area" x="513.3" y="14" width="96.7" height="16" rx="3"/><text class="t-sm" x="561.7" y="26" text-anchor="middle">15-18</text><rect class="box" x="30" y="48" width="580" height="64" rx="6"/><text class="t-b" x="38" y="64">Corps</text><circle class="f1" cx="62.2" cy="106" r="4"/><line class="line-soft" x1="62.2" y1="81" x2="62.2" y2="102"/><text class="t-sm" x="68.2" y="78.0" text-anchor="start">marche</text><circle class="f1" cx="287.8" cy="106" r="4"/><line class="line-soft" x1="287.8" y1="81" x2="287.8" y2="102"/><text class="t-sm" x="293.8" y="78.0" text-anchor="start">puberté : début entre 8 et 14 ans</text><circle class="f1" cx="481.1" cy="106" r="4"/><line class="line-soft" x1="481.1" y1="94" x2="481.1" y2="102"/><text class="t-sm" x="487.1" y="91.0" text-anchor="start">fin de la poussée</text><rect class="box-p" x="30" y="118" width="580" height="64" rx="6"/><text class="t-b" x="38" y="134">Pensée</text><circle class="f1" cx="36.4" cy="176" r="4"/><line class="line-soft" x1="36.4" y1="151" x2="36.4" y2="172"/><text class="t-sm" x="42.4" y="148.0" text-anchor="start">sens et action</text><circle class="f1" cx="94.4" cy="176" r="4"/><line class="line-soft" x1="94.4" y1="164" x2="94.4" y2="172"/><text class="t-sm" x="100.4" y="161.0" text-anchor="start">images et mots</text><circle class="f1" cx="223.3" cy="176" r="4"/><line class="line-soft" x1="223.3" y1="151" x2="223.3" y2="172"/><text class="t-sm" x="229.3" y="148.0" text-anchor="start">logique du concret</text><circle class="f1" cx="400.6" cy="176" r="4"/><line class="line-soft" x1="400.6" y1="151" x2="400.6" y2="172"/><text class="t-sm" x="406.6" y="148.0" text-anchor="start">raisonner sur des hypothèses</text><rect class="box-a" x="30" y="188" width="580" height="64" rx="6"/><text class="t-b" x="38" y="204">Émotions et relations</text><circle class="f2" cx="39.7" cy="246" r="4"/><line class="line-soft" x1="39.7" y1="221" x2="39.7" y2="242"/><text class="t-sm" x="45.7" y="218.0" text-anchor="start">attachement</text><circle class="f2" cx="126.7" cy="246" r="4"/><line class="line-soft" x1="126.7" y1="221" x2="126.7" y2="242"/><text class="t-sm" x="132.7" y="218.0" text-anchor="start">contrôle de soi</text><circle class="f2" cx="175.0" cy="246" r="4"/><line class="line-soft" x1="175.0" y1="234" x2="175.0" y2="242"/><text class="t-sm" x="181.0" y="231.0" text-anchor="start">théorie de l&#x27;esprit</text><circle class="f2" cx="352.2" cy="246" r="4"/><line class="line-soft" x1="352.2" y1="221" x2="352.2" y2="242"/><text class="t-sm" x="358.2" y="218.0" text-anchor="start">statut dans le groupe</text><circle class="f2" cx="448.9" cy="246" r="4"/><line class="line-soft" x1="448.9" y1="234" x2="448.9" y2="242"/><text class="t-sm" x="454.9" y="231.0" text-anchor="start">poids des pairs</text><rect class="box-s" x="30" y="258" width="580" height="64" rx="6"/><text class="t-b" x="38" y="274">Autonomie</text><circle class="f4" cx="126.7" cy="316" r="4"/><line class="line-soft" x1="126.7" y1="291" x2="126.7" y2="312"/><text class="t-sm" x="132.7" y="288.0" text-anchor="start">premiers choix</text><circle class="f4" cx="255.6" cy="316" r="4"/><line class="line-soft" x1="255.6" y1="291" x2="255.6" y2="312"/><text class="t-sm" x="261.6" y="288.0" text-anchor="start">responsabilités</text><circle class="f4" cx="513.3" cy="316" r="4"/><line class="line-soft" x1="513.3" y1="291" x2="513.3" y2="312"/><text class="t-sm" x="507.3" y="288.0" text-anchor="end">identité, affiliations</text><line class="line" x1="30" y1="332" x2="610" y2="332"/><line class="line" x1="30.0" y1="328" x2="30.0" y2="336"/><text class="t-sm" x="30.0" y="350" text-anchor="middle">0 ans</text><line class="line" x1="94.4" y1="328" x2="94.4" y2="336"/><text class="t-sm" x="94.4" y="350" text-anchor="middle">2 ans</text><line class="line" x1="223.3" y1="328" x2="223.3" y2="336"/><text class="t-sm" x="223.3" y="350" text-anchor="middle">6 ans</text><line class="line" x1="352.2" y1="328" x2="352.2" y2="336"/><text class="t-sm" x="352.2" y="350" text-anchor="middle">10 ans</text><line class="line" x1="416.7" y1="328" x2="416.7" y2="336"/><text class="t-sm" x="416.7" y="350" text-anchor="middle">12 ans</text><line class="line" x1="513.3" y1="328" x2="513.3" y2="336"/><text class="t-sm" x="513.3" y="350" text-anchor="middle">15 ans</text><line class="line" x1="610.0" y1="328" x2="610.0" y2="336"/><text class="t-sm" x="610.0" y="350" text-anchor="middle">18 ans</text><text class="t-sm" x="10.0" y="362.0" text-anchor="start">Âges moyens indicatifs, pas des normes à atteindre : chaque enfant suit la même séquence à son</text><text class="t-sm" x="10.0" y="377.0" text-anchor="start">rythme (Piaget ; Barrouillet, 2015 ; Bowlby ; Wellman et al., 2001 ; Pouwels et al., 2018).</text></svg>