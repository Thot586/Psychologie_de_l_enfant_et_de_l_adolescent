<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-labelledby="escalier-ecoute-t escalier-ecoute-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="escalier-ecoute-t">L&#x27;escalier de l&#x27;écoute</title><desc id="escalier-ecoute-d">Cinq marches : accueillir (merci de m&#x27;en parler) ; écouter sans couper (raconte-moi) ; reformuler (si je comprends bien…) ; ne pas promettre le secret (je ne garderai pas ça pour moi si tu es en danger) ; orienter et revenir (on va voir ensemble qui peut aider).</desc><rect class="box" x="20.0" y="288.0" width="116.0" height="92.0" rx="4"/><text class="t-b" x="28.0" y="306.0" text-anchor="start">1. Accueillir</text><text class="t-sm" x="28.0" y="325.0" text-anchor="start">« merci de m&#x27;en</text><text class="t-sm" x="28.0" y="338.0" text-anchor="start">parler »</text><rect class="box" x="140.0" y="236.0" width="116.0" height="144.0" rx="4"/><text class="t-b" x="148.0" y="254.0" text-anchor="start">2. Écouter</text><text class="t-b" x="148.0" y="269.0" text-anchor="start">sans couper</text><text class="t-sm" x="148.0" y="288.0" text-anchor="start">« raconte-moi »</text><rect class="box" x="260.0" y="184.0" width="116.0" height="196.0" rx="4"/><text class="t-b" x="268.0" y="202.0" text-anchor="start">3. Reformuler</text><text class="t-sm" x="268.0" y="221.0" text-anchor="start">« si je</text><text class="t-sm" x="268.0" y="234.0" text-anchor="start">comprends bien…</text><text class="t-sm" x="268.0" y="247.0" text-anchor="start">»</text><rect class="box" x="380.0" y="132.0" width="116.0" height="248.0" rx="4"/><text class="t-b" x="388.0" y="150.0" text-anchor="start">4. Ne pas</text><text class="t-b" x="388.0" y="165.0" text-anchor="start">promettre le</text><text class="t-b" x="388.0" y="180.0" text-anchor="start">secret</text><text class="t-sm" x="388.0" y="199.0" text-anchor="start">« je ne garderai</text><text class="t-sm" x="388.0" y="212.0" text-anchor="start">pas ça pour moi</text><text class="t-sm" x="388.0" y="225.0" text-anchor="start">si tu es en</text><text class="t-sm" x="388.0" y="238.0" text-anchor="start">danger »</text><rect class="box-s" x="500.0" y="80.0" width="116.0" height="300.0" rx="4"/><text class="t-b" x="508.0" y="98.0" text-anchor="start">5. Orienter et</text><text class="t-b" x="508.0" y="113.0" text-anchor="start">revenir</text><text class="t-sm" x="508.0" y="132.0" text-anchor="start">« on va voir</text><text class="t-sm" x="508.0" y="145.0" text-anchor="start">ensemble qui</text><text class="t-sm" x="508.0" y="158.0" text-anchor="start">peut aider »</text><text class="t-sm" x="10.0" y="388.0" text-anchor="start">Cinq gestes qui ouvrent la parole ; aucun ne demande de compétence technique.</text></svg>