<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" width="640" height="324" role="img" aria-labelledby="usage-problematique-hbsc-t usage-problematique-hbsc-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="usage-problematique-hbsc-t">Usage problématique en Europe, Asie centrale et Canada</title><desc id="usage-problematique-hbsc-d">Barres horizontales en pourcentage d&#x27;élèves de 11, 13 et 15 ans, en trois blocs. Évolution des réseaux sociaux : usage problématique de 7 % en 2018 et de 11 % en 2022. Par sexe en 2022 : 13 % des filles et 9 % des garçons. Jeu vidéo problématique : 12 % de l&#x27;ensemble, 16 % des garçons et 7 % des filles ; parmi ceux qui jouent, 22 % jouent quatre heures ou plus les jours de jeu. Enquête menée en Europe, en Asie centrale et au Canada (OMS Europe, 2024 ; Boniel-Nissim et al., 2024). Ces données ne décrivent pas Madagascar : elles viennent de pays où presque tous les jeunes sont connectés.</desc><line class="grid" x1="250.0" y1="12" x2="250.0" y2="290"/><text class="t-sm" x="250.0" y="306" text-anchor="middle">0</text><line class="grid" x1="314.0" y1="12" x2="314.0" y2="290"/><text class="t-sm" x="314.0" y="306" text-anchor="middle">5</text><line class="grid" x1="378.0" y1="12" x2="378.0" y2="290"/><text class="t-sm" x="378.0" y="306" text-anchor="middle">10</text><line class="grid" x1="442.0" y1="12" x2="442.0" y2="290"/><text class="t-sm" x="442.0" y="306" text-anchor="middle">15</text><line class="grid" x1="506.0" y1="12" x2="506.0" y2="290"/><text class="t-sm" x="506.0" y="306" text-anchor="middle">20</text><line class="grid" x1="570.0" y1="12" x2="570.0" y2="290"/><text class="t-sm" x="570.0" y="306" text-anchor="middle">25</text><path class="f1" d="M250.0,24 h85.60000000000002 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-85.60000000000002 z"><title>Réseaux sociaux · usage problématique, 2018 : 7 %</title></path><text x="240" y="28.0" text-anchor="end" dominant-baseline="middle">Réseaux sociaux · usage</text><text x="240" y="43.0" text-anchor="end" dominant-baseline="middle">problématique, 2018</text><text class="t-num" x="347.6" y="35" dominant-baseline="middle">7 %</text><path class="f1" d="M250.0,58 h136.8 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-136.8 z"><title>Réseaux sociaux · usage problématique, 2022 : 11 %</title></path><text x="240" y="62.0" text-anchor="end" dominant-baseline="middle">Réseaux sociaux · usage</text><text x="240" y="77.0" text-anchor="end" dominant-baseline="middle">problématique, 2022</text><text class="t-num" x="398.8" y="69" dominant-baseline="middle">11 %</text><path class="f1" d="M250.0,92 h162.39999999999998 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-162.39999999999998 z"><title>Réseaux sociaux 2022 · filles : 13 %</title></path><text x="240" y="103.0" text-anchor="end" dominant-baseline="middle">Réseaux sociaux 2022 · filles</text><text class="t-num" x="424.4" y="103" dominant-baseline="middle">13 %</text><path class="f1" d="M250.0,126 h111.19999999999999 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-111.19999999999999 z"><title>Réseaux sociaux 2022 · garçons : 9 %</title></path><text x="240" y="137.0" text-anchor="end" dominant-baseline="middle">Réseaux sociaux 2022 · garçons</text><text class="t-num" x="373.2" y="137" dominant-baseline="middle">9 %</text><path class="f1" d="M250.0,160 h149.60000000000002 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-149.60000000000002 z"><title>Jeu vidéo problématique · ensemble : 12 %</title></path><text x="240" y="164.0" text-anchor="end" dominant-baseline="middle">Jeu vidéo problématique ·</text><text x="240" y="179.0" text-anchor="end" dominant-baseline="middle">ensemble</text><text class="t-num" x="411.6" y="171" dominant-baseline="middle">12 %</text><path class="f1" d="M250.0,194 h200.8 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-200.8 z"><title>Jeu vidéo problématique · garçons : 16 %</title></path><text x="240" y="198.0" text-anchor="end" dominant-baseline="middle">Jeu vidéo problématique ·</text><text x="240" y="213.0" text-anchor="end" dominant-baseline="middle">garçons</text><text class="t-num" x="462.8" y="205" dominant-baseline="middle">16 %</text><path class="f1" d="M250.0,228 h85.60000000000002 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-85.60000000000002 z"><title>Jeu vidéo problématique · filles : 7 %</title></path><text x="240" y="239.0" text-anchor="end" dominant-baseline="middle">Jeu vidéo problématique · filles</text><text class="t-num" x="347.6" y="239" dominant-baseline="middle">7 %</text><path class="f1" d="M250.0,262 h277.6 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-277.6 z"><title>Joueurs jouant 4 h ou plus les jours de jeu : 22 %</title></path><text x="240" y="266.0" text-anchor="end" dominant-baseline="middle">Joueurs jouant 4 h ou plus les</text><text x="240" y="281.0" text-anchor="end" dominant-baseline="middle">jours de jeu</text><text class="t-num" x="539.6" y="273" dominant-baseline="middle">22 %</text></svg>