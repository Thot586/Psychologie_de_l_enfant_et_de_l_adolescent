<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 726" role="img" aria-labelledby="arbre-decisionnel-t arbre-decisionnel-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="arbre-decisionnel-t">Du signal au signalement</title><desc id="arbre-decisionnel-d">Organigramme en six étapes : signal repéré ; entretien avec l&#x27;enfant, répétition, rapport de force et retentissement ? si non, conflit ou agression isolée : médiation éducative, suivi, réévaluation datée ; si oui, danger immédiat ? (idées suicidaires, violences sexuelles ou graves) si oui, urgence : ne pas laisser seul, mettre à l&#x27;abri, accompagner vers les soins, signaler ; sinon plan d&#x27;action coordonné (école, protection de la victime, travail avec l&#x27;auteur, témoins, parents) ; signalement selon le cas (Réseau de Protection de l&#x27;Enfant, 147, arozaza.mg si dimension en ligne ou sexuelle) ; suivi et réévaluation datés.</desc><defs><marker id="arbre-decisionnel-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><rect class="box-p" x="130.0" y="16.0" width="490.0" height="58.0" rx="8"/><text class="t-b" x="140.0" y="36.0">1. Signal repéré</text><text class="t-sm" x="140.0" y="54.0">somatisations, isolement, chute scolaire, propos inquiétants</text><circle class="f1" cx="100" cy="36" r="14"/><text class="on-fill t-b" x="100" y="41" text-anchor="middle">1</text><line class="arrow" x1="375.0" y1="76.0" x2="375.0" y2="90.0" marker-end="url(#arbre-decisionnel-arr)"/><rect class="box-p" x="130.0" y="94.0" width="490.0" height="54.0" rx="8"/><text class="t-b" x="140.0" y="114.0">2. Entretien avec l&#x27;enfant : répétition, rapport de force,</text><text class="t-b" x="140.0" y="130.0">retentissement ?</text><circle class="f1" cx="100" cy="114" r="14"/><text class="on-fill t-b" x="100" y="119" text-anchor="middle">2</text><rect class="box-s" x="130.0" y="176.0" width="235.0" height="88.0" rx="8"/><text class="t-b" x="140.0" y="196.0">Non : conflit ou agression</text><text class="t-b" x="140.0" y="212.0">isolée</text><text class="t-sm" x="140.0" y="230.0">médiation éducative, suivi,</text><text class="t-sm" x="140.0" y="244.0">réévaluation datée</text><line class="arrow-soft" x1="335.0" y1="150.0" x2="247.5" y2="174.0" marker-end="url(#arbre-decisionnel-arr)"/><rect class="box-a" x="385.0" y="176.0" width="235.0" height="58.0" rx="8"/><text class="t-b" x="395.0" y="196.0">Oui : harcèlement présumé</text><text class="t-sm" x="395.0" y="214.0">passer à l&#x27;étape suivante</text><line class="arrow-soft" x1="415.0" y1="150.0" x2="502.5" y2="174.0" marker-end="url(#arbre-decisionnel-arr)"/><line class="arrow" x1="375.0" y1="266.0" x2="375.0" y2="280.0" marker-end="url(#arbre-decisionnel-arr)"/><rect class="box-p" x="130.0" y="284.0" width="490.0" height="54.0" rx="8"/><text class="t-b" x="140.0" y="304.0">3. Danger immédiat ? idées suicidaires, violences sexuelles ou</text><text class="t-b" x="140.0" y="320.0">graves</text><circle class="f1" cx="100" cy="304" r="14"/><text class="on-fill t-b" x="100" y="309" text-anchor="middle">3</text><rect class="box-s" x="130.0" y="366.0" width="235.0" height="58.0" rx="8"/><text class="t-b" x="140.0" y="386.0">Non : plan d&#x27;action</text><text class="t-sm" x="140.0" y="404.0">étape suivante</text><line class="arrow-soft" x1="335.0" y1="340.0" x2="247.5" y2="364.0" marker-end="url(#arbre-decisionnel-arr)"/><rect class="box-b" x="385.0" y="366.0" width="235.0" height="86.0" rx="8"/><text class="t-b" x="395.0" y="386.0">Oui : urgence</text><text class="t-sm" x="395.0" y="404.0">ne pas laisser seul, mettre à</text><text class="t-sm" x="395.0" y="418.0">l&#x27;abri, accompagner vers les</text><text class="t-sm" x="395.0" y="432.0">soins, signaler</text><line class="arrow-soft" x1="415.0" y1="340.0" x2="502.5" y2="364.0" marker-end="url(#arbre-decisionnel-arr)"/><line class="arrow" x1="375.0" y1="454.0" x2="375.0" y2="468.0" marker-end="url(#arbre-decisionnel-arr)"/><rect class="box-p" x="130.0" y="472.0" width="490.0" height="72.0" rx="8"/><text class="t-b" x="140.0" y="492.0">4. Plan d&#x27;action coordonné</text><text class="t-sm" x="140.0" y="510.0">informer l&#x27;école, protéger la victime, travailler avec l&#x27;auteur,</text><text class="t-sm" x="140.0" y="524.0">mobiliser les témoins, associer les parents</text><circle class="f1" cx="100" cy="492" r="14"/><text class="on-fill t-b" x="100" y="497" text-anchor="middle">4</text><line class="arrow" x1="375.0" y1="546.0" x2="375.0" y2="560.0" marker-end="url(#arbre-decisionnel-arr)"/><rect class="box-p" x="130.0" y="564.0" width="490.0" height="72.0" rx="8"/><text class="t-b" x="140.0" y="584.0">5. Signalement selon le cas</text><text class="t-sm" x="140.0" y="602.0">Réseau de Protection de l&#x27;Enfant ; 147 ; arozaza.mg si dimension en</text><text class="t-sm" x="140.0" y="616.0">ligne ou sexuelle</text><circle class="f1" cx="100" cy="584" r="14"/><text class="on-fill t-b" x="100" y="589" text-anchor="middle">5</text><line class="arrow" x1="375.0" y1="638.0" x2="375.0" y2="652.0" marker-end="url(#arbre-decisionnel-arr)"/><rect class="box-s" x="130.0" y="656.0" width="490.0" height="58.0" rx="8"/><text class="t-b" x="140.0" y="676.0">6. Suivi et réévaluation datés</text><text class="t-sm" x="140.0" y="694.0">documenter par écrit</text><circle class="f1" cx="100" cy="676" r="14"/><text class="on-fill t-b" x="100" y="681" text-anchor="middle">6</text></svg>