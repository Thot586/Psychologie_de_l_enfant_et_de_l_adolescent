<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 572" role="img" aria-labelledby="fourche-un-indice-ou-un-faisceau-t fourche-un-indice-ou-un-faisceau-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="fourche-un-indice-ou-un-faisceau-t">Un seul indice, ou un faisceau ?</title><desc id="fourche-un-indice-ou-un-faisceau-d">Organigramme de raisonnement en quatre étapes. Départ : je remarque quelque chose chez un enfant, je note par écrit ce que j&#x27;ai vu et entendu, avec la date. Premier embranchement : un seul signe et une seule source ? Si oui, je note, je reste attentif et je reviens voir dans quelques jours. Si non, plusieurs signes ou plusieurs sources, je passe aux trois R. Second embranchement : les trois R sont-ils réunis, répétition, rapport de force, retentissement ? Si non, conflit ou situation à surveiller, avec suivi et réévaluation à une date fixée. Si oui, harcèlement probable : protéger, transmettre à la personne responsable, vérifier à une date fixée. Branche prioritaire, valable à tout moment du raisonnement : idées de mort, blessures auto-infligées, violence sexuelle ou danger immédiat, ne pas laisser l&#x27;enfant seul, écarter les moyens, accompagner le jour même vers un service d&#x27;urgence ou de psychiatrie. Schéma de raisonnement sans donnée chiffrée : opinion d&#x27;expert et recommandations officielles (NASEM, 2016 ; OMS, 2019 ; Défenseur des droits, 2023), branche d&#x27;urgence d&#x27;après le guide mhGAP (2023).</desc><defs><marker id="fourche-un-indice-ou-un-faisceau-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><rect class="box-p" x="130.0" y="16.0" width="490.0" height="58.0" rx="8"/><text class="t-b" x="140.0" y="36.0">1. Je remarque quelque chose chez un enfant</text><text class="t-sm" x="140.0" y="54.0">noter par écrit ce qui a été vu et entendu, avec la date</text><circle class="f1" cx="100" cy="36" r="14"/><text class="on-fill t-b" x="100" y="41" text-anchor="middle">1</text><line class="arrow" x1="375.0" y1="76.0" x2="375.0" y2="90.0" marker-end="url(#fourche-un-indice-ou-un-faisceau-arr)"/><rect class="box-p" x="130.0" y="94.0" width="490.0" height="38.0" rx="8"/><text class="t-b" x="140.0" y="114.0">2. Un seul signe, une seule source ?</text><circle class="f1" cx="100" cy="114" r="14"/><text class="on-fill t-b" x="100" y="119" text-anchor="middle">2</text><rect class="box-s" x="130.0" y="160.0" width="235.0" height="86.0" rx="8"/><text class="t-b" x="140.0" y="180.0">Oui : un seul indice</text><text class="t-sm" x="140.0" y="198.0">je note avec la date, je reste</text><text class="t-sm" x="140.0" y="212.0">attentif, je reviens voir dans</text><text class="t-sm" x="140.0" y="226.0">quelques jours</text><line class="arrow-soft" x1="335.0" y1="134.0" x2="247.5" y2="158.0" marker-end="url(#fourche-un-indice-ou-un-faisceau-arr)"/><rect class="box-a" x="385.0" y="160.0" width="235.0" height="74.0" rx="8"/><text class="t-b" x="395.0" y="180.0">Non : plusieurs signes ou</text><text class="t-b" x="395.0" y="196.0">plusieurs sources</text><text class="t-sm" x="395.0" y="214.0">passer aux trois R</text><line class="arrow-soft" x1="415.0" y1="134.0" x2="502.5" y2="158.0" marker-end="url(#fourche-un-indice-ou-un-faisceau-arr)"/><line class="arrow" x1="375.0" y1="248.0" x2="375.0" y2="262.0" marker-end="url(#fourche-un-indice-ou-un-faisceau-arr)"/><rect class="box-p" x="130.0" y="266.0" width="490.0" height="58.0" rx="8"/><text class="t-b" x="140.0" y="286.0">3. Les trois R sont-ils réunis ?</text><text class="t-sm" x="140.0" y="304.0">répétition, rapport de force, retentissement</text><circle class="f1" cx="100" cy="286" r="14"/><text class="on-fill t-b" x="100" y="291" text-anchor="middle">3</text><rect class="box-s" x="130.0" y="352.0" width="235.0" height="88.0" rx="8"/><text class="t-b" x="140.0" y="372.0">Non : conflit ou situation à</text><text class="t-b" x="140.0" y="388.0">surveiller</text><text class="t-sm" x="140.0" y="406.0">suivi, réévaluation à une date</text><text class="t-sm" x="140.0" y="420.0">fixée</text><line class="arrow-soft" x1="335.0" y1="326.0" x2="247.5" y2="350.0" marker-end="url(#fourche-un-indice-ou-un-faisceau-arr)"/><rect class="box-a" x="385.0" y="352.0" width="235.0" height="86.0" rx="8"/><text class="t-b" x="395.0" y="372.0">Oui : harcèlement probable</text><text class="t-sm" x="395.0" y="390.0">protéger, transmettre à la</text><text class="t-sm" x="395.0" y="404.0">personne responsable, vérifier à</text><text class="t-sm" x="395.0" y="418.0">une date fixée</text><line class="arrow-soft" x1="415.0" y1="326.0" x2="502.5" y2="350.0" marker-end="url(#fourche-un-indice-ou-un-faisceau-arr)"/><line class="arrow" x1="375.0" y1="442.0" x2="375.0" y2="456.0" marker-end="url(#fourche-un-indice-ou-un-faisceau-arr)"/><rect class="box-b" x="130.0" y="460.0" width="490.0" height="100.0" rx="8"/><text class="t-b" x="140.0" y="480.0">4. À tout moment, priorité sur le reste</text><text class="t-sm" x="140.0" y="498.0">idées de mort, blessures auto-infligées, violence sexuelle ou danger</text><text class="t-sm" x="140.0" y="512.0">immédiat</text><text class="t-sm" x="140.0" y="526.0">ne pas laisser seul, écarter les moyens, accompagner le jour même</text><text class="t-sm" x="140.0" y="540.0">vers un service d&#x27;urgence ou de psychiatrie</text><circle class="f1" cx="100" cy="480" r="14"/><text class="on-fill t-b" x="100" y="485" text-anchor="middle">4</text></svg>