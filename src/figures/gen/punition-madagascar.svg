<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" width="640" height="272" role="img" aria-labelledby="punition-madagascar-t punition-madagascar-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="punition-madagascar-t">Punition physique des enfants à Madagascar : ce que vivent les enfants, ce que pensent les adultes</title><desc id="punition-madagascar-d">Barres horizontales issues de trois enquêtes qui ne portent pas sur la même population. Enfants de 2 à 14 ans punis physiquement dans le mois précédent, régions du Sud, MICS 2012 : 64 % ; dont punition sévère : 20 %. Enfants de 1 à 14 ans soumis à une discipline violente, national, MICS-7 2025, résultats préliminaires : 85 %. Adultes qui estiment le châtiment corporel fréquent à la maison, enquête nationale 2018 auprès de 2 523 répondants : 86 % ; qui le jugent acceptable : 65 %. Le châtiment corporel reste licite au domicile.</desc><line class="grid" x1="250.0" y1="12" x2="250.0" y2="238"/><text class="t-sm" x="250.0" y="254" text-anchor="middle">0</text><line class="grid" x1="282.0" y1="12" x2="282.0" y2="238"/><text class="t-sm" x="282.0" y="254" text-anchor="middle">10</text><line class="grid" x1="314.0" y1="12" x2="314.0" y2="238"/><text class="t-sm" x="314.0" y="254" text-anchor="middle">20</text><line class="grid" x1="346.0" y1="12" x2="346.0" y2="238"/><text class="t-sm" x="346.0" y="254" text-anchor="middle">30</text><line class="grid" x1="378.0" y1="12" x2="378.0" y2="238"/><text class="t-sm" x="378.0" y="254" text-anchor="middle">40</text><line class="grid" x1="410.0" y1="12" x2="410.0" y2="238"/><text class="t-sm" x="410.0" y="254" text-anchor="middle">50</text><line class="grid" x1="442.0" y1="12" x2="442.0" y2="238"/><text class="t-sm" x="442.0" y="254" text-anchor="middle">60</text><line class="grid" x1="474.0" y1="12" x2="474.0" y2="238"/><text class="t-sm" x="474.0" y="254" text-anchor="middle">70</text><line class="grid" x1="506.0" y1="12" x2="506.0" y2="238"/><text class="t-sm" x="506.0" y="254" text-anchor="middle">80</text><line class="grid" x1="538.0" y1="12" x2="538.0" y2="238"/><text class="t-sm" x="538.0" y="254" text-anchor="middle">90</text><line class="grid" x1="570.0" y1="12" x2="570.0" y2="238"/><text class="t-sm" x="570.0" y="254" text-anchor="middle">100</text><path class="f1" d="M250.0,28 h200.8 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-200.8 z"><title>Punis physiquement dans le mois · 2-14 ans, Sud, 2012 : 64 %</title></path><text x="240" y="32.0" text-anchor="end" dominant-baseline="middle">Punis physiquement dans le mois</text><text x="240" y="47.0" text-anchor="end" dominant-baseline="middle">· 2-14 ans, Sud, 2012</text><text class="t-num" x="462.8" y="39" dominant-baseline="middle">64 %</text><path class="f1" d="M250.0,72 h60.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-60.0 z"><title>dont punition sévère · 2-14 ans, Sud, 2012 : 20 %</title></path><text x="240" y="76.0" text-anchor="end" dominant-baseline="middle">dont punition sévère · 2-14 ans,</text><text x="240" y="91.0" text-anchor="end" dominant-baseline="middle">Sud, 2012</text><text class="t-num" x="322.0" y="83" dominant-baseline="middle">20 %</text><path class="f1" d="M250.0,116 h268.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-268.0 z"><title>Discipline violente dans le mois · 1-14 ans, national, 2025 (préliminaire) : 85 %</title></path><text x="240" y="120.0" text-anchor="end" dominant-baseline="middle">Discipline violente dans le mois</text><text x="240" y="135.0" text-anchor="end" dominant-baseline="middle">· 1-14 ans, national, 2025</text><text class="t-num" x="530.0" y="127" dominant-baseline="middle">85 %</text><path class="f1" d="M250.0,160 h271.20000000000005 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-271.20000000000005 z"><title>Adultes : « le châtiment corporel est fréquent à la maison » · 2018 : 86 %</title></path><text x="240" y="164.0" text-anchor="end" dominant-baseline="middle">Adultes : « le châtiment</text><text x="240" y="179.0" text-anchor="end" dominant-baseline="middle">corporel est fréquent à la</text><text class="t-num" x="533.2" y="171" dominant-baseline="middle">86 %</text><path class="f1" d="M250.0,204 h204.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-204.0 z"><title>Adultes : « le châtiment corporel est acceptable » · 2018 : 65 %</title></path><text x="240" y="208.0" text-anchor="end" dominant-baseline="middle">Adultes : « le châtiment</text><text x="240" y="223.0" text-anchor="end" dominant-baseline="middle">corporel est acceptable » · 2018</text><text class="t-num" x="466.0" y="215" dominant-baseline="middle">65 %</text></svg>