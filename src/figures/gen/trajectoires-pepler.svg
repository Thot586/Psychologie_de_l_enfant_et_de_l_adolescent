<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" width="640" height="228" role="img" aria-labelledby="trajectoires-pepler-t trajectoires-pepler-d" class="" font-family="Public Sans, Segoe UI, system-ui, sans-serif" font-size="13"><title id="trajectoires-pepler-t">Quatre trajectoires de harcèlement chez 871 élèves suivis pendant 7 ans</title><desc id="trajectoires-pepler-d">Barres horizontales : 41,6 % ne harcèlent presque jamais ; 35,1 % restent à un niveau modéré ; 13,4 % commencent modérément puis arrêtent ; 9,9 % harcèlent de façon élevée et stable (Pepler et al. 2008).</desc><line class="grid" x1="250.0" y1="12" x2="250.0" y2="194"/><text class="t-sm" x="250.0" y="210" text-anchor="middle">0</text><line class="grid" x1="314.0" y1="12" x2="314.0" y2="194"/><text class="t-sm" x="314.0" y="210" text-anchor="middle">10</text><line class="grid" x1="378.0" y1="12" x2="378.0" y2="194"/><text class="t-sm" x="378.0" y="210" text-anchor="middle">20</text><line class="grid" x1="442.0" y1="12" x2="442.0" y2="194"/><text class="t-sm" x="442.0" y="210" text-anchor="middle">30</text><line class="grid" x1="506.0" y1="12" x2="506.0" y2="194"/><text class="t-sm" x="506.0" y="210" text-anchor="middle">40</text><line class="grid" x1="570.0" y1="12" x2="570.0" y2="194"/><text class="t-sm" x="570.0" y="210" text-anchor="middle">50</text><path class="f1" d="M250.0,28 h262.24 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-262.24 z"><title>Presque jamais : 41,6 %</title></path><text x="240" y="39.0" text-anchor="end" dominant-baseline="middle">Presque jamais</text><text class="t-num" x="524.2" y="39" dominant-baseline="middle">41,6 %</text><path class="f1" d="M250.0,72 h220.64 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-220.64 z"><title>Niveau modéré stable : 35,1 %</title></path><text x="240" y="83.0" text-anchor="end" dominant-baseline="middle">Niveau modéré stable</text><text class="t-num" x="482.6" y="83" dominant-baseline="middle">35,1 %</text><path class="f1" d="M250.0,116 h81.75999999999999 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-81.75999999999999 z"><title>Modéré puis arrêt : 13,4 %</title></path><text x="240" y="127.0" text-anchor="end" dominant-baseline="middle">Modéré puis arrêt</text><text class="t-num" x="343.8" y="127" dominant-baseline="middle">13,4 %</text><path class="f1" d="M250.0,160 h59.360000000000014 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-59.360000000000014 z"><title>Élevé et stable : 9,9 %</title></path><text x="240" y="171.0" text-anchor="end" dominant-baseline="middle">Élevé et stable</text><text class="t-num" x="321.4" y="171" dominant-baseline="middle">9,9 %</text></svg>