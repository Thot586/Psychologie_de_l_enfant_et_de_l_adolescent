<!DOCTYPE html>
<html lang="fr" data-build="{{build_id}}" data-page="{{slug}}" data-session="{{session}}" data-type="{{type}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{{title_tag}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{author_short}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{title_tag}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="{{site_title}}">
<meta name="theme-color" content="{{theme_light}}" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="{{theme_dark}}" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{root}}assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}assets/icons/icon-192.png">
<link rel="manifest" href="{{root}}manifest.webmanifest">
<link rel="preload" href="{{root}}assets/fonts/public-sans-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{root}}assets/fonts/literata-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}assets/css/styles.css?v={{build_id}}">
<script>(function(){try{var d=document.documentElement,L=function(k){var v=localStorage.getItem(k);return v===null?'':(''+v).replace(/^"|"$/g,'');},t=L('theme');if(t==='light'||t==='dark'){d.dataset.theme=t;d.style.colorScheme=t;}var f=L('fs');if(f==='s'||f==='l'||f==='xl')d.dataset.fs=f;if(L('reading')==='essentiel')d.dataset.reading='essentiel';}catch(e){}})();</script>
<!-- Feuille de styles périmée : le HTML est toujours servi par le réseau, ce contrôle est donc
     le seul qui fonctionne quand un ancien service worker sert d'anciennes ressources. Le script
     s'exécute après le <link>, donc la feuille est déjà appliquée. -->
<script>(function(){try{var d=document.documentElement,a=d.getAttribute('data-build')||'';if(!a)return;var c=(getComputedStyle(d).getPropertyValue('--build')||'').trim().replace(/^"|"$/g,'');if(!c||c===a)return;if(sessionStorage.getItem('pea:css')===a)return;sessionStorage.setItem('pea:css',a);var f=function(){location.reload();},p=[];if(window.caches)p.push(caches.keys().then(function(k){return Promise.all(k.filter(function(x){return x.indexOf('pea-')===0;}).map(function(x){return caches.delete(x);}));}));if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)p.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister();}));}));Promise.all(p).then(f,f);}catch(e){}})();</script>
<!-- généré par scripts/build.py ({{build_id}}) : ne pas éditer, modifier src/ et data/ puis relancer le build -->
</head>
<body class="{{body_class}}">
<a class="skip" href="#main">Aller au contenu</a>
