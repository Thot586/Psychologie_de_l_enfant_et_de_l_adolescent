<header class="top" id="top">
  <button class="ibtn" id="menuBtn" type="button" aria-label="Ouvrir le sommaire" aria-controls="rail" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand plain" href="{{root}}index.html" aria-label="{{site_title}} : accueil">
    <span class="mark" aria-hidden="true">Ψ</span>
    <span class="t">{{site_short}}<small>{{brand_sub}}</small></span>
  </a>
  <div class="spacer"></div>
  <div class="search" id="search" role="search">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="q" placeholder="Rechercher dans le site…" aria-label="Rechercher dans le site" autocomplete="off" data-index="{{root}}data/search-index.json" data-root="{{root}}">
    <button class="clr" id="qclr" type="button" aria-label="Effacer la recherche">×</button>
    <div class="results" id="results" role="listbox" aria-label="Résultats de recherche"></div>
  </div>
  <button class="ibtn" id="themeBtn" type="button" aria-label="Changer de thème" title="Thème clair ou sombre">
    <svg class="theme-glyph theme-glyph-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <svg class="theme-glyph theme-glyph-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button class="ibtn" id="settingsBtn" type="button" aria-label="Réglages de lecture" aria-controls="settings" aria-expanded="false" title="Réglages">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h6"/><circle cx="17" cy="12" r="2"/><circle cx="13" cy="18" r="2"/></svg>
  </button>
</header>
<div class="settings" id="settings" aria-label="Réglages de lecture">
  <h2>Réglages</h2>
  <div class="row"><span>Taille du texte</span>
    <div class="seg" role="group" aria-label="Taille du texte">
      <button type="button" data-fs="s" aria-pressed="false">A−</button>
      <button type="button" data-fs="" aria-pressed="true">A</button>
      <button type="button" data-fs="l" aria-pressed="false">A+</button>
      <button type="button" data-fs="xl" aria-pressed="false">A++</button>
    </div>
  </div>
  <div class="row"><span>Lecture</span>
    <div class="seg" role="group" aria-label="Niveau de lecture">
      <button type="button" data-reading="complete" aria-pressed="true">Complète</button>
      <button type="button" data-reading="essentiel" aria-pressed="false">Essentiel</button>
    </div>
  </div>
  <p class="small" style="margin:6px 0 0">« Essentiel » masque les encadrés <em>Approfondir</em> (sources, chiffres exacts, méthode). Le texte principal reste complet.</p>
  <div class="row"><span>Hors ligne</span><button type="button" class="btn o s" id="offlineBtn" hidden>Rendre disponible hors ligne</button><span class="small" id="offlineState">—</span></div>
  <div class="row"><span>Mes données sur cet appareil</span><button type="button" class="btn o s" id="clearData">Effacer</button></div>
</div>
<div class="scrim" id="scrim" aria-hidden="true"></div>
<div class="wrap">
